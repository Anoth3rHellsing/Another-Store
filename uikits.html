<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Another Store — Fun UI Kits</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif;color:#1a2a3a}
body{background:#f0f4f8}

/* ===== ART GALLERY BACKGROUND ===== */
.gallery-bg{position:fixed;inset:0;z-index:0;background:linear-gradient(160deg,#f8fafc 0%,#e8f0f8 30%,#f0f8f4 60%,#faf8f0 100%);overflow:hidden}
.gallery-bg::before{content:'';position:absolute;top:-50%;right:-30%;width:80%;height:80%;background:radial-gradient(circle,rgba(100,180,255,.06) 0%,transparent 70%);pointer-events:none}
.gallery-bg::after{content:'';position:absolute;bottom:-30%;left:-20%;width:60%;height:60%;background:radial-gradient(circle,rgba(100,200,150,.05) 0%,transparent 70%);pointer-events:none}

/* Floating shapes */
.shape{position:absolute;pointer-events:none;opacity:.06}
.shape-1{width:300px;height:300px;top:10%;right:5%;border-radius:30% 70% 70% 30%/30% 30% 70% 70%;background:linear-gradient(135deg,#39A5DC,#74C23C);animation:shapeFloat 15s ease-in-out infinite}
.shape-2{width:200px;height:200px;bottom:15%;left:8%;border-radius:50%;background:linear-gradient(135deg,#F0A93A,#DD5C3E);animation:shapeFloat 18s ease-in-out infinite reverse}
.shape-3{width:150px;height:150px;top:50%;left:40%;border-radius:20%;background:linear-gradient(135deg,#8B5CF6,#39A5DC);animation:shapeFloat 12s ease-in-out infinite 3s;transform:rotate(45deg)}
@keyframes shapeFloat{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(20px,-15px) rotate(5deg)}}

/* ===== LAYOUT ===== */
.gallery-container{position:relative;z-index:1;display:flex;height:100vh;width:100vw}

/* ===== LEFT PANEL — KIT PREVIEW ===== */
.left-panel{flex:0 0 50%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:40px;overflow-y:auto}
.left-panel::-webkit-scrollbar{width:4px}
.left-panel::-webkit-scrollbar-thumb{background:rgba(31,134,200,.2);border-radius:2px}

.kit-preview{text-align:center;animation:kitSlideIn .5s ease-out both;width:100%;max-width:400px}
@keyframes kitSlideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

/* Preview card with live mini-preview */
.preview-card{width:100%;border-radius:20px;overflow:hidden;margin-bottom:24px;box-shadow:0 8px 40px rgba(10,40,80,.12),0 2px 8px rgba(10,40,80,.08);border:1px solid rgba(255,255,255,.8)}
.preview-header{height:8px;display:flex}
.preview-header span{flex:1}
.preview-body{padding:24px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}

/* Kit-specific previews */
.preview-aero .preview-header span:nth-child(1){background:#8FD9F7}
.preview-aero .preview-header span:nth-child(2){background:#39A5DC}
.preview-aero .preview-header span:nth-child(3){background:#1B7FC0}
.preview-aero .preview-body{background:linear-gradient(135deg,#EAF6FF,#D0ECFB)}
.preview-aero .mini-btn{padding:8px 20px;border-radius:20px;background:linear-gradient(to bottom,#8FD9F7,#1B7FC0);color:#fff;font-size:11px;font-weight:600;border:none;box-shadow:0 2px 8px rgba(27,127,192,.3)}
.preview-aero .mini-card{width:80%;padding:12px;border-radius:10px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.8);margin-top:10px;font-size:10px;color:#2C5F7E;text-align:left}

.preview-night .preview-header span:nth-child(1){background:#1a4a7a}
.preview-night .preview-header span:nth-child(2){background:#0a2540}
.preview-night .preview-header span:nth-child(3){background:#051525}
.preview-night .preview-body{background:radial-gradient(ellipse at 50% 120%,#1a4a7a,#051525)}
.preview-night .mini-tile{width:50px;height:50px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:inline-block;margin:4px}
.preview-night .mini-tile.glow{border-color:#6dd5fa;box-shadow:0 0 12px rgba(100,180,255,.4)}
.preview-night .mini-label{color:rgba(255,255,255,.6);font-size:9px;margin-top:8px}

.preview-neon .preview-header span:nth-child(1){background:#ff006e}
.preview-neon .preview-header span:nth-child(2){background:#8338ec}
.preview-neon .preview-header span:nth-child(3){background:#3a86ff}
.preview-neon .preview-body{background:#0a0a0f}
.preview-neon .mini-neon{padding:8px 20px;border-radius:6px;background:transparent;color:#ff006e;font-size:11px;font-weight:700;border:1px solid #ff006e;box-shadow:0 0 10px rgba(255,0,110,.3),inset 0 0 10px rgba(255,0,110,.1);text-shadow:0 0 8px rgba(255,0,110,.5)}
.preview-neon .mini-label{color:rgba(255,255,255,.3);font-size:9px;margin-top:10px}

.preview-retro .preview-header span:nth-child(1){background:#ff6b6b}
.preview-retro .preview-header span:nth-child(2){background:#ffd93d}
.preview-retro .preview-header span:nth-child(3){background:#6bcb77}
.preview-retro .preview-body{background:linear-gradient(180deg,#2d1b69 0%,#11998e 100%)}
.preview-retro .mini-retro{font-family:'Courier New',monospace;font-size:14px;color:#ffd93d;text-shadow:2px 2px 0 #ff6b6b;letter-spacing:2px}
.preview-retro .mini-label{color:rgba(255,255,255,.4);font-size:9px;margin-top:10px;font-family:'Courier New',monospace}

/* Kit info */
.kit-name{font-size:28px;font-weight:700;color:#1a2a3a;margin-bottom:4px}
.kit-tagline{font-size:13px;color:#5a7a9a;margin-bottom:16px;font-style:italic}
.kit-desc{font-size:13.5px;color:#3a5a7a;max-width:360px;margin:0 auto 20px;line-height:1.6}

/* Details */
.kit-details{text-align:left;max-width:360px;margin:0 auto 20px;padding:18px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(10,40,80,.06)}
.kit-details h4{font-size:10px;font-weight:700;color:#5a7a9a;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.kit-details ul{list-style:none;margin-bottom:14px}
.kit-details ul li{font-size:12px;color:#3a5a7a;padding:3px 0 3px 18px;position:relative;line-height:1.5}
.kit-details ul li::before{content:'◆';position:absolute;left:0;top:2px;color:#39A5DC;font-size:8px}
.kit-details .req{font-size:11px;color:#5a7a9a;line-height:1.5;padding-top:12px;border-top:1px solid rgba(10,40,80,.08)}
.kit-details .req strong{color:#1a2a3a}

/* Download button */
.btn-download{display:inline-flex;align-items:center;gap:10px;padding:14px 32px;border-radius:14px;background:linear-gradient(135deg,#39A5DC,#1B7FC0);border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 4px 20px rgba(27,127,192,.25);transition:transform .15s,box-shadow .15s}
.btn-download:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(27,127,192,.35)}
.btn-download:active{transform:translateY(0)}
.btn-download svg{width:18px;height:18px;fill:currentColor}

/* ===== RIGHT PANEL — GALLERY GRID ===== */
.right-panel{flex:1;display:flex;flex-direction:column;padding:30px;background:rgba(255,255,255,.3);backdrop-filter:blur(20px);border-left:1px solid rgba(255,255,255,.5)}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.panel-title{font-size:18px;font-weight:300;color:#1a2a3a;letter-spacing:.5px}
.back-link{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:10px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);color:#3a5a7a;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;transition:background .2s;backdrop-filter:blur(6px)}
.back-link:hover{background:rgba(255,255,255,.9)}
.back-link svg{width:14px;height:14px;fill:currentColor}

/* Gallery cards (larger, more visual) */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;overflow-y:auto;padding-right:8px;flex:1;align-content:start}
.gallery-grid::-webkit-scrollbar{width:4px}
.gallery-grid::-webkit-scrollbar-thumb{background:rgba(31,134,200,.2);border-radius:2px}

.gallery-card{border-radius:16px;cursor:pointer;position:relative;overflow:hidden;background:#fff;border:2px solid rgba(255,255,255,.8);box-shadow:0 4px 20px rgba(10,40,80,.08);transition:all .25s cubic-bezier(.2,.8,.3,1)}
.gallery-card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 12px 40px rgba(10,40,80,.15)}
.gallery-card.active{border-color:#39A5DC;box-shadow:0 0 0 3px rgba(57,165,220,.2),0 8px 30px rgba(10,40,80,.12)}

.card-preview{height:100px;position:relative;overflow:hidden}
.card-preview.aero{background:linear-gradient(135deg,#EAF6FF,#A8DCF4)}
.card-preview.night{background:radial-gradient(ellipse at 50% 120%,#1a4a7a,#051525)}
.card-preview.neon{background:#0a0a0f}
.card-preview.retro{background:linear-gradient(180deg,#2d1b69,#11998e)}

.card-preview .card-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.card-preview .card-icon svg{width:20px;height:20px;fill:#fff}
.card-preview .card-icon.blue{background:linear-gradient(135deg,#8FD9F7,#1B7FC0)}
.card-preview .card-icon.purple{background:linear-gradient(135deg,#c79cff,#7b4cd9)}
.card-preview .card-icon.red{background:linear-gradient(135deg,#ff006e,#8338ec)}
.card-preview .card-icon.amber{background:linear-gradient(135deg,#ffd93d,#ff6b6b)}

.card-info{padding:12px 14px}
.card-info h3{font-size:13px;font-weight:600;color:#1a2a3a;margin-bottom:2px}
.card-info p{font-size:10.5px;color:#5a7a9a;line-height:1.3}
.card-badge{position:absolute;top:8px;right:8px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.9);color:#5a7a9a}
.card-badge.soon{background:rgba(240,169,58,.15);color:#D5871B}

/* ===== BOTTOM BAR ===== */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;height:56px;z-index:10;background:linear-gradient(to top,rgba(240,244,248,.95) 0%,rgba(240,244,248,.7) 70%,transparent 100%);display:flex;align-items:center;padding:0 40px;gap:20px}
.gallery-logo{font-size:20px;font-weight:700;color:#1a2a3a;font-style:italic}
.gallery-logo span{background:linear-gradient(90deg,#39A5DC,#74C23C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.bottom-time{font-size:13px;color:#5a7a9a;font-variant-numeric:tabular-nums}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
.gallery-container{flex-direction:column}
.left-panel{flex:0 0 auto;padding:20px;min-height:300px;max-height:55vh}
.preview-card{margin-bottom:16px}
.preview-body{min-height:120px}
.kit-name{font-size:22px}
.right-panel{flex:1;padding:20px}
.gallery-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card-preview{height:70px}
}
</style>
</head>
<body>
<div class="gallery-bg">
<div class="shape shape-1"></div>
<div class="shape shape-2"></div>
<div class="shape shape-3"></div>
</div>

<audio id="shopMusic" loop preload="auto"><source src="Music/Morning_in_the_Lobby.mp3" type="audio/mpeg"></audio>

<div class="gallery-container">
<!-- LEFT: Kit Preview -->
<div class="left-panel">
<div class="kit-preview" id="kitPreview">
<div class="preview-card" id="previewCard">
<div class="preview-header"><span></span><span></span><span></span></div>
<div class="preview-body" id="previewBody"></div>
</div>
<h1 class="kit-name" id="kitName">Aero Glass</h1>
<p class="kit-tagline" id="kitTagline">Frutiger Aero Design System</p>
<p class="kit-desc" id="kitDesc">Sistema de diseño completo.</p>
<div class="kit-details" id="kitDetails"></div>
<a class="btn-download" id="btnDownload" href="#" target="_blank" rel="noopener noreferrer">
<svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
Descargar Kit
</a>
</div>
</div>

<!-- RIGHT: Gallery -->
<div class="right-panel">
<div class="panel-header">
<div style="display:flex;align-items:center;gap:12px">
<a class="back-link" href="index.html"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Volver</a>
<span class="panel-title">Galería de Kits</span>
</div>
</div>
<div class="gallery-grid" id="galleryGrid"></div>
</div>
</div>

<div class="bottom-bar">
<span class="gallery-logo"><span>Fun UI Kits</span></span>
<span class="bottom-time" id="clock">12:00 PM</span>
</div>

<script>
(function(){
var kits=[
{id:'aero',name:'Aero Glass',tagline:'Frutiger Aero Design System',previewClass:'aero',iconClass:'blue',
iconSvg:'<svg viewBox="0 0 24 24"><path d="M12 22C6.49 22 2 17.51 2 12S6.49 2 12 2s10 4.04 10 9c0 3.31-2.69 6-6 6h-1.77c-.28 0-.5.22-.5.5 0 .12.05.23.13.33.41.49.63 1.09.63 1.72 0 1.37-1.12 2.47-2.49 2.45zm0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8c.28 0 .5-.22.5-.5a.54.54 0 0 0-.13-.33c-.41-.49-.63-1.09-.63-1.72 0-1.37 1.12-2.47 2.49-2.45H16c2.21 0 4-1.79 4-4 0-3.86-3.59-7-8-7z"/><circle cx="7.5" cy="11.5" r="1.5"/><circle cx="10.5" cy="7.5" r="1.5"/><circle cx="16.5" cy="11.5" r="1.5"/></svg>',
previewHTML:'<button class="mini-btn">Gloss Button</button><div class="mini-card">✦ Card component con backdrop blur y borde glossy</div>',
desc:'Sistema de diseño completo inspirado en Frutiger Aero y Windows Vista/7. Gradientes glossy, sombras azul oscuro y componentes WPF listos para producción.',
features:['12 tokens de color + brushes derivados','Gradientes GlossBlue, GlossGreen, GlossAmber, GlossRed','SkyBrush diagonal + TopGloss overlay','SoftShadow azul oscuro (#0A3A56)','Componentes: Gloss Button, Ghost, Nav, Switch, Card, ProgressBar','Especificación completa en DESIGN-SPEC.md'],
req:'Visual Studio 2019+ o cualquier editor XAML. Compatible con WPF (.NET Framework 4.8+).',
downloadUrl:'https://drive.google.com/drive/folders/1uF7RnxgfttCzhqX7XXm0wohMi8gE20gs?usp=sharing'},

{id:'night',name:'AeroNight',tagline:'Wii-Inspired Dark UI',previewClass:'night',iconClass:'purple',
iconSvg:'<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>',
previewHTML:'<div class="mini-tile glow"></div><div class="mini-tile"></div><div class="mini-tile"></div><p class="mini-label">Tiles con glow cyan</p>',
desc:'UI Kit oscuro estilo Wii Menu. Fondo azul profundo con ondas animadas, tiles glossy y glow cyan. CSS puro sin dependencias.',
features:['Paleta oscura con glow cyan (#6dd5fa)','Ondas SVG animadas en el fondo','Tiles con hover scale y selección activa','Layout de dos paneles (preview + grid)','CSS reutilizable con prefijo an-','Responsive para móvil (< 900px)'],
req:'Cualquier navegador moderno. CSS puro sin dependencias externas.',
downloadUrl:'https://drive.google.com/drive/folders/1TorxlEV5lQI94kfDIyMH-kXNYV2V-0ue?usp=sharing'},

{id:'neon',name:'Neon Pulse',tagline:'Cyberpunk Neon UI',previewClass:'neon',iconClass:'red',
iconSvg:'<svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>',
previewHTML:'<button class="mini-neon">NEON BTN</button><p class="mini-label">CSS puro con efectos glow</p>',
desc:'UI Kit cyberpunk con neones vibrantes, efectos de brillo y estética futurista. CSS puro listo para usar.',
features:['Paleta neón (rosa, púrpura, azul eléctrico)','Efectos glow y text-shadow','Botones con borde luminoso','CSS reutilizable con variables custom'],
req:'Cualquier navegador moderno. CSS puro sin dependencias externas.',
downloadUrl:'https://drive.google.com/drive/folders/1RLIJB2zppk1N2BDCOAwptEWE-NU0mWUi?usp=sharing'},

{id:'retro',name:'Retro Wave',tagline:'Synthwave Retro UI',previewClass:'retro',iconClass:'amber',
iconSvg:'<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>',
previewHTML:'<p class="mini-retro">RETRO WAVE</p><p class="mini-label">Estética synthwave años 80</p>',
desc:'UI Kit synthwave con gradientes rosa-azul, tipografía retro y estética años 80. CSS puro listo para usar.',
features:['Gradientes synthwave (rosa → azul)','Tipografía monospace retro','Grid lines estilo Tron','CSS reutilizable con variables custom'],
req:'Cualquier navegador moderno. CSS puro sin dependencias externas.',
downloadUrl:'https://drive.google.com/drive/folders/1XhgwXh_UYpskXhepuKuWmV7n4yPN1DXm?usp=sharing'}
];

var galleryGrid=document.getElementById('galleryGrid'),previewCard=document.getElementById('previewCard'),
previewBody=document.getElementById('previewBody'),kitName=document.getElementById('kitName'),
kitTagline=document.getElementById('kitTagline'),kitDesc=document.getElementById('kitDesc'),
kitDetails=document.getElementById('kitDetails'),btnDownload=document.getElementById('btnDownload'),
selectedId='aero';

// Build gallery cards
kits.forEach(function(k){
var card=document.createElement('div');
card.className='gallery-card'+(k.id===selectedId?' active':'');
card.setAttribute('data-id',k.id);
var badgeHTML=k.badge?'<span class="card-badge soon">'+k.badge+'</span>':'';
card.innerHTML=
'<div class="card-preview '+k.previewClass+'">'+
'<div class="card-icon '+k.iconClass+'">'+k.iconSvg+'</div>'+
badgeHTML+
'</div>'+
'<div class="card-info"><h3>'+k.name+'</h3><p>'+k.tagline+'</p></div>';
card.addEventListener('click',function(){selectKit(k.id)});
galleryGrid.appendChild(card);
});

function selectKit(id){
selectedId=id;
var k=kits.find(function(a){return a.id===id});if(!k)return;

// Update gallery active
document.querySelectorAll('.gallery-card').forEach(function(el){
el.classList.toggle('active',el.getAttribute('data-id')===id);
});

// Animate preview
var kp=document.getElementById('kitPreview');
kp.style.animation='none';kp.offsetHeight;
kp.style.animation='kitSlideIn .5s ease-out both';

// Update preview card
previewCard.className='preview-card preview-'+k.previewClass;
previewBody.innerHTML=k.previewHTML;

kitName.textContent=k.name;
kitTagline.textContent=k.tagline;
kitDesc.textContent=k.desc;

var html='<h4>Incluye</h4><ul>';
k.features.forEach(function(f){html+='<li>'+f+'</li>'});
html+='</ul><div class="req"><strong>Requisitos:</strong> '+k.req+'</div>';
kitDetails.innerHTML=html;

btnDownload.href=k.downloadUrl;
btnDownload.style.display=k.downloadUrl==='#'?'none':'inline-flex';
}

// Handle hash
var hash=window.location.hash.replace('#','');
if(hash&&kits.find(function(k){return k.id===hash}))selectedId=hash;
selectKit(selectedId);

// Clock — loaded from js/clock.js

// Audio
var audio=document.getElementById('shopMusic'),unlocked=false;
audio.volume=0.4;
function tryPlay(){if(unlocked)return;var p=audio.play();if(p&&p.then){p.then(function(){unlocked=true}).catch(function(){})}}
tryPlay();document.addEventListener('DOMContentLoaded',tryPlay);window.addEventListener('load',tryPlay);
var events=['click','mousedown','touchstart','keydown','mousemove','scroll','pointerdown'];
function onInteract(){if(!unlocked){try{var ctx=new(window.AudioContext||window.webkitAudioContext)();var buf=ctx.createBuffer(1,1,22050);var src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.start(0);ctx.resume().then(function(){audio.play().then(function(){unlocked=true}).catch(function(){})})}catch(e){audio.play().then(function(){unlocked=true}).catch(function(){})}}events.forEach(function(ev){document.removeEventListener(ev,onInteract,true)})}
events.forEach(function(ev){document.addEventListener(ev,onInteract,true)});
var retries=0,retryTimer=setInterval(function(){retries++;if(unlocked||retries>15){clearInterval(retryTimer);return}tryPlay()},2000);
})();
</script>
<script src="js/clock.js"></script>
</body>
</html>
