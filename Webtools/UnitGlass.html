<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnitGlass — Conversor de unidades Aero Glass</title>
<style>
  :root{
    --cDeep:#07405E; --cInk:#0B5C8A; --cBlue2:#1F86C8; --cGreen2:#4CA22B;
    --cAmber2:#E08C1E; --cRed2:#C63C22; --Muted:#2C5F7E;
    --shadow:0 2px 16px rgba(10,58,86,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    color:var(--cDeep);
    background:
      linear-gradient(0deg, rgba(151,220,95,.85) 0%, rgba(103,208,196,.82) 18%, rgba(77,187,236,.82) 40%, rgba(149,217,246,.85) 70%, rgba(227,244,253,.89) 100%),
      linear-gradient(105deg,#E3F4FD 0%, #95D9F6 30%, #4DBBEC 60%, #67D0C4 82%, #97DC5F 100%);
    background-blend-mode:normal;
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; height:170px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, rgba(255,255,255,.63) 0%, rgba(255,255,255,.26) 55%, transparent 100%);
  }
  .bubble{position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle at 35% 30%, #fff 0%, var(--t) 58%, transparent 100%);}
  .b1{width:300px;height:300px; left:-70px; top:38%; opacity:.30; --t:rgba(111,199,240,.9);}
  .b2{width:380px;height:380px; right:-90px; top:-110px; opacity:.26; --t:rgba(182,231,122,.9);}
  .b3{width:180px;height:180px; left:52%; bottom:-60px; opacity:.22; --t:rgba(255,217,122,.9);}

  .window{position:relative; z-index:1; max-width:980px; margin:46px auto; padding:0 24px 60px;}
  .titlebar{display:flex; align-items:center; gap:12px; height:46px; padding:0 6px;}
  .titlebar .logo{width:26px;height:26px;border-radius:7px;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow);
    display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
  .titlebar h1{font-size:25px; font-weight:300; color:var(--cDeep);}
  .titlebar h1 b{font-weight:600;}
  .titlebar .sub{margin-left:auto; font-size:12.5px; color:var(--Muted);}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.77) 45%, rgba(235,248,255,.69) 100%);
    border:1px solid rgba(255,255,255,.5);
    border-radius:14px; padding:18px; box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
    margin-bottom:18px;
  }
  h2{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--cDeep);}

  /* Tabs — chips */
  .tabs{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:18px;}
  .tab{
    height:36px; padding:0 20px; border:1px solid rgba(255,255,255,.5); border-radius:999px;
    background:rgba(255,255,255,.4); color:var(--cDeep); font-family:inherit; font-size:13.5px;
    cursor:pointer; transition:.15s; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .tab:hover{background:rgba(255,255,255,.67);}
  .tab.active{
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    color:#fff; font-weight:600;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
  }
  .tab.active::after{
    content:""; position:absolute; left:2px; right:2px; top:1px; height:50%;
    border-radius:999px 999px 0 0; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.12) 70%, transparent 100%);
  }

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px;}
  select,input[type=text],input[type=number]{
    height:34px; padding:0 10px; border-radius:8px; border:1px solid rgba(140,255,255,255,.5);
    border-color:rgba(44,95,126,.30); background:rgba(255,255,255,.70); color:var(--cDeep);
    font-family:inherit; font-size:13px;
  }
  input[type=text]:focus,input[type=number]:focus,select:focus{
    outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;
  }
  #value{width:180px; font-size:15px; font-weight:600;}

  /* Gloss buttons */
  .btn{
    position:relative; height:40px; padding:0 22px; border:none; border-radius:9px;
    font-family:inherit; font-size:13.5px; color:#fff; cursor:pointer; overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    transition:transform .05s, filter .15s;
  }
  .btn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
    background:rgba(255,255,255,.24); transition:.15s;}
  .btn:hover::before{opacity:1;}
  .btn:active{transform:translateY(1px); filter:brightness(.92);}
  .btn:disabled{opacity:.45; cursor:default; transform:none;}
  .btn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
  .btn-blue{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
  .btn-green{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
  .btn-amber{background:linear-gradient(180deg,#FFE6A8 0%,#F0A93A 49%,#D5871B 51%,#F7B950 100%);}

  .btn-ghost{
    height:34px; padding:0 16px; border-radius:8px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.4); color:var(--cDeep); font-family:inherit; font-size:13px; cursor:pointer; transition:.15s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.67);}

  /* Swap button */
  .btn-swap{
    width:46px; height:46px; padding:0; font-size:20px; line-height:1;
    border-radius:50%; flex:0 0 auto;
  }
  .btn-swap .shine{border-radius:46px 46px 0 0; top:2px; left:2px; right:2px; height:20px;}
  .btn-swap:hover{transform:rotate(180deg);}
  .btn-swap{transition:transform .25s, filter .15s;}

  /* Result panel */
  .result-card{
    background:linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(235,248,255,.75) 100%);
    border:1px solid rgba(255,255,255,.55);
    border-radius:12px; padding:22px 26px; margin-top:18px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    box-shadow:var(--shadow);
  }
  .result-value{
    font-size:56px; font-weight:300; color:var(--cDeep); word-break:break-all; line-height:1.1;
    font-variant-numeric:tabular-nums;
    text-shadow:0 1px 0 rgba(255,255,255,.7);
  }
  .result-value b{font-weight:600;}
  .result-unit{font-size:16px; color:var(--Muted); font-weight:600;}
  .result-note{width:100%; font-size:12.5px; color:var(--Muted); min-height:16px;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(255,255,255,.9); backdrop-filter:blur(10px); color:var(--cDeep);
    border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 20px;
    box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:9;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Responsive */
  @media (max-width:640px){
    .window{margin:20px auto; padding:0 12px 40px;}
    .titlebar{flex-wrap:wrap; height:auto; gap:8px;}
    .titlebar .sub{margin-left:0; width:100%; font-size:11.5px;}
    .titlebar h1{font-size:21px;}
    .tab{padding:0 16px; font-size:12.5px;}
    .card{padding:14px;}
    .row{gap:8px;}
    select{flex:1 1 130px; min-width:0;}
    #value{width:100%; flex:1 1 100%;}
    .result-card{padding:18px 16px; justify-content:center; text-align:center;}
    .result-value{font-size:38px;}
    .result-unit{font-size:14px;}
    .result-note{text-align:center; font-size:11.5px;}
    .btn{padding:0 18px;}
  }
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>

<div class="window">
  <div class="titlebar">
    <div class="logo">⇄</div>
    <h1>Unit<b>Glass</b></h1>
    <span class="sub">Conversor de unidades · Aero Glass · 100% local</span>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="longitud">Longitud</button>
    <button class="tab" data-cat="peso">Peso</button>
    <button class="tab" data-cat="temperatura">Temperatura</button>
    <button class="tab" data-cat="datos">Datos</button>
  </div>

  <div class="card">
    <h2 id="cardTitle">Conversor de longitud</h2>
    <div class="row" style="margin-top:0">
      <input type="text" id="value" inputmode="decimal" placeholder="Valor" value="1" autocomplete="off">
      <select id="from" title="Unidad de origen"></select>
      <button id="btnSwap" class="btn btn-amber btn-swap" title="Invertir unidades"><span class="shine"></span>⇄</button>
      <select id="to" title="Unidad de destino"></select>
      <button id="btnClear" class="btn-ghost">Limpiar</button>
    </div>
    <div class="row" id="dataModeRow" style="display:none">
      <label style="font-size:13px; color:var(--Muted); display:flex; align-items:center; gap:6px;">
        <input type="checkbox" id="binaryMode"> Usar múltiplos binarios (1 KiB = 1024 B)
      </label>
    </div>
    <div class="result-card">
      <div>
        <div class="result-value"><b id="resultNum">—</b> <span class="result-unit" id="resultUnit"></span></div>
      </div>
      <button id="btnCopy" class="btn btn-green" disabled><span class="shine"></span>Copiar</button>
      <div class="result-note" id="resultNote"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);

/* ---------- Definitions ---------- */
// Factores exactos respecto a la unidad base de cada categoría
const CATEGORIES = {
  longitud: {
    title: "Conversor de longitud",
    units: { mm:0.001, cm:0.01, m:1, km:1000, in:0.0254, ft:0.3048, mi:1609.344 },
    labels: { mm:"Milímetros (mm)", cm:"Centímetros (cm)", m:"Metros (m)", km:"Kilómetros (km)",
              in:"Pulgadas (in)", ft:"Pies (ft)", mi:"Millas (mi)" }
  },
  peso: {
    title: "Conversor de peso",
    units: { g:1, kg:1000, lb:453.59237, oz:28.349523125 },
    labels: { g:"Gramos (g)", kg:"Kilogramos (kg)", lb:"Libras (lb)", oz:"Onzas (oz)" }
  },
  temperatura: {
    title: "Conversor de temperatura",
    units: { C:"°C", F:"°F", K:"K" },
    labels: { C:"Celsius (°C)", F:"Fahrenheit (°F)", K:"Kelvin (K)" }
  },
  datos: {
    title: "Conversor de datos",
    units: { B:1, KB:1000, MB:1e6, GB:1e9, TB:1e12 },
    bin:  { B:1, KiB:1024, MiB:1048576, GiB:1073741824, TiB:1099511627776 },
    labels: { B:"Bytes (B)", KB:"Kilobytes (KB)", MB:"Megabytes (MB)", GB:"Gigabytes (GB)", TB:"Terabytes (TB)" }
  }
};

let currentCat = 'longitud';

/* ---------- Helpers ---------- */
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

function unitList(){
  const c = CATEGORIES[currentCat];
  if(currentCat === 'datos' && $('binaryMode').checked) return Object.keys(c.bin);
  return Object.keys(c.units);
}

function parseNum(s){
  if(s === '' || s === null) return null;
  const v = Number(String(s).replace(',', '.'));
  return Number.isFinite(v) ? v : null;
}

// Temperature dedicated formulas
function tempConvert(v, from, to){
  let c; // canonical to Celsius
  if(from === 'C') c = v;
  else if(from === 'F') c = (v - 32) * 5/9;
  else c = v - 273.15; // K
  if(to === 'C') return c;
  if(to === 'F') return c * 9/5 + 32;
  return c + 273.15; // K
}

function factorOf(u){
  const c = CATEGORIES[currentCat];
  if(currentCat === 'datos' && $('binaryMode').checked) return c.bin[u];
  return c.units[u];
}

function formatResult(v){
  if(!Number.isFinite(v)) return '—';
  if(v === 0) return '0';
  const abs = Math.abs(v);
  let s;
  if(abs >= 1e15 || abs < 1e-9) s = v.toExponential(6).replace(/(\.\d*?)0+e/, '$1e').replace(/\.e/, 'e');
  else if(abs >= 1e12) s = (v/1e12).toPrecision(12);
  else {
    s = v.toPrecision(12);
    if(s.includes('.')) s = s.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
    if(s.includes('e')) s = String(Number(s));
  }
  return s;
}

/* ---------- Rendering ---------- */
function fillSelects(){
  const list = unitList();
  const from = $('from'), to = $('to');
  const prevFrom = from.value, prevTo = to.value;
  from.innerHTML = to.innerHTML = '';
  list.forEach(u => {
    const label = CATEGORIES[currentCat].labels[u] || u;
    from.add(new Option(label, u));
    to.add(new Option(label, u));
  });
  if(list.includes(prevFrom)) from.value = prevFrom;
  if(list.includes(prevTo)) to.value = prevTo;
  else if(currentCat === 'longitud'){ from.value = 'm'; to.value = 'ft'; }
  else if(currentCat === 'peso'){ from.value = 'kg'; to.value = 'lb'; }
  else if(currentCat === 'temperatura'){ from.value = 'C'; to.value = 'F'; }
  else { from.value = 'MB'; to.value = 'KB'; }
}

function currentUnitSymbol(u){
  const c = CATEGORIES[currentCat];
  if(currentCat === 'temperatura') return c.units[u];
  if(currentCat === 'datos') return u;
  return u;
}

function convert(){
  const v = parseNum($('value').value.trim());
  const from = $('from').value, to = $('to').value;
  const note = $('resultNote');

  if(v === null){
    $('resultNum').textContent = '—';
    $('resultUnit').textContent = '';
    $('btnCopy').disabled = true;
    note.textContent = '';
    return;
  }

  let result;
  if(currentCat === 'temperatura'){
    result = tempConvert(v, from, to);
    const formula = from === 'C' && to === 'F' ? '°F = °C × 9/5 + 32'
      : from === 'F' && to === 'C' ? '°C = (°F − 32) × 5/9'
      : from === 'C' && to === 'K' ? 'K = °C + 273.15'
      : from === 'K' && to === 'C' ? '°C = K − 273.15'
      : from === 'F' && to === 'K' ? 'K = (°F − 32) × 5/9 + 273.15'
      : from === 'K' && to === 'F' ? '°F = (K − 273.15) × 9/5 + 32'
      : 'Misma unidad';
    note.textContent = v + ' ' + currentUnitSymbol(from) + '  =  ' + formatResult(result) + ' ' + currentUnitSymbol(to) + '   ·   ' + formula;
  } else {
    const base = v * factorOf(from);
    result = base / factorOf(to);
    note.textContent = v + ' ' + currentUnitSymbol(from) + '  =  ' + formatResult(result) + ' ' + currentUnitSymbol(to)
      + (from === to ? '' : '   ·   factor exacto aplicado');
  }

  $('resultNum').textContent = formatResult(result);
  $('resultUnit').textContent = currentUnitSymbol(to);
  $('btnCopy').disabled = false;
}

/* ---------- Events ---------- */
$('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if(!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentCat = tab.dataset.cat;
  $('cardTitle').textContent = CATEGORIES[currentCat].title;
  $('dataModeRow').style.display = currentCat === 'datos' ? '' : 'none';
  fillSelects();
  convert();
});

$('value').addEventListener('input', convert);
$('from').addEventListener('change', convert);
$('to').addEventListener('change', convert);
$('binaryMode').addEventListener('change', () => { fillSelects(); convert(); });

$('btnSwap').addEventListener('click', () => {
  const from = $('from'), to = $('to');
  const f = from.value;
  from.value = to.value;
  to.value = f;
  convert();
  toast('Unidades invertidas ⇄');
});

$('btnClear').addEventListener('click', () => {
  $('value').value = '';
  $('resultNum').textContent = '—';
  $('resultUnit').textContent = '';
  $('resultNote').textContent = '';
  $('btnCopy').disabled = true;
  $('value').focus();
});

$('btnCopy').addEventListener('click', async () => {
  const txt = $('resultNum').textContent + ' ' + $('resultUnit').textContent;
  await navigator.clipboard.writeText(txt.trim());
  toast('Resultado copiado ✓');
});

// Enter triggers swap for convenience
$('value').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ $('btnSwap').click(); }
});

/* ---------- Init ---------- */
fillSelects();
convert();
</script>
</body>
</html>
