<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TipCalc — Calculadora de propinas</title>
<style>
  :root{
    --cDeep:#07405E; --cInk:#0B5C8A; --cBlue2:#1F86C8; --cGreen2:#4CA22B;
    --cAmber2:#E08C1E; --cRed2:#C63C22; --Muted:#2C5F7E;
    --shadow:0 2px 16px rgba(10,58,86,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    color:var(--cDeep);
    background:
      linear-gradient(0deg, rgba(151,220,95,.85) 0%, rgba(103,208,196,.82) 18%, rgba(77,187,236,.82) 40%, rgba(149,217,246,.85) 70%, rgba(227,244,253,.89) 100%),
      linear-gradient(105deg,#E3F4FD 0%, #95D9F6 30%, #4DBBEC 60%, #67D0C4 82%, #97DC5F 100%);
    background-blend-mode:normal;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* TopGloss overlay */
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; height:170px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, rgba(255,255,255,.63) 0%, rgba(255,255,255,.26) 55%, transparent 100%);
  }
  /* Bubbles */
  .bubble{position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle at 35% 30%, #fff 0%, var(--t) 58%, transparent 100%);}
  .b1{width:300px;height:300px; left:-70px; top:38%; opacity:.30; --t:rgba(111,199,240,.9);}
  .b2{width:380px;height:380px; right:-90px; top:-110px; opacity:.26; --t:rgba(182,231,122,.9);}
  .b3{width:180px;height:180px; left:52%; bottom:-60px; opacity:.22; --t:rgba(255,217,122,.9);}

  .window{
    position:relative; z-index:1; max-width:640px; margin:46px auto; padding:0 24px 60px;
  }
  .titlebar{display:flex; align-items:center; gap:12px; height:46px; padding:0 6px;}
  .titlebar .logo{width:26px;height:26px;border-radius:7px;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow);
    display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
  .titlebar h1{font-size:25px; font-weight:300; color:var(--cDeep);}
  .titlebar h1 b{font-weight:600;}
  .titlebar .sub{margin-left:auto; font-size:12.5px; color:var(--Muted);}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.77) 45%, rgba(235,248,255,.69) 100%);
    border:1px solid rgba(255,255,255,.5);
    border-radius:14px; padding:18px; box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
    margin-bottom:18px;
  }
  h2{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--cDeep);}

  input[type="number"], input[type="text"]{
    height:40px; padding:0 12px; border-radius:8px;
    border:1px solid rgba(44,95,126,.30); background:rgba(255,255,255,.70); color:var(--cDeep);
    font-family:inherit; font-size:15px;
  }
  input:focus{outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;}
  .amount-row{display:flex; align-items:center; gap:10px;}
  .amount-row .cur{font-size:20px; font-weight:600; color:var(--cInk); width:34px; text-align:center;
    background:rgba(255,255,255,.45); border-radius:8px; height:40px; line-height:40px;}
  #amount{flex:1; font-size:19px; font-weight:600;}
  .field-label{font-size:12.5px; color:var(--Muted); margin:12px 0 6px;}

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px;}

  .tipbtn{
    position:relative; height:40px; min-width:64px; padding:0 16px; border:none; border-radius:9px;
    font-family:inherit; font-size:14px; font-weight:600; color:#fff; cursor:pointer; overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    transition:transform .05s, filter .15s;
  }
  .tipbtn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
    background:rgba(255,255,255,.24); transition:.15s;}
  .tipbtn:hover::before{opacity:1;}
  .tipbtn:active{transform:translateY(1px); filter:brightness(.92);}
  .tipbtn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
  .tipbtn-blue{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
  .tipbtn.selected{
    outline:3px solid rgba(74,162,43,.65); outline-offset:1px;
    background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);
  }
  .tipbtn.selected::after{content:"✓"; position:absolute; top:1px; right:5px; font-size:10px; opacity:.9;}

  #customTip{width:110px;}

  .stepper{display:flex; align-items:center; gap:0;}
  .stepper button{
    width:40px; height:40px; border:none; cursor:pointer; font-size:18px; font-weight:600; color:#fff;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35); position:relative; overflow:hidden;
    transition:filter .15s;
  }
  .stepper button::before{content:""; position:absolute; inset:0; opacity:0; transition:.15s;
    background:rgba(255,255,255,.24);}
  .stepper button:hover::before{opacity:1;}
  .stepper button:active{filter:brightness(.92);}
  .stepper button:disabled{opacity:.45; cursor:default;}
  .stepper button:disabled::before{opacity:0;}
  .stepper button .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:7px 7px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
  .stepper .minus{border-radius:8px 0 0 8px; background:linear-gradient(180deg,#FFB6A6 0%,#DD5C3E 49%,#B63B22 51%,#E0704F 100%);}
  .stepper .plus{border-radius:0 8px 8px 0; background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
  .stepper .val{
    width:70px; height:40px; display:grid; place-items:center; font-size:17px; font-weight:600;
    background:rgba(255,255,255,.70); border-top:1px solid rgba(44,95,126,.30); border-bottom:1px solid rgba(44,95,126,.30);
  }

  .results{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:6px;}
  .res{
    background:linear-gradient(180deg, rgba(255,255,255,.80) 0%, rgba(255,255,255,.58) 45%, rgba(235,248,255,.50) 100%);
    border:1px solid rgba(255,255,255,.6); border-radius:12px;
    padding:14px 10px; text-align:center; box-shadow:var(--shadow);
    backdrop-filter:blur(8px); position:relative; overflow:hidden;
    transition:transform .15s, box-shadow .15s;
  }
  .res:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(10,58,86,.32);}
  .res::before{content:""; position:absolute; left:0; right:0; top:0; height:12px;
    background:linear-gradient(180deg, rgba(255,255,255,.65) 0%, transparent 100%); pointer-events:none;}
  .res .lbl{font-size:11.5px; color:var(--Muted); text-transform:uppercase; letter-spacing:.4px;}
  .res .num{font-size:22px; font-weight:600; margin-top:6px; word-break:break-all;}
  .res.total{
    border:1px solid rgba(116,194,60,.55);
    background:linear-gradient(180deg, rgba(233,248,215,.85) 0%, rgba(255,255,255,.62) 45%, rgba(226,244,206,.55) 100%);
  }
  .res.total .num{color:var(--cGreen2); font-size:24px;}
  .res.total::after{content:""; position:absolute; left:0; right:0; top:0; height:4px;
    background:linear-gradient(90deg, transparent, rgba(116,194,60,.7), transparent);}

  /* Gloss buttons */
  .btn{
    position:relative; height:40px; padding:0 22px; border:none; border-radius:9px;
    font-family:inherit; font-size:13.5px; color:#fff; cursor:pointer; overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    transition:transform .05s, filter .15s;
  }
  .btn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
    background:rgba(255,255,255,.24); transition:.15s;}
  .btn:hover::before{opacity:1;}
  .btn:active{transform:translateY(1px); filter:brightness(.92);}
  .btn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
  .btn-green{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(255,255,255,.9); backdrop-filter:blur(10px); color:var(--cDeep);
    border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 20px;
    box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:9;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:540px){
    .results{grid-template-columns:1fr 1fr;} .res.total{grid-column:span 2;}
    .titlebar h1{font-size:21px;} .titlebar .sub{display:none;}
    .tipbtn{min-width:56px; padding:0 12px; flex:1;}
    #customTip{flex:1; width:auto;}
    .stepper .val{width:56px;}
    .res .num{font-size:19px;} .res.total .num{font-size:21px;}
  }
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>

<div class="window">
  <div class="titlebar">
    <div class="logo">$</div>
    <h1>Tip<b>Calc</b></h1>
    <span class="sub">Propinas y división de cuenta · Aero Glass</span>
  </div>

  <div class="card">
    <h2>1 · Datos de la cuenta</h2>
    <div class="amount-row">
      <span class="cur" id="curLabel">$</span>
      <input type="number" id="amount" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
    </div>
    <div class="field-label">Símbolo de moneda</div>
    <input type="text" id="currency" value="$" maxlength="4" style="width:90px; text-align:center;">

    <div class="field-label">Propina</div>
    <div class="row" style="margin-top:0;">
      <button class="tipbtn tipbtn-blue" data-tip="10"><span class="shine"></span>10%</button>
      <button class="tipbtn tipbtn-blue" data-tip="15"><span class="shine"></span>15%</button>
      <button class="tipbtn tipbtn-blue" data-tip="18"><span class="shine"></span>18%</button>
      <button class="tipbtn tipbtn-blue" data-tip="20"><span class="shine"></span>20%</button>
      <input type="number" id="customTip" min="0" max="500" step="0.5" placeholder="Otro %" inputmode="decimal">
    </div>

    <div class="field-label">Personas</div>
    <div class="stepper">
      <button class="minus" id="lessPeople" title="Menos personas"><span class="shine"></span>−</button>
      <div class="val" id="peopleVal">1</div>
      <button class="plus" id="morePeople" title="Más personas"><span class="shine"></span>+</button>
    </div>
  </div>

  <div class="card">
    <h2>2 · Resultado</h2>
    <div class="results">
      <div class="res"><div class="lbl">Propina / persona</div><div class="num" id="tipEach">$0.00</div></div>
      <div class="res"><div class="lbl">Total / persona</div><div class="num" id="totalEach">$0.00</div></div>
      <div class="res total"><div class="lbl">Total general</div><div class="num" id="totalAll">$0.00</div></div>
    </div>
    <div class="row">
      <button id="btnCopy" class="btn btn-green"><span class="shine"></span>Copiar resumen</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const amount = $('amount'), currency = $('currency'), customTip = $('customTip');
const peopleVal = $('peopleVal');
let people = 1;
let tipPct = 15;

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

const nf = window.Intl && Intl.NumberFormat
  ? new Intl.NumberFormat('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2})
  : null;

function fmt(n){
  const s = nf ? nf.format(n) : n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return cur() + s;
}
function cur(){ return currency.value.trim() || '$'; }

function selectTip(btn){
  document.querySelectorAll('.tipbtn').forEach(b => b.classList.remove('selected'));
  if(btn) btn.classList.add('selected');
}

document.querySelectorAll('.tipbtn[data-tip]').forEach(btn => {
  btn.addEventListener('click', () => {
    tipPct = parseFloat(btn.dataset.tip);
    customTip.value = '';
    selectTip(btn);
    calc();
  });
});

customTip.addEventListener('input', () => {
  const v = parseFloat(customTip.value);
  if(!isNaN(v) && v >= 0){
    tipPct = v;
    selectTip(null);
  }
  calc();
});
customTip.addEventListener('blur', () => { if(customTip.value !== '') selectTip(null); calc(); });

$('lessPeople').addEventListener('click', () => { setPeople(people - 1); });
$('morePeople').addEventListener('click', () => { setPeople(people + 1); });
function setPeople(n){
  people = Math.min(50, Math.max(1, n));
  peopleVal.textContent = people;
  $('lessPeople').disabled = people <= 1;
  $('morePeople').disabled = people >= 50;
  calc();
}

currency.addEventListener('input', () => { $('curLabel').textContent = cur(); calc(); });
amount.addEventListener('input', calc);

function calc(){
  const base = parseFloat(amount.value);
  const total = isNaN(base) || base < 0 ? 0 : base;
  const tipTotal = total * tipPct / 100;
  const grand = total + tipTotal;
  $('tipEach').textContent = fmt(tipTotal / people);
  $('totalEach').textContent = fmt(grand / people);
  $('totalAll').textContent = fmt(grand);
}

$('btnCopy').addEventListener('click', async () => {
  const base = parseFloat(amount.value);
  const total = isNaN(base) || base < 0 ? 0 : base;
  const grand = total + total * tipPct / 100;
  const txt = `Total: ${fmt(total)} · Propina ${tipPct}% · ${people} ${people===1?'persona':'personas'} · ${fmt(grand/people)} c/u`;
  try{
    await navigator.clipboard.writeText(txt);
    toast('Resumen copiado al portapapeles ✓');
  }catch(e){
    toast('No se pudo copiar');
  }
});

setPeople(1);
calc();
</script>
</body>
</html>
