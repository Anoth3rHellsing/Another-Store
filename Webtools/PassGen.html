<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PassForge — Generador de contraseñas Aero Glass</title>
<style>
  :root{
    --cDeep:#07405E; --cInk:#0B5C8A; --cBlue2:#1F86C8; --cGreen2:#4CA22B;
    --cAmber2:#E08C1E; --cRed2:#C63C22; --Muted:#2C5F7E;
    --shadow:0 2px 16px rgba(10,58,86,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    color:var(--cDeep);
    background:
      linear-gradient(0deg, rgba(151,220,95,.85) 0%, rgba(103,208,196,.82) 18%, rgba(77,187,236,.82) 40%, rgba(149,217,246,.85) 70%, rgba(227,244,253,.89) 100%),
      linear-gradient(105deg,#E3F4FD 0%, #95D9F6 30%, #4DBBEC 60%, #67D0C4 82%, #97DC5F 100%);
    background-blend-mode:normal;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* TopGloss overlay */
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; height:170px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, rgba(255,255,255,.63) 0%, rgba(255,255,255,.26) 55%, transparent 100%);
  }
  /* Bubbles */
  .bubble{position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle at 35% 30%, #fff 0%, var(--t) 58%, transparent 100%);}
  .b1{width:300px;height:300px; left:-70px; top:38%; opacity:.30; --t:rgba(111,199,240,.9);}
  .b2{width:380px;height:380px; right:-90px; top:-110px; opacity:.26; --t:rgba(182,231,122,.9);}
  .b3{width:180px;height:180px; left:52%; bottom:-60px; opacity:.22; --t:rgba(255,217,122,.9);}

  .window{
    position:relative; z-index:1; max-width:980px; margin:46px auto; padding:0 24px 60px;
  }
  .titlebar{display:flex; align-items:center; gap:12px; height:46px; padding:0 6px;}
  .titlebar .logo{width:26px;height:26px;border-radius:7px;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow);
    display:grid;place-items:center;color:#fff;font-size:16px;font-weight:600;}
  .titlebar h1{font-size:25px; font-weight:300; color:var(--cDeep);}
  .titlebar h1 b{font-weight:600;}
  .titlebar .sub{margin-left:auto; font-size:12.5px; color:var(--Muted);}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.77) 45%, rgba(235,248,255,.69) 100%);
    border:1px solid rgba(255,255,255,.5);
    border-radius:14px; padding:18px; box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
    margin-bottom:18px;
  }
  h2{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--cDeep);}

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px;}

  /* Gloss buttons */
  .btn{
    position:relative; height:40px; padding:0 22px; border:none; border-radius:9px;
    font-family:inherit; font-size:13.5px; color:#fff; cursor:pointer; overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    transition:transform .05s, filter .15s;
  }
  .btn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
    background:rgba(255,255,255,.24); transition:.15s;}
  .btn:hover::before{opacity:1;}
  .btn:active{transform:translateY(1px); filter:brightness(.92);}
  .btn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
  .btn-blue{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
  .btn-green{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
  .btn-amber{background:linear-gradient(180deg,#FFE6A8 0%,#F0A93A 49%,#D5871B 51%,#F7B950 100%);}
  .btn-red{background:linear-gradient(180deg,#FFB6A6 0%,#DD5C3E 49%,#B63B22 51%,#E0704F 100%);}

  .btn:disabled{opacity:.45; cursor:default; transform:none;}
  .btn:disabled .shine{opacity:0;}

  .btn-ghost{
    height:34px; padding:0 16px; border-radius:8px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.4); color:var(--cDeep); font-family:inherit; font-size:13px; cursor:pointer; transition:.15s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.67);}

  /* Length slider */
  .lenrow{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .lenval{
    min-width:74px; text-align:center; font-family:Consolas,monospace; font-size:26px; font-weight:600;
    color:var(--cDeep); background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.55);
    border-radius:10px; padding:4px 10px; box-shadow:var(--shadow);
  }
  input[type=range]{
    flex:1; min-width:200px; height:12px; -webkit-appearance:none; appearance:none; cursor:pointer;
    border-radius:8px; border:1px solid rgba(255,255,255,.5);
    background:linear-gradient(180deg, rgba(255,255,255,.75) 0%, rgba(190,226,247,.6) 100%);
    box-shadow:inset 0 1px 3px rgba(44,95,126,.25);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    border:2px solid rgba(255,255,255,.85); box-shadow:var(--shadow); cursor:grab;
  }
  input[type=range]::-moz-range-thumb{
    width:24px; height:24px; border-radius:50%;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    border:2px solid rgba(255,255,255,.85); box-shadow:var(--shadow); cursor:grab;
  }
  input[type=range]::-moz-range-track{
    height:12px; border-radius:8px; border:1px solid rgba(255,255,255,.5);
    background:linear-gradient(180deg, rgba(255,255,255,.75) 0%, rgba(190,226,247,.6) 100%);
    box-shadow:inset 0 1px 3px rgba(44,95,126,.25);
  }
  input[type=range]:hover::-webkit-slider-thumb{filter:brightness(1.08);}
  input[type=range]:active::-webkit-slider-thumb{cursor:grabbing; filter:brightness(.94);}

  /* Checkboxes */
  .opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px; margin-top:12px;}
  .chk{display:flex; align-items:center; gap:9px; padding:9px 12px; border-radius:9px;
    background:rgba(255,255,255,.42); border:1px solid rgba(255,255,255,.5); cursor:pointer;
    font-size:13.5px; user-select:none; transition:.15s;}
  .chk:hover{background:rgba(255,255,255,.62);}
  .chk input{position:absolute; opacity:0; width:1px; height:1px; pointer-events:none;}
  .chk .box{
    flex:none; width:20px; height:20px; border-radius:6px; position:relative;
    border:1px solid rgba(255,255,255,.65); box-shadow:var(--shadow), inset 0 1px 3px rgba(44,95,126,.28);
    background:linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(220,238,250,.75) 100%);
    transition:.15s;
  }
  .chk .box::after{
    content:""; position:absolute; left:6px; top:2px; width:5px; height:10px;
    border:solid #fff; border-width:0 3px 3px 0; transform:rotate(42deg) scale(0);
    transition:.12s; filter:drop-shadow(0 1px 1px rgba(10,58,86,.4));
  }
  .chk input:checked + .box{
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    border-color:rgba(255,255,255,.85);
  }
  .chk input:checked + .box::after{transform:rotate(42deg) scale(1);}
  .chk input:focus-visible + .box{outline:2px solid rgba(31,134,200,.45); outline-offset:1px;}
  .chk:has(input:disabled){opacity:.55; cursor:default; background:rgba(255,255,255,.3);}
  .chk .glyph{font-family:Consolas,monospace; color:var(--cInk); font-size:12px; margin-left:auto;}

  /* Password output */
  .passbox{
    display:flex; align-items:center; gap:10px; margin-top:4px;
    background:linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(240,249,255,.85) 55%, rgba(224,241,252,.8) 100%);
    border:1px solid rgba(255,255,255,.7); border-radius:12px; padding:16px 18px;
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9);
    position:relative; overflow:hidden;
  }
  .passbox::before{content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background:linear-gradient(180deg, rgba(255,255,255,.75), transparent); pointer-events:none;}
  .passbox .pass{
    flex:1; min-height:40px; word-break:break-all; user-select:all;
    font-family:Consolas,"Courier New",monospace; font-size:24px; font-weight:600;
    letter-spacing:.5px; color:var(--cDeep); line-height:1.4;
  }
  .passbox .pass.placeholder{color:var(--Muted); font-size:14px; font-style:italic; font-weight:400; letter-spacing:0;}

  /* Strength meter */
  .strength{margin-top:14px;}
  .strength .meta{display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--Muted); margin-bottom:5px;}
  .strength .label{font-size:14px; font-weight:600;}
  .bar{height:14px; border-radius:8px; background:rgba(255,255,255,.35);
    border:1px solid rgba(255,255,255,.45); overflow:hidden;}
  .bar .fill{height:100%; width:0%; border-radius:7px; position:relative; transition:width .3s, background .3s;}
  .bar .fill::after{content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:rgba(255,255,255,.55); border-radius:7px 7px 0 0;}

  .status{font-size:12.5px; color:var(--Muted); margin-top:8px; min-height:16px;}

  /* Passphrase chips */
  .passbox .pass.chips{display:flex; flex-wrap:wrap; gap:8px; font-size:0;}
  .passbox .chip{
    display:inline-flex; align-items:center; font-family:Consolas,"Courier New",monospace;
    font-size:20px; font-weight:600; color:var(--cDeep);
    background:linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(228,242,252,.8) 100%);
    border:1px solid rgba(255,255,255,.7); border-radius:9px; padding:6px 12px;
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9); user-select:all;
  }
  .passbox .sep{display:inline-flex; align-items:center; align-self:center;
    font-family:Consolas,monospace; font-size:20px; color:var(--Muted); font-weight:600;
    user-select:all;}

  @media (max-width:640px){
    .window{margin:24px auto; padding:0 12px 40px;}
    .titlebar{height:38px; gap:9px;}
    .titlebar h1{font-size:20px;}
    .titlebar .sub{display:none;}
    .card{padding:14px; border-radius:12px;}
    .passbox{padding:12px;}
    .passbox .pass{font-size:18px;}
    .passbox .chip{font-size:16px; padding:5px 10px;}
    .passbox .sep{font-size:16px;}
    .lenval{font-size:20px;}
    .btn{height:38px; padding:0 18px; font-size:13px;}
    .opts{grid-template-columns:1fr;}
  }

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(255,255,255,.9); backdrop-filter:blur(10px); color:var(--cDeep);
    border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 20px;
    box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:9;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>

<div class="window">
  <div class="titlebar">
    <div class="logo">*</div>
    <h1>Pass<b>Forge</b></h1>
    <span class="sub">Generador de contraseñas · Aero Glass · 100% local</span>
  </div>

  <div class="card">
    <h2>1 · Opciones</h2>

    <div class="lenrow">
      <label for="len" style="font-size:13.5px;">Longitud:</label>
      <input type="range" id="len" min="8" max="64" value="16" step="1">
      <div class="lenval" id="lenval">16</div>
    </div>

    <div class="opts" id="opts">
      <label class="chk"><input type="checkbox" id="cUpper" checked><span class="box"></span> Mayúsculas <span class="glyph">A-Z</span></label>
      <label class="chk"><input type="checkbox" id="cLower" checked><span class="box"></span> Minúsculas <span class="glyph">a-z</span></label>
      <label class="chk"><input type="checkbox" id="cNums" checked><span class="box"></span> Números <span class="glyph">0-9</span></label>
      <label class="chk"><input type="checkbox" id="cSyms" checked><span class="box"></span> Símbolos <span class="glyph">!@#$…</span></label>
      <label class="chk"><input type="checkbox" id="cAmb"><span class="box"></span> Excluir ambiguos <span class="glyph">l 1 I O 0</span></label>
      <label class="chk"><input type="checkbox" id="cPhrase"><span class="box"></span> Frase de paso <span class="glyph">4-8 palabras</span></label>
    </div>
  </div>

  <div class="card">
    <h2>2 · Tu contraseña</h2>
    <div class="passbox">
      <div class="pass placeholder" id="pass">Haz clic en «Generar» para crear una contraseña…</div>
    </div>

    <div class="row">
      <button id="btnGen" class="btn btn-blue"><span class="shine"></span>Generar</button>
      <button id="btnCopy" class="btn btn-green" disabled><span class="shine"></span>Copiar</button>
      <button id="btnRegen" class="btn btn-amber" disabled><span class="shine"></span>Regenerar</button>
    </div>

    <div class="strength">
      <div class="meta">
        <span>Entropía: <b id="bits">—</b> bits</span>
        <span class="label" id="strengthLabel">—</span>
      </div>
      <div class="bar"><div class="fill" id="strengthFill"></div></div>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const len = $('len'), lenval = $('lenval');
const cUpper = $('cUpper'), cLower = $('cLower'), cNums = $('cNums'), cSyms = $('cSyms'),
      cAmb = $('cAmb'), cPhrase = $('cPhrase');
const passEl = $('pass'), bitsEl = $('bits'), labelEl = $('strengthLabel'), fillEl = $('strengthFill');
const statusEl = $('status');

const SETS = {
  upper: 'ABCDEFGHJKLMNPQRSTUVWXYZ',
  lower: 'abcdefghijkmnpqrstuvwxyz',
  nums:  '23456789',
  syms:  '!@#$%^&*-_=+?.,:;'
};
const AMB = { upper:'ILO', lower:'ilo', nums:'01' };

const WORDS = ['casa','cielo','perro','gato','monte','rio','sol','luna','estrella','fuego','agua','tierra',
'vento','nube','lluvia','nieve','flor','arbol','bosque','campo','playa','mar','isla','barco','vela','red',
'camino','puente','puerta','llave','silla','mesa','lampara','libro','pluma','papel','cuadro','musica',
'canto','baile','risa','sueno','noche','dia','manana','tarde','primavera','verano','otono','invierno',
'pan','vino','miel','fruta','manzana','naranja','limon','fresa','uva','trigo','maiz','cafe',
'leche','queso','piedra','arena','oro','plata','cobre','hierro','cristal','espejo','campana','cuerda',
'reloj','brujula','mapa','carta','sello','moneda','tesoro','corazon','alma','mente','fuerza',
'valor','fe','luz','sombra','eco','voz','palabra','letra','numero','color','verde','azul',
'rojo','blanco','negro','gris','purpura','ambar','perla','coral','jade','rubi','roble','pino',
'cedro','hierba','musgo','helecho','colina','valle','lago','fuente','cumbre','gruta','roca','semilla',
'cuervo','paloma','gaviota','golondrina','aguila','halcon','ciervo','zorro','conejo','liebre','tortuga','delfin'];

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

/* Cryptographic random integer in [0, max) without modulo bias */
function randInt(max){
  if(max <= 0) return 0;
  const limit = Math.floor(0xFFFFFFFF / max) * max;
  const buf = new Uint32Array(1);
  do { crypto.getRandomValues(buf); } while(buf[0] >= limit);
  return buf[0] % max;
}

function buildPool(){
  let pool = '', groups = [];
  const amb = cAmb.checked;
  const add = (name, set) => {
    const filtered = amb ? [...set].filter(ch => !AMB[name].includes(ch)).join('') : set;
    if(filtered){ pool += filtered; groups.push(filtered); }
  };
  if(cUpper.checked) add('upper', SETS.upper);
  if(cLower.checked) add('lower', SETS.lower);
  if(cNums.checked)  add('nums',  SETS.nums);
  if(cSyms.checked)  add('syms',  SETS.syms);
  return { pool, groups };
}

function genPassword(n){
  const { pool, groups } = buildPool();
  if(!pool) return null;
  let pw = '';
  while(pw.length < n){
    const ch = pool[randInt(pool.length)];
    if(ch === pw[pw.length - 1]) continue; /* evita consecutivos idénticos */
    pw += ch;
  }
  /* Garantiza al menos un carácter de cada grupo activo */
  for(const g of groups){
    if(![...pw].some(ch => g.includes(ch))){
      for(let tries = 0; tries < 50; tries++){
        const idx = randInt(n);
        const ch = g[randInt(g.length)];
        const prevOk = idx === 0 || pw[idx-1] !== ch;
        const nextOk = idx === n-1 || pw[idx+1] !== ch;
        if(prevOk && nextOk){ pw = pw.slice(0, idx) + ch + pw.slice(idx + 1); break; }
      }
    }
  }
  return pw;
}

function genPassphrase(nWords){
  const seps = ['-', '-', '-', '_'];
  const words = [];
  let last = '';
  for(let i = 0; i < nWords; i++){
    let w;
    do { w = WORDS[randInt(WORDS.length)]; } while(w === last);
    words.push(w);
    last = w;
  }
  return words.join(seps[randInt(seps.length)]);
}

function strengthFromBits(bits, length){
  let label, color, pct;
  if(bits < 28)      { label='Muy débil'; color='#C63C22'; pct=12; }
  else if(bits < 36) { label='Débil';     color='#E08C1E'; pct=32; }
  else if(bits < 60) { label='Media';     color='#E0C01E'; pct=55; }
  else if(bits < 100){ label='Fuerte';    color='#4CA22B'; pct=78; }
  else               { label='Muy fuerte';color='#2E9C6A'; pct=100; }
  if(length < 12 && bits >= 36) { label = 'Débil'; color = '#E08C1E'; pct = 32; }
  return { label, color, pct };
}

function updateMeter(text){
  if(!text){ bitsEl.textContent = '—'; labelEl.textContent = '—';
    fillEl.style.width = '0%'; fillEl.style.background = ''; return; }
  let bitsVal;
  if(cPhrase.checked){
    const n = text.split(/[-_]/).filter(Boolean).length;
    bitsVal = n * Math.log2(WORDS.length) + 2; /* +2 bits por separador aleatorio */
  } else {
    bitsVal = text.length * Math.log2(buildPool().pool.length);
  }
  const s = strengthFromBits(bitsVal, text.length);
  bitsEl.textContent = bitsVal.toFixed(0);
  labelEl.textContent = s.label;
  labelEl.style.color = s.color;
  fillEl.style.width = s.pct + '%';
  fillEl.style.background = `linear-gradient(180deg, ${s.color}CC 0%, ${s.color} 49%, ${s.color}EE 51%, ${s.color} 100%)`;
  return bitsVal;
}

function generate(){
  if(cPhrase.checked){
    const n = randInt(5) + 4; /* 4-8 palabras */
    const pw = genPassphrase(n);
    show(pw, `Frase de paso con ${n} palabras de una lista de ${WORDS.length} · aleatoriedad criptográfica`);
  } else {
    if(!cUpper.checked && !cLower.checked && !cNums.checked && !cSyms.checked){
      toast('Activa al menos un tipo de carácter');
      return;
    }
    const pw = genPassword(len.value);
    if(!pw){ toast('Sin caracteres disponibles'); return; }
    const { pool } = buildPool();
    show(pw, `${pw.length} caracteres · alfabeto de ${pool.length} símbolos · aleatoriedad criptográfica`);
  }
}

function show(pw, note){
  if(cPhrase.checked){
    /* Presentación en chips; textContent conserva el valor exacto (palabras + separadores) */
    passEl.classList.add('chips');
    passEl.textContent = '';
    pw.split(/([-_])/).forEach(part => {
      const s = document.createElement('span');
      if(part === '-' || part === '_'){ s.className = 'sep'; s.textContent = part; }
      else if(part){ s.className = 'chip'; s.textContent = part; }
      passEl.appendChild(s);
    });
  } else {
    passEl.classList.remove('chips');
    passEl.textContent = pw;
  }
  passEl.classList.remove('placeholder');
  $('btnCopy').disabled = $('btnRegen').disabled = false;
  updateMeter(pw);
  statusEl.textContent = note;
}

/* Eventos */
len.addEventListener('input', () => lenval.textContent = len.value);

document.querySelectorAll('#opts input').forEach(chk => {
  chk.addEventListener('change', () => {
    if(chk === cPhrase && chk.checked){
      document.querySelectorAll('#cUpper,#cLower,#cNums,#cSyms,#cAmb').forEach(c => c.disabled = true);
      statusEl.textContent = 'Modo frase de paso: 4 a 8 palabras comunes en español.';
    } else if(chk === cPhrase && !chk.checked){
      document.querySelectorAll('#cUpper,#cLower,#cNums,#cSyms,#cAmb').forEach(c => c.disabled = false);
      statusEl.textContent = '';
    }
  });
});

$('btnGen').addEventListener('click', generate);
$('btnRegen').addEventListener('click', generate);

$('btnCopy').addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(passEl.textContent);
    toast('Contraseña copiada al portapapeles ✓');
  }catch(e){
    /* Fallback para contextos sin Clipboard API */
    const ta = document.createElement('textarea');
    ta.value = passEl.textContent; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    toast('Contraseña copiada al portapapeles ✓');
  }
});

/* Genera una al cargar */
generate();
</script>
