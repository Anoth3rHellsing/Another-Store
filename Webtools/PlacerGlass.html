<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlacerGlass — Placeholder &amp; Favicon Generator</title>
<style>
  :root{
    --cDeep:#07405E; --cInk:#0B5C8A; --cBlue2:#1F86C8; --cGreen2:#4CA22B;
    --cAmber2:#E08C1E; --cRed2:#C63C22; --Muted:#2C5F7E;
    --shadow:0 2px 16px rgba(10,58,86,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    color:var(--cDeep);
    background:
      linear-gradient(0deg, rgba(151,220,95,.85) 0%, rgba(103,208,196,.82) 18%, rgba(77,187,236,.82) 40%, rgba(149,217,246,.85) 70%, rgba(227,244,253,.89) 100%),
      linear-gradient(105deg,#E3F4FD 0%, #95D9F6 30%, #4DBBEC 60%, #67D0C4 82%, #97DC5F 100%);
    background-blend-mode:normal;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* TopGloss overlay */
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; height:170px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, rgba(255,255,255,.63) 0%, rgba(255,255,255,.26) 55%, transparent 100%);
  }
  /* Bubbles */
  .bubble{position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle at 35% 30%, #fff 0%, var(--t) 58%, transparent 100%);}
  .b1{width:300px;height:300px; left:-70px; top:38%; opacity:.30; --t:rgba(111,199,240,.9);}
  .b2{width:380px;height:380px; right:-90px; top:-110px; opacity:.26; --t:rgba(182,231,122,.9);}
  .b3{width:180px;height:180px; left:52%; bottom:-60px; opacity:.22; --t:rgba(255,217,122,.9);}

  .window{
    position:relative; z-index:1; max-width:980px; margin:46px auto; padding:0 24px 60px;
  }
  .titlebar{display:flex; align-items:center; gap:12px; height:46px; padding:0 6px;}
  .titlebar .logo{width:26px;height:26px;border-radius:7px;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow);
    display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
  .titlebar h1{font-size:25px; font-weight:300; color:var(--cDeep);}
  .titlebar h1 b{font-weight:600;}
  .titlebar .sub{margin-left:auto; font-size:12.5px; color:var(--Muted);}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.77) 45%, rgba(235,248,255,.69) 100%);
    border:1px solid rgba(255,255,255,.5);
    border-radius:14px; padding:18px; box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
    margin-bottom:18px;
  }
  h2{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--cDeep);}

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px;}

  label.field{display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--Muted);}
  input[type="number"]{
    height:34px; width:110px; padding:0 10px; border-radius:8px;
    border:1px solid rgba(44,95,126,.30); background:rgba(255,255,255,.70); color:var(--cDeep);
    font-family:inherit; font-size:13px; transition:.15s;
  }
  input[type="number"]:hover{background:rgba(255,255,255,.85);}
  input:focus-visible{outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;
    border-color:rgba(31,134,200,.55); background:rgba(255,255,255,.92);}
  .btn-ghost:focus-visible{outline:2px solid rgba(31,134,200,.45); outline-offset:1px;}
  input[type="color"]{
    width:52px; height:34px; padding:2px; border-radius:8px; cursor:pointer;
    border:1px solid rgba(44,95,126,.30); background:rgba(255,255,255,.70); transition:.15s;
  }
  input[type="color"]:hover{background:rgba(255,255,255,.85);}
  input[type="text"]#txt{
    flex:1; min-width:180px; height:34px; padding:0 10px; border-radius:8px;
    border:1px solid rgba(44,95,126,.30); background:rgba(255,255,255,.70); color:var(--cDeep);
    font-family:inherit; font-size:13px; transition:.15s;
  }
  #txt:hover{background:rgba(255,255,255,.85);}
  .swatch{display:flex; align-items:center; gap:8px;}
  .swatch code{
    font-family:Consolas,monospace; font-size:11.5px; color:var(--cDeep);
    background:rgba(255,255,255,.65); border:1px solid rgba(44,95,126,.22);
    border-radius:6px; padding:3px 7px; letter-spacing:.3px;
  }

  .presets{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .chip{
    position:relative; height:30px; padding:0 14px; border-radius:15px; cursor:pointer;
    font-family:inherit; font-size:12.5px; overflow:hidden;
    border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.45); color:var(--cDeep);
    box-shadow:0 1px 6px rgba(10,58,86,.15); transition:.15s;
  }
  .chip:hover{background:rgba(255,255,255,.7); box-shadow:0 1px 8px rgba(10,58,86,.22);}
  .chip:focus-visible{outline:2px solid rgba(31,134,200,.45); outline-offset:1px;}
  .chip:active{transform:translateY(1px);}
  .chip.active{
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%); color:#fff;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.45);
  }
  .chip.active::before{content:""; position:absolute; left:1px; right:1px; top:1px; height:13px;
    border-radius:14px 14px 0 0; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%);}

  /* Gloss buttons */
  .btn{
    position:relative; height:40px; padding:0 22px; border:none; border-radius:9px;
    font-family:inherit; font-size:13.5px; color:#fff; cursor:pointer; overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    transition:transform .05s, filter .15s;
  }
  .btn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
    background:rgba(255,255,255,.24); transition:.15s;}
  .btn:hover::before{opacity:1;}
  .btn:active{transform:translateY(1px); filter:brightness(.92);}
  .btn:disabled{opacity:.45; cursor:default; transform:none;}
  .btn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
  .btn-blue{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
  .btn-green{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
  .btn-amber{background:linear-gradient(180deg,#FFE6A8 0%,#F0A93A 49%,#D5871B 51%,#F7B950 100%);}
  .btn-red{background:linear-gradient(180deg,#FFB6A6 0%,#DD5C3E 49%,#B63B22 51%,#E0704F 100%);}

  .btn-ghost{
    height:34px; padding:0 16px; border-radius:8px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.4); color:var(--cDeep); font-family:inherit; font-size:13px; cursor:pointer; transition:.15s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.67);}

  /* Preview area */
  .stage{
    display:flex; align-items:center; justify-content:center; gap:28px; flex-wrap:wrap;
    min-height:230px; padding:24px; border-radius:12px;
    border:1px solid rgba(44,95,126,.22);
    background:rgba(255,255,255,.30);
    background-image:
      linear-gradient(45deg, rgba(44,95,126,.08) 25%, transparent 25%, transparent 75%, rgba(44,95,126,.08) 75%),
      linear-gradient(45deg, rgba(44,95,126,.08) 25%, transparent 25%, transparent 75%, rgba(44,95,126,.08) 75%);
    background-size:24px 24px; background-position:0 0, 12px 12px;
  }
  .preview-col{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .preview-col>small{font-size:11.5px; color:var(--Muted); background:rgba(255,255,255,.75);
    border:1px solid rgba(255,255,255,.55); border-radius:8px; padding:3px 10px;}
  .stage img.big{max-width:100%; max-height:220px; border-radius:6px; box-shadow:var(--shadow);
    image-rendering:auto;}
  .real-size{display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:12px; border-radius:10px; background:rgba(255,255,255,.42);
    border:1px solid rgba(255,255,255,.55); box-shadow:0 1px 6px rgba(10,58,86,.12);}
  .real-size img{box-shadow:0 0 0 1px rgba(44,95,126,.3), var(--shadow); border-radius:3px;
    image-rendering:pixelated; image-rendering:crisp-edges;}
  .real-size small{font-size:11.5px; color:var(--Muted);}
  .status{font-size:12.5px; color:var(--Muted); margin-top:10px; min-height:16px;}

  @media (max-width:640px){
    .window{margin:24px auto; padding:0 12px 40px;}
    .titlebar{flex-wrap:wrap; height:auto;}
    .titlebar .sub{margin-left:0; width:100%;}
    .stage{gap:18px; padding:14px;}
    input[type="number"]{width:100%;}
    label.field{flex:1 1 45%;}
  }

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(255,255,255,.9); backdrop-filter:blur(10px); color:var(--cDeep);
    border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 20px;
    box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:9;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>

<div class="window">
  <div class="titlebar">
    <div class="logo">▢</div>
    <h1>Placer<b>Glass</b></h1>
    <span class="sub">Placeholders &amp; favicons con canvas · Aero Glass</span>
  </div>

  <div class="card">
    <h2>1 · Configura tu imagen</h2>
    <div class="row" style="margin-top:0;">
      <label class="field">Ancho (px)
        <input type="number" id="w" min="1" max="4096" value="512">
      </label>
      <label class="field">Alto (px)
        <input type="number" id="h" min="1" max="4096" value="512">
      </label>
      <label class="field">Fondo
        <span class="swatch"><input type="color" id="bg" value="#1F86C8"><code id="bgHex">#1F86C8</code></span>
      </label>
      <label class="field">Texto
        <span class="swatch"><input type="color" id="fg" value="#FFFFFF"><code id="fgHex">#FFFFFF</code></span>
      </label>
      <label class="field" style="flex:1;">Texto personalizado (vacío = WxH)
        <input type="text" id="txt" placeholder="NxN" maxlength="40">
      </label>
    </div>
    <div class="presets" id="presets">
      <button class="chip" data-s="16">16×16</button>
      <button class="chip" data-s="32">32×32</button>
      <button class="chip" data-s="48">48×48</button>
      <button class="chip" data-s="64">64×64</button>
      <button class="chip" data-s="180">180×180 · Apple touch</button>
      <button class="chip" data-s="192">192×192</button>
      <button class="chip active" data-s="512">512×512</button>
    </div>
  </div>

  <div class="card">
    <h2>2 · Vista previa</h2>
    <div class="stage">
      <div class="preview-col">
        <div class="preview-col">
        <img id="prevBig" class="big" alt="Vista previa escalada">
        <small>Vista escalada</small>
      </div>
        <small>Vista previa escalada</small>
      </div>
      <div class="real-size">
        <img id="prevReal" alt="Vista previa a tamaño real">
        <small>Tamaño real (<span id="dims">512×512</span>)</small>
      </div>
    </div>
    <canvas id="cv" width="512" height="512" hidden></canvas>
    <div id="status" class="status"></div>
    <div class="row">
      <button id="btnDownload" class="btn btn-green"><span class="shine"></span>Descargar PNG</button>
      <button id="btnReset" class="btn-ghost">Restablecer</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const wIn = $('w'), hIn = $('h'), bgIn = $('bg'), fgIn = $('fg'), txtIn = $('txt');
const cv = $('cv'), ctx = cv.getContext('2d');
const prevBig = $('prevBig'), prevReal = $('prevReal'), statusEl = $('status');

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

function clampDim(v){
  v = Math.round(Number(v));
  if(!Number.isFinite(v) || v < 1) v = 1;
  return Math.min(v, 4096);
}

function draw(){
  const w = clampDim(wIn.value), h = clampDim(hIn.value);
  cv.width = w; cv.height = h;
  const label = txtIn.value.trim() || `${w}x${h}`;
  ctx.fillStyle = bgIn.value;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = fgIn.value;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let size = Math.max(8, Math.floor(Math.min(w, h) / 4));
  ctx.font = `600 ${size}px "Segoe UI", system-ui, sans-serif`;
  while(size > 6 && ctx.measureText(label).width > w * 0.9){
    size -= 2;
    ctx.font = `600 ${size}px "Segoe UI", system-ui, sans-serif`;
  }
  ctx.fillText(label, w / 2, h / 2);
  const url = cv.toDataURL('image/png');
  prevBig.src = url;
  prevReal.src = url;
  // Escalar la vista grande a un tamaño razonable de vista
  const scale = Math.min(320 / w, 220 / h, 1);
  prevBig.style.width = (w * scale) + 'px';
  prevBig.style.height = (h * scale) + 'px';
  // Tamaño real (limitado por el navegador si es enorme)
  prevReal.style.width = w + 'px';
  prevReal.style.height = h + 'px';
  prevReal.style.maxWidth = '100%';
  $('dims').textContent = `${w}×${h}`;
  statusEl.textContent = `Canvas ${w}×${h} px · texto "${label}" · PNG listo para descargar`;
}

function syncHexes(){
  $('bgHex').textContent = bgIn.value.toUpperCase();
  $('fgHex').textContent = fgIn.value.toUpperCase();
}

[wIn, hIn, bgIn, fgIn, txtIn].forEach(el => el.addEventListener('input', () => {
  syncHexes(); draw();
}));

$('presets').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  const s = Number(chip.dataset.s);
  wIn.value = s; hIn.value = s;
  draw();
});

$('btnDownload').addEventListener('click', () => {
  const w = clampDim(wIn.value), h = clampDim(hIn.value);
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = `placeholder-${w}x${h}.png`;
  a.click();
  toast('PNG descargado ✓');
});

$('btnReset').addEventListener('click', () => {
  wIn.value = 512; hIn.value = 512;
  bgIn.value = '#1F86C8'; fgIn.value = '#FFFFFF';
  txtIn.value = '';
  document.querySelectorAll('.chip').forEach(c =>
    c.classList.toggle('active', c.dataset.s === '512'));
  syncHexes(); draw();
  toast('Valores restablecidos');
});

syncHexes();
draw();
</script>
</body>
</html>
