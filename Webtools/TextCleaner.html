<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TextCleaner — Limpiador Aero Glass</title>
<style>
/* ========== Variables de diseño Aero Glass ========== */
:root{
 --cDeep:#07405E; --cInk:#0B5C8A; --cBlue2:#1F86C8; --cGreen2:#4CA22B;
 --cAmber2:#E08C1E; --cRed2:#C63C22; --Muted:#2C5F7E;
 --shadow:0 2px 16px rgba(10,58,86,.28);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}

/* ========== Fondo SkyBrush + overlay ========== */
body{
 font-family:"Segoe UI",system-ui,sans-serif;
 color:var(--cDeep);
 background:
  linear-gradient(0deg, rgba(151,220,95,.85) 0%, rgba(103,208,196,.82) 18%, rgba(77,187,236,.82) 40%, rgba(149,217,246,.85) 70%, rgba(227,244,253,.89) 100%),
  linear-gradient(105deg,#E3F4FD 0%, #95D9F6 30%, #4DBBEC 60%, #67D0C4 82%, #97DC5F 100%);
 background-blend-mode:normal;
 min-height:100vh;
 overflow-x:hidden;
}

/* ========== TopGloss (luz superior) ========== */
body::before{
 content:""; position:fixed; top:0; left:0; right:0; height:170px; pointer-events:none; z-index:0;
 background:linear-gradient(180deg, rgba(255,255,255,.63) 0%, rgba(255,255,255,.26) 55%, transparent 100%);
}

/* ========== Burbujas decorativas ========== */
.bubble{position:fixed; border-radius:50%; pointer-events:none; z-index:0;
 background:radial-gradient(circle at 35% 30%, #fff 0%, var(--t) 58%, transparent 100%);}
.b1{width:300px;height:300px; left:-70px; top:38%; opacity:.30; --t:rgba(111,199,240,.9);}
.b2{width:380px;height:380px; right:-90px; top:-110px; opacity:.26; --t:rgba(182,231,122,.9);}
.b3{width:180px;height:180px; left:52%; bottom:-60px; opacity:.22; --t:rgba(255,217,122,.9);}

/* ========== Ventana principal ========== */
.window{
 position:relative; z-index:1; max-width:980px; margin:46px auto; padding:0 24px 60px;
}

/* ========== Barra de título ========== */
.titlebar{display:flex; align-items:center; gap:12px; height:46px; padding:0 6px;}
.titlebar .logo{width:26px;height:26px;border-radius:7px;
 background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
 border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow);
 display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
.titlebar h1{font-size:25px; font-weight:300; color:var(--cDeep);}
.titlebar h1 b{font-weight:600;}
.titlebar .sub{margin-left:auto; font-size:12.5px; color:var(--Muted);}

/* ========== Tarjetas glass ========== */
.card{
 background:linear-gradient(180deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.77) 45%, rgba(235,248,255,.69) 100%);
 border:1px solid rgba(255,255,255,.5);
 border-radius:14px; padding:18px; box-shadow:var(--shadow);
 backdrop-filter:blur(12px);
 margin-bottom:18px;
}
h2{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--cDeep);}

/* ========== Textareas glass ========== */
textarea{
 width:100%; min-height:260px; resize:vertical; padding:12px;
 border-radius:8px; border:1px solid rgba(44,95,126,.25);
 background:rgba(255,255,255,.70); color:var(--cDeep);
 font-family:Consolas,monospace; font-size:13px; line-height:1.5;
}
textarea:focus{outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;}

/* ========== Tiles / opciones glass ========== */
.options-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-top:14px;}
.option-item{
 background:linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.55) 48%, rgba(235,248,255,.45) 52%, rgba(255,255,255,.65) 100%);
 border:1px solid rgba(255,255,255,.6);
 border-radius:12px; padding:14px 12px 12px; text-align:left;
 box-shadow:var(--shadow); backdrop-filter:blur(10px);
 position:relative; overflow:hidden;
 display:flex; align-items:center; gap:10px;
 min-height:52px; cursor:pointer; transition:.15s;
}
.option-item:hover{filter:brightness(1.04);}
.option-item::before{content:""; position:absolute; left:0; right:0; top:0; height:14px;
 background:linear-gradient(180deg, rgba(255,255,255,.7), transparent); pointer-events:none;}
.option-item::after{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; pointer-events:none;
 background:linear-gradient(180deg, var(--accent,#1F86C8), rgba(255,255,255,.25)); opacity:.85;}
.option-item.t-blue{--accent:var(--cBlue2);}
.option-item.t-green{--accent:var(--cGreen2);}
.option-item.t-amber{--accent:var(--cAmber2);}
.option-item input[type=checkbox]{flex:0 0 auto; margin:0;}
.option-item label{cursor:pointer; user-select:none; font-size:13px; color:var(--cDeep); line-height:1.35;}

/* ========== Estadísticas en tiles ========== */
.stats{
 background:linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.55) 48%, rgba(235,248,255,.45) 52%, rgba(255,255,255,.65) 100%);
 border:1px solid rgba(255,255,255,.6);
 border-radius:12px; padding:14px 12px 12px;
 box-shadow:var(--shadow); backdrop-filter:blur(10px);
 position:relative; overflow:hidden; font-size:13px; color:var(--cDeep); line-height:1.5;
}
.stats::before{content:""; position:absolute; left:0; right:0; top:0; height:14px;
 background:linear-gradient(180deg, rgba(255,255,255,.7), transparent); pointer-events:none;}
.stats::after{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; pointer-events:none;
 background:linear-gradient(180deg, var(--cBlue2), rgba(255,255,255,.25)); opacity:.85;}
.stats strong{color:var(--cInk);}

/* ========== Botones glossy ========== */
.btn-group{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
.btn{
 position:relative; height:40px; padding:0 22px; border:none; border-radius:9px;
 font-family:inherit; font-size:13.5px; color:#fff; cursor:pointer; overflow:hidden;
 box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
 transition:transform .05s, filter .15s;
}
.btn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
 background:rgba(255,255,255,.24); transition:.15s;}
.btn:hover::before{opacity:1;}
.btn:active{transform:translateY(1px); filter:brightness(.92);}
.btn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
 background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
.btn-blue{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
.btn-green{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
.btn-amber{background:linear-gradient(180deg,#FFE6A8 0%,#F0A93A 49%,#D5871B 51%,#F7B950 100%);}
.btn-red{background:linear-gradient(180deg,#FFB6A6 0%,#DD5C3E 49%,#B63B22 51%,#E0704F 100%);}
.btn-ghost{
 height:34px; padding:0 16px; border-radius:8px; border:1px solid rgba(255,255,255,.5);
 background:rgba(255,255,255,.4); color:var(--cDeep); font-family:inherit; font-size:13px; cursor:pointer; transition:.15s;
}
.btn-ghost:hover{background:rgba(255,255,255,.67);}

/* ========== Select glass ========== */
select{
 height:36px; padding:0 12px; border-radius:8px;
 border:1px solid rgba(44,95,126,.30); background:rgba(255,255,255,.70);
 color:var(--cDeep); font-family:inherit; font-size:13px;
}
select:focus{outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;}

/* ========== Toast con animación ========== */
.toast-container{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:0.5rem; z-index:9;}
.toast{
 background:rgba(255,255,255,.9); backdrop-filter:blur(10px); color:var(--cDeep);
 border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 20px;
 box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none;
 animation:slideUp .25s ease-out forwards;
}
@keyframes slideUp{from{transform:translateY(20px); opacity:0;}to{transform:translateY(0); opacity:1;}}

/* ========== Historial glass ========== */
.history-list{list-style:none; max-height:200px; overflow-y:auto;}
.history-item{
 padding:10px 12px; border-radius:8px; margin-bottom:6px; cursor:pointer; font-size:13px;
 background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.5);
 backdrop-filter:blur(8px); transition:.15s; color:var(--cDeep);
}
.history-item:hover{background:rgba(255,255,255,.75); border-color:rgba(31,134,200,.4);}
.history-item strong{color:var(--cInk);}
.history-item small{color:var(--Muted);}

/* ========== Responsive móvil ========== */
@media (max-width:640px){
 .window{margin:24px auto 40px; padding:0 12px 40px;}
 .titlebar h1{font-size:21px;}
 .titlebar .sub{display:none;}
 .options-grid{grid-template-columns:1fr;}
 .btn-group{flex-direction:column;}
 .btn{width:100%;}
 .btn-ghost{width:100%;}
 textarea{min-height:200px; font-size:12.5px;}
}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
<div class="window">
 <div class="titlebar">
  <div class="logo">T</div>
  <h1>Text<b>Cleaner</b></h1>
  <span class="sub">Limpiador de texto avanzado · Aero Glass</span>
 </div>

      <div class="card">
        <h2>1 · Texto de entrada</h2>
        <textarea id="inputText" placeholder="Pega aquí el texto sucio (copiado de PDFs, webs, etc.)..."></textarea>
        <div class="btn-group">
          <button class="btn btn-blue" onclick="pasteFromClipboard()"><span class="shine"></span>Pegar desde portapapeles</button>
          <button class="btn btn-ghost" onclick="clearInput()">Limpiar entrada</button>
        </div>
      </div>

      <div class="card">
        <h2>2 · Opciones de limpieza</h2>
        <div class="options-grid">
          <div class="option-item"><input type="checkbox" id="optRemoveExcessNewlines" checked><label for="optRemoveExcessNewlines">Quitar saltos de linea excesivos (max. 1)</label></div>
          <div class="option-item"><input type="checkbox" id="optRemoveMultipleSpaces" checked><label for="optRemoveMultipleSpaces">Eliminar espacios dobles/multiples</label></div>
          <div class="option-item"><input type="checkbox" id="optRemoveEndDots"><label for="optRemoveEndDots">Quitar puntos finales de cada linea</label></div>
          <div class="option-item"><input type="checkbox" id="optRemoveEmptyLines"><label for="optRemoveEmptyLines">Eliminar lineas vacias</label></div>
          <div class="option-item"><input type="checkbox" id="optNormalizeSpaces" checked><label for="optNormalizeSpaces">Normalizar espacios (trim + colapsar)</label></div>
          <div class="option-item"><input type="checkbox" id="optRemoveSpecialChars"><label for="optRemoveSpecialChars">Remover caracteres especiales/no imprimibles</label></div>
        </div>
        <div style="margin-top:1rem;">
          <label for="transformCase"><strong>Transformar mayusculas/minusculas:</strong></label>
          <select id="transformCase">
            <option value="none">Sin cambios</option>
            <option value="lowercase">Todo minusculas</option>
            <option value="uppercase">TODO MAYUSCULAS</option>
            <option value="capitalize">Capitalizar Cada Palabra</option>
            <option value="sentence">Tipo oracion (primera letra mayuscula)</option>
          </select>
        </div>
        <div class="btn-group">
          <button class="btn btn-ghost" onclick="resetOptions()">Resetear opciones</button>
        </div>
      </div>

      <div class="card">
        <h2>3 · Acciones</h2>
        <div class="btn-group">
          <button class="btn btn-blue" onclick="cleanText()"><span class="shine"></span>Limpiar texto</button>
          <button class="btn btn-green" onclick="copyResult()"><span class="shine"></span>Copiar resultado</button>
        </div>
      </div>

      <div class="card">
        <h2>4 · Resultado</h2>
        <textarea id="outputText" readonly placeholder="El texto limpio aparecerá aquí..."></textarea>
        <div class="stats" id="statsPanel"><strong>Estadísticas:</strong> Esperando limpieza...</div>
      </div>

      <div class="card">
        <h2>5 · Historial reciente</h2>
        <ul class="history-list" id="historyList"><li class="history-item" style="color:var(--Muted);">No hay historial aún</li></ul>
        <div class="btn-group">
          <button class="btn btn-red" onclick="clearHistory()"><span class="shine"></span>Borrar historial</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    /* ============================================
       MODULO: Gestion de Estado
       ============================================ */
    var AppState = {
      changesCount: 0,
      originalLength: 0,
      cleanedLength: 0,
      reset: function() {
        this.changesCount = 0;
        this.originalLength = 0;
        this.cleanedLength = 0;
      }
    };

    /* ============================================
       MODULO: Notificaciones Toast
       ============================================ */
    var ToastManager = {
      container: null,
      init: function() {
        this.container = document.getElementById('toastContainer');
      },
      show: function(message, duration) {
        if (!this.container) this.init();
        duration = duration || 3000;
        var toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        this.container.appendChild(toast);
        setTimeout(function() {
          toast.style.opacity = '0';
          setTimeout(function() { toast.remove(); }, 300);
        }, duration);
      },
      success: function(msg) { this.show('OK: ' + msg); },
      error: function(msg) { this.show('ERROR: ' + msg); },
      info: function(msg) { this.show('INFO: ' + msg); }
    };

    /* ============================================
       MODULO: Operaciones de Limpieza
       ============================================ */
    var TextOperations = {
      removeExcessNewlines: function(text) {
        var before = text;
        var result = text.replace(/\n{2,}/g, '\n');
        return { text: result, changes: before !== result ? (before.match(/\n{2,}/g) || []).length : 0 };
      },
      removeMultipleSpaces: function(text) {
        var before = text;
        var result = text.replace(/ {2,}/g, ' ');
        return { text: result, changes: before !== result ? (before.match(/ {2,}/g) || []).length : 0 };
      },
      removeEndDots: function(text) {
        var lines = text.split('\n');
        var changes = 0;
        var processed = lines.map(function(line) {
          if (line.endsWith('.')) { changes++; return line.slice(0, -1); }
          return line;
        });
        return { text: processed.join('\n'), changes: changes };
      },
      removeEmptyLines: function(text) {
        var before = text;
        var result = text.split('\n').filter(function(line) { return line.trim() !== ''; }).join('\n');
        var emptyLines = before.split('\n').filter(function(line) { return line.trim() === ''; }).length;
        return { text: result, changes: emptyLines };
      },
      normalizeSpaces: function(text) {
        var before = text;
        var result = text.trim().replace(/\s+/g, ' ');
        return { text: result, changes: before !== result ? 1 : 0 };
      },
      removeSpecialChars: function(text) {
        var before = text;
        var result = text.replace(/[^\w\s.,;:!?¡¿\-()\[\]{}"'`\n\r\t]/g, '');
        return { text: result, changes: before.length - result.length };
      },
      transformCase: function(text, mode) {
        switch (mode) {
          case 'lowercase': return text.toLowerCase();
          case 'uppercase': return text.toUpperCase();
          case 'capitalize': return text.replace(/\b\w/g, function(c) { return c.toUpperCase(); });
          case 'sentence': return text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, function(c) { return c.toUpperCase(); });
          default: return text;
        }
      }
    };

    /* ============================================
       MODULO: Historial (localStorage)
       ============================================ */
    var HistoryManager = {
      STORAGE_KEY: 'textcleaner_history',
      MAX_ITEMS: 5,
      getAll: function() {
        try {
          var data = localStorage.getItem(this.STORAGE_KEY);
          return data ? JSON.parse(data) : [];
        } catch (e) { return []; }
      },
      add: function(originalText, cleanedText, changesCount) {
        try {
          var history = this.getAll();
          var newItem = {
            timestamp: new Date().toISOString(),
            originalPreview: originalText.substring(0, 50) + (originalText.length > 50 ? '...' : ''),
            cleanedPreview: cleanedText.substring(0, 50) + (cleanedText.length > 50 ? '...' : ''),
            changesCount: changesCount,
            fullOriginal: originalText,
            fullCleaned: cleanedText
          };
          history.unshift(newItem);
          while (history.length > this.MAX_ITEMS) { history.pop(); }
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(history));
          this.render();
        } catch (e) { console.error('Error guardando historial:', e); }
      },
      clear: function() {
        try {
          localStorage.removeItem(this.STORAGE_KEY);
          this.render();
          ToastManager.success('Historial borrado');
        } catch (e) { ToastManager.error('Error al borrar historial'); }
      },
      restore: function(index) {
        var history = this.getAll();
        if (history[index]) {
          document.getElementById('inputText').value = history[index].fullOriginal;
          document.getElementById('outputText').value = history[index].fullCleaned;
          updateStats(history[index].changesCount, history[index].fullOriginal.length, history[index].fullCleaned.length);
          ToastManager.info('Elemento del historial restaurado');
        }
      },
      render: function() {
        var list = document.getElementById('historyList');
        var history = this.getAll();
        if (history.length === 0) {
          list.innerHTML = '<li class="history-item" style="color:#666;">No hay historial aun</li>';
          return;
        }
        list.innerHTML = history.map(function(item, index) {
          var date = new Date(item.timestamp);
          var timeStr = date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          return '<li class="history-item" onclick="HistoryManager.restore(' + index + ')">' +
            '<strong>' + timeStr + '</strong> - ' + item.changesCount + ' cambios<br>' +
            '<small>"' + item.cleanedPreview + '"</small></li>';
        }).join('');
      }
    };

    /* ============================================
       MODULO: Interfaz de Usuario
       ============================================ */
    function getSelectedOptions() {
      return {
        removeExcessNewlines: document.getElementById('optRemoveExcessNewlines').checked,
        removeMultipleSpaces: document.getElementById('optRemoveMultipleSpaces').checked,
        removeEndDots: document.getElementById('optRemoveEndDots').checked,
        removeEmptyLines: document.getElementById('optRemoveEmptyLines').checked,
        normalizeSpaces: document.getElementById('optNormalizeSpaces').checked,
        removeSpecialChars: document.getElementById('optRemoveSpecialChars').checked,
        transformCase: document.getElementById('transformCase').value
      };
    }

    function updateStats(changes, originalLen, cleanedLen) {
      var panel = document.getElementById('statsPanel');
      var diff = originalLen - cleanedLen;
      var percentReduction = originalLen > 0 ? ((diff / originalLen) * 100).toFixed(1) : 0;
      panel.innerHTML = '<strong>Estadisticas:</strong><br>' +
        'Correcciones aplicadas: <strong>' + changes + '</strong><br>' +
        'Caracteres originales: ' + originalLen + '<br>' +
        'Caracteres finales: ' + cleanedLen + '<br>' +
        'Reduccion: ' + (diff > 0 ? '-' : '+') + Math.abs(diff) + ' caracteres (' + percentReduction + '%)';
    }

    function cleanText() {
      var inputText = document.getElementById('inputText').value;
      if (!inputText.trim()) { ToastManager.error('No hay texto para limpiar'); return; }
      var options = getSelectedOptions();
      var result = inputText;
      var totalChanges = 0;
      if (options.removeSpecialChars) { var op = TextOperations.removeSpecialChars(result); result = op.text; totalChanges += op.changes; }
      if (options.removeExcessNewlines) { var op2 = TextOperations.removeExcessNewlines(result); result = op2.text; totalChanges += op2.changes; }
      if (options.removeEmptyLines) { var op3 = TextOperations.removeEmptyLines(result); result = op3.text; totalChanges += op3.changes; }
      if (options.removeEndDots) { var op4 = TextOperations.removeEndDots(result); result = op4.text; totalChanges += op4.changes; }
      if (options.removeMultipleSpaces) { var op5 = TextOperations.removeMultipleSpaces(result); result = op5.text; totalChanges += op5.changes; }
      if (options.normalizeSpaces) { var op6 = TextOperations.normalizeSpaces(result); result = op6.text; totalChanges += op6.changes; }
      if (options.transformCase !== 'none') { result = TextOperations.transformCase(result, options.transformCase); }
      AppState.originalLength = inputText.length;
      AppState.cleanedLength = result.length;
      AppState.changesCount = totalChanges;
      document.getElementById('outputText').value = result;
      updateStats(totalChanges, inputText.length, result.length);
      HistoryManager.add(inputText, result, totalChanges);
      ToastManager.success('Limpieza completada: ' + totalChanges + ' correcciones aplicadas');
    }

    function copyResult() {
      var outputText = document.getElementById('outputText').value;
      if (!outputText) { ToastManager.error('No hay resultado para copiar'); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(outputText).then(function() {
          ToastManager.success('Resultado copiado al portapapeles');
        }).catch(function() { fallbackCopy(); });
      } else { fallbackCopy(); }
      function fallbackCopy() {
        var ta = document.getElementById('outputText');
        ta.select();
        try { document.execCommand('copy'); ToastManager.success('Resultado copiado (fallback)'); }
        catch (e) { ToastManager.error('No se pudo copiar al portapapeles'); }
      }
    }

    function pasteFromClipboard() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function(text) {
          document.getElementById('inputText').value = text;
          ToastManager.success('Texto pegado desde el portapapeles');
        }).catch(function() {
          ToastManager.error('No se pudo acceder al portapapeles. Pega manualmente con Ctrl+V.');
        });
      } else {
        ToastManager.error('Clipboard API no disponible. Pega manualmente con Ctrl+V.');
      }
    }

    function clearInput() {
      document.getElementById('inputText').value = '';
      document.getElementById('outputText').value = '';
      AppState.reset();
      updateStats(0, 0, 0);
      ToastManager.info('Entrada limpiada');
    }

    function resetOptions() {
      document.getElementById('optRemoveExcessNewlines').checked = true;
      document.getElementById('optRemoveMultipleSpaces').checked = true;
      document.getElementById('optRemoveEndDots').checked = false;
      document.getElementById('optRemoveEmptyLines').checked = false;
      document.getElementById('optNormalizeSpaces').checked = true;
      document.getElementById('optRemoveSpecialChars').checked = false;
      document.getElementById('transformCase').value = 'none';
      ToastManager.info('Opciones restablecidas');
    }

    function clearHistory() {
      HistoryManager.clear();
    }

    // Inicializar al cargar
    document.addEventListener('DOMContentLoaded', function() {
      HistoryManager.render();
      ToastManager.init();
    });
  </script>
</body>
</html>
