<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TextCleaner — Limpieza de texto Aero Glass</title>
<style>
  :root{
    --cDeep:#07405E; --cInk:#0B5C8A; --cBlue2:#1F86C8; --cGreen2:#4CA22B;
    --cAmber2:#E08C1E; --cRed2:#C63C22; --Muted:#2C5F7E;
    --shadow:0 2px 16px rgba(10,58,86,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    color:var(--cDeep);
    background:
      linear-gradient(0deg, rgba(151,220,95,.85) 0%, rgba(103,208,196,.82) 18%, rgba(77,187,236,.82) 40%, rgba(149,217,246,.85) 70%, rgba(227,244,253,.89) 100%),
      linear-gradient(105deg,#E3F4FD 0%, #95D9F6 30%, #4DBBEC 60%, #67D0C4 82%, #97DC5F 100%);
    background-blend-mode:normal;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* TopGloss overlay */
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; height:170px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, rgba(255,255,255,.63) 0%, rgba(255,255,255,.26) 55%, transparent 100%);
  }
  /* Bubbles */
  .bubble{position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle at 35% 30%, #fff 0%, var(--t) 58%, transparent 100%);}
  .b1{width:300px;height:300px; left:-70px; top:38%; opacity:.30; --t:rgba(111,199,240,.9);}
  .b2{width:380px;height:380px; right:-90px; top:-110px; opacity:.26; --t:rgba(182,231,122,.9);}
  .b3{width:180px;height:180px; left:52%; bottom:-60px; opacity:.22; --t:rgba(255,217,122,.9);}

  .window{
    position:relative; z-index:1; max-width:980px; margin:46px auto; padding:0 24px 60px;
  }
  .titlebar{display:flex; align-items:center; gap:12px; height:46px; padding:0 6px;}
  .titlebar .logo{width:26px;height:26px;border-radius:7px;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow);
    display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
  .titlebar h1{font-size:25px; font-weight:300; color:var(--cDeep);}
  .titlebar h1 b{font-weight:600;}
  .titlebar .sub{margin-left:auto; font-size:12.5px; color:var(--Muted);}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.77) 45%, rgba(235,248,255,.69) 100%);
    border:1px solid rgba(255,255,255,.5);
    border-radius:14px; padding:18px; box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
    margin-bottom:18px;
  }
  h2{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--cDeep);}

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px;}

  /* Gloss buttons */
  .btn{
    position:relative; height:40px; padding:0 22px; border:none; border-radius:9px;
    font-family:inherit; font-size:13.5px; color:#fff; cursor:pointer; overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    transition:transform .05s, filter .15s;
  }
  .btn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
    background:rgba(255,255,255,.24); transition:.15s;}
  .btn:hover::before{opacity:1;}
  .btn:active{transform:translateY(1px); filter:brightness(.92);}
  .btn:disabled{opacity:.45; cursor:default; transform:none;}
  .btn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
  .btn-blue{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
  .btn-green{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
  .btn-amber{background:linear-gradient(180deg,#FFE6A8 0%,#F0A93A 49%,#D5871B 51%,#F7B950 100%);}
  .btn-red{background:linear-gradient(180deg,#FFB6A6 0%,#DD5C3E 49%,#B63B22 51%,#E0704F 100%);}

  .btn-ghost{
    height:34px; padding:0 16px; border-radius:8px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.4); color:var(--cDeep); font-family:inherit; font-size:13px; cursor:pointer; transition:.15s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.67);}

  textarea{
    width:100%; min-height:220px; resize:vertical; padding:12px;
    border-radius:8px; border:1px solid rgba(140,255,255,255,.5); border-color:rgba(44,95,126,.25);
    background:rgba(255,255,255,.70); color:var(--cDeep);
    font-family:Consolas,monospace; font-size:13px; line-height:1.5;
  }
  textarea:focus{outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;}
  textarea[readonly]{background:linear-gradient(180deg, rgba(238,249,255,.78) 0%, rgba(225,241,252,.70) 100%);}

  /* Checkboxes Aero custom */
  .checks{display:flex; flex-direction:column; gap:8px;}
  .checks label{
    display:flex; align-items:flex-start; gap:10px; cursor:pointer;
    padding:8px 10px; border-radius:9px; background:rgba(255,255,255,.38);
    border:1px solid rgba(255,255,255,.45); font-size:13.5px; transition:.15s;
  }
  .checks label:hover{background:rgba(255,255,255,.62);}
  .checks small{display:block; font-size:11.5px; color:var(--Muted); margin-top:1px;}
  .checks input[type="checkbox"]{
    appearance:none; -webkit-appearance:none; flex:0 0 auto;
    width:17px; height:17px; margin-top:2px; cursor:pointer; position:relative;
    border-radius:4px; border:1px solid rgba(44,95,126,.45);
    background:linear-gradient(180deg,#ffffff 0%,#E8F4FB 55%,#D6EBF6 100%);
    box-shadow:inset 0 1px 2px rgba(10,58,86,.15), 0 1px 0 rgba(255,255,255,.7);
    transition:.12s;
  }
  .checks input[type="checkbox"]:hover{border-color:var(--cBlue2);}
  .checks input[type="checkbox"]:checked{
    border-color:#1B7FC0;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    box-shadow:inset 0 1px 2px rgba(10,58,86,.25);
  }
  .checks input[type="checkbox"]:checked::after{
    content:""; position:absolute; left:4.5px; top:1px; width:5px; height:9px;
    border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(42deg);
    filter:drop-shadow(0 1px 1px rgba(10,58,86,.4));
  }
  .checks input[type="checkbox"]:focus-visible{outline:2px solid rgba(31,134,200,.45); outline-offset:1px;}

  .status{font-size:12.5px; color:var(--Muted); margin-top:8px; min-height:16px;}

  /* Contador ahorrado destacado */
  #saved{font-weight:600; color:var(--cGreen2);
    background:rgba(255,255,255,.55); border:1px solid rgba(76,162,43,.35);
    border-radius:8px; padding:2px 10px; margin-left:6px;
    box-shadow:0 1px 6px rgba(10,58,86,.15); display:inline-block;}

  /* Responsive móvil */
  @media (max-width:640px){
    .window{margin:20px auto; padding:0 12px 36px;}
    .titlebar{flex-wrap:wrap; height:auto; padding:6px; gap:8px;}
    .titlebar h1{font-size:21px;}
    .titlebar .sub{flex-basis:100%; margin-left:0; margin-top:-4px;}
    textarea{min-height:170px;}
    .row .btn, .row .btn-ghost{flex:1 1 auto;}
  }

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(255,255,255,.9); backdrop-filter:blur(10px); color:var(--cDeep);
    border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 20px;
    box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:9;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>

<div class="window">
  <div class="titlebar">
    <div class="logo">✎</div>
    <h1>Text<b>Cleaner</b></h1>
    <span class="sub">Limpieza de texto copiado de PDFs · 100% local</span>
  </div>

  <div class="card">
    <h2>1 · Pega el texto a limpiar</h2>
    <textarea id="input" placeholder="Pega aquí el texto copiado del PDF…&#10;&#10;Ej: párrafos cortados por saltos de línea, guio-&#10;nes de corte, espacios dobles y puntos suel-&#10;tos al final de línea." spellcheck="false"></textarea>
  </div>

  <div class="card">
    <h2>2 · Opciones de limpieza</h2>
    <div class="checks">
      <label><input type="checkbox" id="opJoins" checked>
        <span>Unir líneas cortadas de párrafos<small>Elimina saltos de línea innecesarios; el doble salto se mantiene como separador de párrafo.</small></span></label>
      <label><input type="checkbox" id="opHyphens" checked>
        <span>Quitar guiones y puntos de corte de PDF<small>Elimina «-» y «.» al final de línea (típico de textos copiados de PDF).</small></span></label>
      <label><input type="checkbox" id="opSpaces" checked>
        <span>Colapsar espacios múltiples<small>Convierte 2 o más espacios (o tabuladores) en uno solo.</small></span></label>
      <label><input type="checkbox" id="opPunct" checked>
        <span>Arreglar espacios en la puntuación<small>Quita espacios antes de «, . ; : ! ?» y garantiza un espacio después.</small></span></label>
      <label><input type="checkbox" id="opEmpty" checked>
        <span>Eliminar líneas vacías consecutivas<small>Reduce 3+ saltos de línea seguidos a un único párrafo en blanco.</small></span></label>
      <label><input type="checkbox" id="opLower">
        <span>Pasar todo a minúsculas <small>Opcional.</small></span></label>
    </div>
    <div class="row">
      <button id="btnClean" class="btn btn-blue"><span class="shine"></span>Limpiar</button>
      <button id="btnReset" class="btn-ghost">Restablecer opciones</button>
    </div>
  </div>

  <div class="card">
    <h2>3 · Resultado <span id="saved"></span></h2>
    <textarea id="output" placeholder="El texto limpio aparecerá aquí…" spellcheck="false" readonly></textarea>
    <div class="row">
      <button id="btnCopy" class="btn btn-green" disabled><span class="shine"></span>Copiar resultado</button>
      <button id="btnDownload" class="btn btn-amber" disabled><span class="shine"></span>Descargar .txt</button>
      <button id="btnClearOut" class="btn-ghost">Vaciar</button>
    </div>
    <div id="status" class="status"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const input = $('input'), output = $('output'), status = $('status'), saved = $('saved');
const ops = ['opJoins','opHyphens','opSpaces','opPunct','opEmpty','opLower'];
const defaults = {opJoins:true, opHyphens:true, opSpaces:true, opPunct:true, opEmpty:true, opLower:false};

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

function cleanText(text){
  let t = text.replace(/\r\n?/g, '\n');

  if($('opHyphens').checked){
    // guiones de corte: "palabra-\nbra" -> "palabra" + "bra" sin salto
    t = t.replace(/([a-záéíóúüñA-ZÁÉÍÓÚÑ])-\n(?=[a-záéíóúüñ])/g, '$1');
    // puntos sueltos al final de línea (cortes de PDF)
    t = t.replace(/[.·]\s*\n/g, '\n');
  }

  if($('opJoins').checked){
    // doble salto = párrafo; saltos únicos se unen con espacio
    t = t.split(/\n{2,}/).map(p => p.split(/\n+/).join(' ')).join('\n\n');
  }

  if($('opEmpty').checked){
    // 3+ saltos seguidos -> un párrafo en blanco (doble salto)
    t = t.replace(/\n{3,}/g, '\n\n');
  }

  if($('opSpaces').checked){
    t = t.replace(/[ \t]{2,}/g, ' ');
  }

  if($('opPunct').checked){
    // quitar espacio(s) antes de puntuación
    t = t.replace(/[ \t]+([,.;:!?])/g, '$1');
    // asegurar un espacio después de puntuación (si sigue letra)
    t = t.replace(/([,.;:!?])(?=[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])/g, '$1 ');
  }

  if($('opLower').checked){
    t = t.toLowerCase();
  }

  return t.replace(/[ \t]+$/gm, '').trim();
}

function runClean(){
  const original = input.value;
  if(!original.trim()){ toast('Primero pega algo de texto'); return; }
  const result = cleanText(original);
  output.value = result;
  const diff = original.length - result.length;
  saved.textContent = diff >= 0 ? `— ${diff} caracteres ahorrados (${original.length} → ${result.length})` : '';
  status.textContent = `Listo — ${result.split(/\s+/).filter(Boolean).length} palabras · ${result.length} caracteres`;
  $('btnCopy').disabled = $('btnDownload').disabled = !result;
  toast('Texto limpiado ✓');
}

$('btnClean').addEventListener('click', runClean);

// Vista previa en vivo (barata: solo si el texto es pequeño)
let liveT;
input.addEventListener('input', () => {
  clearTimeout(liveT);
  liveT = setTimeout(() => {
    const v = input.value;
    if(v.trim() && v.length <= 20000){
      const result = cleanText(v);
      output.value = result;
      const diff = v.length - result.length;
      saved.textContent = diff >= 0 ? `— ${diff} caracteres ahorrados (${v.length} → ${result.length})` : '';
      $('btnCopy').disabled = $('btnDownload').disabled = !result;
    }
  }, 250);
});

$('btnReset').addEventListener('click', () => {
  ops.forEach(id => $(id).checked = defaults[id]);
  toast('Opciones restablecidas');
});

$('btnCopy').addEventListener('click', async () => {
  await navigator.clipboard.writeText(output.value);
  toast('Copiado al portapapeles ✓');
});
$('btnDownload').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([output.value], {type:'text/plain;charset=utf-8'}));
  a.download = 'textcleaner.txt'; a.click();
});
$('btnClearOut').addEventListener('click', () => {
  output.value = ''; $('btnCopy').disabled = $('btnDownload').disabled = true;
  saved.textContent = ''; status.textContent = '';
});
</script>
</body>
</html>
