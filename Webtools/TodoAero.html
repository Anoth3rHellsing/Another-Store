<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Lista de tareas Aero Glass</title>
<style>
  :root{
    --cDeep:#07405E; --cInk:#0B5C8A; --cBlue2:#1F86C8; --cGreen2:#4CA22B;
    --cAmber2:#E08C1E; --cRed2:#C63C22; --Muted:#2C5F7E;
    --shadow:0 2px 16px rgba(10,58,86,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    color:var(--cDeep);
    background:
      linear-gradient(0deg, rgba(151,220,95,.85) 0%, rgba(103,208,196,.82) 18%, rgba(77,187,236,.82) 40%, rgba(149,217,246,.85) 70%, rgba(227,244,253,.89) 100%),
      linear-gradient(105deg,#E3F4FD 0%, #95D9F6 30%, #4DBBEC 60%, #67D0C4 82%, #97DC5F 100%);
    background-blend-mode:normal;
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; height:170px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, rgba(255,255,255,.63) 0%, rgba(255,255,255,.26) 55%, transparent 100%);
  }
  .bubble{position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle at 35% 30%, #fff 0%, var(--t) 58%, transparent 100%);}
  .b1{width:300px;height:300px; left:-70px; top:38%; opacity:.30; --t:rgba(111,199,240,.9);}
  .b2{width:380px;height:380px; right:-90px; top:-110px; opacity:.26; --t:rgba(182,231,122,.9);}
  .b3{width:180px;height:180px; left:52%; bottom:-60px; opacity:.22; --t:rgba(255,217,122,.9);}

  .window{position:relative; z-index:1; max-width:720px; margin:46px auto; padding:0 24px 60px;}
  .titlebar{display:flex; align-items:center; gap:12px; height:46px; padding:0 6px;}
  .titlebar .logo{width:26px;height:26px;border-radius:7px;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow);
    display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
  .titlebar h1{font-size:25px; font-weight:300; color:var(--cDeep);}
  .titlebar h1 b{font-weight:600;}
  .titlebar .sub{margin-left:auto; font-size:12.5px; color:var(--Muted);}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.77) 45%, rgba(235,248,255,.69) 100%);
    border:1px solid rgba(255,255,255,.5);
    border-radius:14px; padding:18px; box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
    margin-bottom:18px;
  }
  h2{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--cDeep);}

  /* Gloss buttons */
  .btn{
    position:relative; height:40px; padding:0 22px; border:none; border-radius:9px;
    font-family:inherit; font-size:13.5px; color:#fff; cursor:pointer; overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    transition:transform .05s, filter .15s;
  }
  .btn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
    background:rgba(255,255,255,.24); transition:.15s;}
  .btn:hover::before{opacity:1;}
  .btn:active{transform:translateY(1px); filter:brightness(.92);}
  .btn:disabled{opacity:.45; cursor:default; transform:none;}
  .btn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
  .btn-blue{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
  .btn-green{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
  .btn-red{background:linear-gradient(180deg,#FFB6A6 0%,#DD5C3E 49%,#B63B22 51%,#E0704F 100%);}

  .btn-ghost{
    height:34px; padding:0 16px; border-radius:8px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.4); color:var(--cDeep); font-family:inherit; font-size:13px; cursor:pointer; transition:.15s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.67);}

  /* Nueva tarea */
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .newrow{display:flex; gap:10px; margin-bottom:6px;}
  input[type=text]{
    flex:1; height:40px; padding:0 12px; border-radius:9px;
    border:1px solid rgba(44,95,126,.25); background:rgba(255,255,255,.70); color:var(--cDeep);
    font-family:inherit; font-size:13.5px;
  }
  input[type=text]:focus{outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;}

  /* Stats */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; align-items:stretch; margin-top:14px;}
  .stat{text-align:center; padding:12px 8px 10px; border-radius:10px; position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,.60) 0%, rgba(255,255,255,.42) 100%);
    border:1px solid rgba(255,255,255,.55); box-shadow:0 1px 6px rgba(10,58,86,.12);
    transition:.15s;}
  .stat:hover{background:linear-gradient(180deg, rgba(255,255,255,.75) 0%, rgba(255,255,255,.55) 100%);}
  .stat .num{font-size:22px; font-weight:600; color:var(--cInk); line-height:1.1;}
  .stat .lbl{font-size:11.5px; color:var(--Muted); margin-top:3px;}

  /* Progress bar */
  .bar{height:12px; border-radius:7px; background:rgba(255,255,255,.35);
    border:1px solid rgba(255,255,255,.45); overflow:hidden; margin-top:16px;
    box-shadow:inset 0 1px 3px rgba(10,58,86,.15);}
  .bar .fill{height:100%; width:0%; border-radius:6px; position:relative;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    box-shadow:0 1px 4px rgba(27,127,192,.4);
    transition:width .35s ease;}
  .bar .fill::after{content:""; position:absolute; top:0; left:0; right:0; height:5px;
    background:linear-gradient(180deg, rgba(255,255,255,.7) 0%, rgba(255,255,255,.2) 100%);
    border-radius:6px 6px 0 0;}
  .barlabel{font-size:12.5px; color:var(--Muted); margin-top:7px; text-align:right;}

  /* Filters */
  .filters{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center;}
  .filters .spacer{flex:1;}
  .chip{
    height:30px; padding:0 14px; border-radius:15px; border:1px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.42); color:var(--cDeep); font-family:inherit; font-size:12.5px; cursor:pointer; transition:.15s;
    position:relative; overflow:hidden;
    box-shadow:0 1px 4px rgba(10,58,86,.10);
  }
  .chip:hover{background:rgba(255,255,255,.68); border-color:rgba(255,255,255,.8);}
  .chip.active{
    color:#fff; border-color:rgba(255,255,255,.6);
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    text-shadow:0 1px 1px rgba(7,64,94,.35);
  }
  .chip.active::after{content:""; position:absolute; left:2px; right:2px; top:1px; height:12px;
    border-radius:12px 12px 0 0; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.6) 0%, transparent 100%);}
  .chip:not(.active):active{transform:translateY(1px);}

  /* Task list */
  ul#list{list-style:none; margin-top:12px;}
  .task{
    display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:8px;
    border-radius:10px;
    background:linear-gradient(180deg, rgba(255,255,255,.58) 0%, rgba(255,255,255,.42) 100%);
    border:1px solid rgba(255,255,255,.55);
    box-shadow:0 1px 6px rgba(10,58,86,.10);
    transition:opacity .25s, transform .25s, max-height .25s, background .18s, border-color .18s, box-shadow .18s;
    animation:taskIn .25s ease;
  }
  .task:hover{
    background:linear-gradient(180deg, rgba(255,255,255,.80) 0%, rgba(255,255,255,.62) 100%);
    border-color:rgba(255,255,255,.85);
    box-shadow:0 2px 12px rgba(10,58,86,.18);
  }
  @keyframes taskIn{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}
  .task.removing{opacity:0; transform:translateX(24px);}

  /* Custom Aero checkbox */
  .task input[type=checkbox]{
    position:relative; width:20px; height:20px; flex:none; cursor:pointer;
    -webkit-appearance:none; appearance:none;
    border-radius:5px; border:1px solid rgba(44,95,126,.45);
    background:linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(232,246,255,.85) 100%);
    box-shadow:inset 0 1px 2px rgba(10,58,86,.18);
    transition:background .15s, border-color .15s, transform .1s;
  }
  .task input[type=checkbox]:hover{border-color:var(--cBlue2);}
  .task input[type=checkbox]:active{transform:scale(.92);}
  .task input[type=checkbox]::after{
    content:"✓"; position:absolute; inset:0; display:grid; place-items:center;
    font-size:13px; font-weight:700; color:#fff;
    opacity:0; transform:scale(.4); transition:opacity .18s, transform .18s;
    text-shadow:0 1px 1px rgba(7,64,94,.4);
  }
  .task input[type=checkbox]:checked{
    border-color:#1B7FC0;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    box-shadow:0 1px 5px rgba(27,127,192,.45), inset 0 0 0 1px rgba(255,255,255,.35);
  }
  .task input[type=checkbox]:checked::after{opacity:1; transform:scale(1);}

  .task .txt{flex:1; font-size:13.5px; word-break:break-word; cursor:default;
    text-decoration:line-through transparent; transition:color .3s, text-decoration-color .3s;}
  .task.done .txt{color:var(--Muted); text-decoration-color:rgba(44,95,126,.55);}
  .task.done .check{opacity:.9;}
  .task .txt[contenteditable="true"], .task input.edit{
    flex:1; font-size:13.5px; font-family:inherit; color:var(--cDeep);
    padding:4px 8px; border-radius:7px; border:1px solid rgba(31,134,200,.5); background:#fff; outline:none;
  }
  .mini{
    height:30px; width:30px; border:none; border-radius:8px; cursor:pointer; flex:none;
    font-size:14px; line-height:1; color:var(--cDeep); background:rgba(255,255,255,.5);
    border:1px solid rgba(255,255,255,.6); transition:.15s;
    box-shadow:0 1px 4px rgba(10,58,86,.10);
  }
  .mini:hover{background:rgba(255,255,255,.85); border-color:rgba(255,255,255,.9);}
  .mini:active{transform:translateY(1px);}
  .mini.del:hover{background:rgba(224,112,79,.25); color:var(--cRed2); border-color:rgba(198,60,34,.35);}
  .empty{font-size:13px; color:var(--Muted); text-align:center; padding:22px 0 8px;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.82) 100%);
    backdrop-filter:blur(10px); color:var(--cDeep);
    border:1px solid rgba(255,255,255,.65); border-radius:10px; padding:10px 20px;
    box-shadow:0 4px 24px rgba(10,58,86,.3); font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:9;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Responsive */
  @media (max-width:600px){
    .window{margin:24px auto; padding:0 12px 40px;}
    .titlebar h1{font-size:21px;}
    .titlebar .sub{display:none;}
    .newrow{flex-direction:column; align-items:stretch;}
    .newrow .btn{width:100%;}
    .filters{gap:6px;}
    .filters .spacer{display:none;}
    .filters .btn{width:100%;}
    .stat .num{font-size:19px;}
    .task{padding:9px 10px; gap:8px;}
  }
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>

<div class="window">
  <div class="titlebar">
    <div class="logo">✓</div>
    <h1>Task<b>Flow</b></h1>
    <span class="sub">Lista de tareas · Aero Glass</span>
  </div>

  <div class="card">
    <h2>Nueva tarea</h2>
    <div class="newrow">
      <input type="text" id="newTask" placeholder="Escribe una tarea y pulsa Enter…" autocomplete="off" maxlength="500">
      <button id="btnAdd" class="btn btn-green"><span class="shine"></span>Añadir</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="nTotal">0</div><div class="lbl">Total</div></div>
      <div class="stat"><div class="num" id="nPend">0</div><div class="lbl">Pendientes</div></div>
      <div class="stat"><div class="num" id="nDone">0</div><div class="lbl">Completadas</div></div>
    </div>
    <div class="bar"><div id="fill" class="fill"></div></div>
    <div class="barlabel" id="barlabel">0% completado</div>
  </div>

  <div class="card">
    <div class="filters">
      <button class="chip active" data-f="all">Todas</button>
      <button class="chip" data-f="pending">Pendientes</button>
      <button class="chip" data-f="done">Completadas</button>
      <span class="spacer"></span>
      <button id="btnClearDone" class="btn btn-red" style="height:34px;"><span class="shine" style="height:14px;"></span>Borrar completadas</button>
    </div>
    <ul id="list"></ul>
    <div id="empty" class="empty">No hay tareas todavía. ¡Añade la primera!</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'taskflow_tasks';
let tasks = [];
let filter = 'all';

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

function save(){ localStorage.setItem(KEY, JSON.stringify(tasks)); }

function load(){
  try{ tasks = JSON.parse(localStorage.getItem(KEY)) || []; }catch{ tasks = []; }
}

function stats(){
  const total = tasks.length, done = tasks.filter(t=>t.done).length;
  $('nTotal').textContent = total;
  $('nPend').textContent = total - done;
  $('nDone').textContent = done;
  const pct = total ? Math.round(done/total*100) : 0;
  $('fill').style.width = pct + '%';
  $('barlabel').textContent = pct + '% completado';
  $('empty').style.display = (visibleTasks().length || (filter!=='all' && total)) ? 'none' : (total ? 'none' : 'block');
  if(total && visibleTasks().length===0){
    $('empty').style.display='block';
    $('empty').textContent = filter==='pending' ? 'No hay tareas pendientes ✓'
      : filter==='done' ? 'Aún no hay tareas completadas' : 'No hay tareas todavía. ¡Añade la primera!';
  } else if(!total){ $('empty').textContent = 'No hay tareas todavía. ¡Añade la primera!'; }
}

function visibleTasks(){
  return filter==='pending' ? tasks.filter(t=>!t.done)
       : filter==='done' ? tasks.filter(t=>t.done)
       : tasks;
}

function render(){
  const list = $('list');
  list.innerHTML = '';
  visibleTasks().forEach(t => {
    const li = document.createElement('li');
    li.className = 'task' + (t.done ? ' done' : '');
    li.dataset.id = t.id;

    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = t.done;
    cb.addEventListener('change', () => toggle(t.id));
    li.appendChild(cb);

    const txt = document.createElement('div');
    txt.className = 'txt'; txt.textContent = t.text;
    txt.title = 'Doble clic para editar';
    txt.addEventListener('dblclick', () => startEdit(li, t, txt));
    li.appendChild(txt);

    const bEdit = document.createElement('button');
    bEdit.className = 'mini'; bEdit.textContent = '✎'; bEdit.title = 'Editar';
    bEdit.addEventListener('click', () => startEdit(li, t, txt));
    li.appendChild(bEdit);

    const bDel = document.createElement('button');
    bDel.className = 'mini del'; bDel.textContent = '🗑'; bDel.title = 'Eliminar';
    bDel.addEventListener('click', () => remove(t.id, li));
    li.appendChild(bDel);

    list.appendChild(li);
  });
  stats();
}

function startEdit(li, t, txt){
  const input = document.createElement('input');
  input.type = 'text'; input.className = 'edit'; input.value = t.text; input.maxLength = 500;
  txt.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = (commit) => {
    if(done) return; done = true;
    const v = input.value.trim();
    if(commit && v && v !== t.text){
      t.text = v; save(); toast('Tarea actualizada ✓');
    }
    render();
  };
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter') finish(true);
    if(e.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
}

function add(){
  const input = $('newTask');
  const v = input.value.trim();
  if(!v){ toast('Escribe primero una tarea'); input.focus(); return; }
  tasks.unshift({ id: Date.now() + '' + Math.random().toString(16).slice(2,6), text: v, done: false });
  input.value = ''; input.focus();
  save(); render(); toast('Tarea añadida ✓');
}

function toggle(id){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  t.done = !t.done; save(); render();
}

function remove(id, li){
  li.classList.add('removing');
  setTimeout(() => {
    tasks = tasks.filter(x=>x.id!==id);
    save(); render(); toast('Tarea eliminada');
  }, 200);
}

$('btnAdd').addEventListener('click', add);
$('newTask').addEventListener('keydown', e => { if(e.key === 'Enter') add(); });

document.querySelectorAll('.chip').forEach(ch => {
  ch.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    ch.classList.add('active');
    filter = ch.dataset.f;
    render();
  });
});

$('btnClearDone').addEventListener('click', () => {
  const n = tasks.filter(t=>t.done).length;
  if(!n){ toast('No hay tareas completadas'); return; }
  tasks = tasks.filter(t=>!t.done);
  save(); render(); toast(n + ' completada' + (n>1?'s':'') + ' borrada' + (n>1?'s':''));
});

load();
render();
</script>
</body>
</html>
