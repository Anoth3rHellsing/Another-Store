<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro - Temporizador de Foco</title>
<style>
/* === VARIABLES CSS — Design Spec Aero Glass === */
:root{
  --cDeep:#07405E; --cInk:#0B5C8A; --cBlue2:#1F86C8; --cGreen2:#4CA22B;
  --cAmber2:#E08C1E; --cRed2:#C63C22; --Muted:#2C5F7E;
  --shadow:0 2px 16px rgba(10,58,86,.28);
  --progress-color:#1F86C8;
}

/* === RESET Y BASE === */
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}

/* === FONDO SKYBRUSH CON DOBLE GRADIENTE === */
body{
  font-family:"Segoe UI",system-ui,sans-serif;
  color:var(--cDeep);
  background:
    linear-gradient(0deg, rgba(151,220,95,.85) 0%, rgba(103,208,196,.82) 18%, rgba(77,187,236,.82) 40%, rgba(149,217,246,.85) 70%, rgba(227,244,253,.89) 100%),
    linear-gradient(105deg,#E3F4FD 0%, #95D9F6 30%, #4DBBEC 60%, #67D0C4 82%, #97DC5F 100%);
  background-blend-mode:normal;
  min-height:100vh;
  overflow-x:hidden;
}

/* === TOPGLOSS OVERLAY (170px) === */
body::before{
  content:""; position:fixed; top:0; left:0; right:0; height:170px; pointer-events:none; z-index:0;
  background:linear-gradient(180deg, rgba(255,255,255,.63) 0%, rgba(255,255,255,.26) 55%, transparent 100%);
}

/* === BURBUJAS DECORATIVAS === */
.bubble{position:fixed; border-radius:50%; pointer-events:none; z-index:0;
  background:radial-gradient(circle at 35% 30%, #fff 0%, var(--t) 58%, transparent 100%);}
.b1{width:300px;height:300px; left:-70px; top:38%; opacity:.30; --t:rgba(111,199,240,.9);}
.b2{width:380px;height:380px; right:-90px; top:-110px; opacity:.26; --t:rgba(182,231,122,.9);}
.b3{width:180px;height:180px; left:52%; bottom:-60px; opacity:.22; --t:rgba(255,217,122,.9);}

/* === CONTENEDOR PRINCIPAL === */
.window{
  position:relative; z-index:1; max-width:800px; margin:46px auto; padding:0 24px 60px;
}

/* === BARRA DE TÍTULO === */
.titlebar{display:flex; align-items:center; gap:12px; height:46px; padding:0 6px;}
.titlebar .logo{width:26px;height:26px;border-radius:7px;
  background:linear-gradient(180deg,#FFB6A6 0%,#DD5C3E 49%,#B63B22 51%,#E0704F 100%);
  border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow);
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
.titlebar h1{font-size:25px; font-weight:300; color:var(--cDeep);}
.titlebar h1 b{font-weight:600;}
.titlebar .sub{margin-left:auto; font-size:12.5px; color:var(--Muted);}

/* === TARJETAS CON GLASS === */
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.77) 45%, rgba(235,248,255,.69) 100%);
  border:1px solid rgba(255,255,255,.5);
  border-radius:14px; padding:18px; box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
  margin-bottom:18px;
}
h2,h3{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--cDeep);}

/* === INDICADOR DE FASE (PILL GLASS) === */
.phase-indicator{
  text-align:center; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:1.5px;
  margin-bottom:14px; display:inline-block; padding:6px 18px; border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.92) 0%, rgba(235,248,255,.75) 100%);
  border:1px solid rgba(44,95,126,.22);
  box-shadow:0 1px 4px rgba(10,58,86,.14), inset 0 1px 0 rgba(255,255,255,.8);
  color:var(--cBlue2); transition:color .3s, border-color .3s;
}
.phase-indicator.phase-focus{color:var(--cBlue2); border-color:rgba(31,134,200,.35);}
.phase-indicator.phase-shortBreak{color:var(--cGreen2); border-color:rgba(76,162,43,.35);}
.phase-indicator.phase-longBreak{color:var(--cAmber2); border-color:rgba(224,140,30,.35);}
.phase-indicator-wrap{text-align:center;}

/* === ANILLO DE PROGRESO SVG === */
.progress-ring{display:block; margin:0 auto;}
.progress-ring__bg{stroke:rgba(89,255,255,255,.35); fill:transparent;}
.progress-ring__circle{
  transition:stroke-dashoffset 0.5s ease-in-out, stroke 0.3s;
  transform:rotate(-90deg); transform-origin:50% 50%;
  stroke:var(--progress-color);
}

/* === TIMER DISPLAY GRANDE === */
.timer-display{
  font-size:5rem; font-weight:300; text-align:center;
  font-variant-numeric:tabular-nums; line-height:1;
  margin:16px 0 8px; color:var(--cDeep);
  font-family:Consolas,"Courier New",monospace;
  text-shadow:0 1px 8px rgba(10,58,86,.10);
}

/* === CONTADOR POMODOROS === */
.pomodoro-counter{
  text-align:center; font-size:13px; margin-top:10px; color:var(--Muted);
}
.pomodoro-counter strong{color:var(--cInk); font-weight:600;}

/* === CONTROLES === */
.controls{
  display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px;
}

/* === BOTONES GLOSSY === */
.btn{
  position:relative; height:40px; padding:0 22px; border:none; border-radius:9px;
  font-family:inherit; font-size:13.5px; color:#fff; cursor:pointer; overflow:hidden;
  box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
  transition:transform .05s, filter .15s;
}
.btn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
  background:rgba(255,255,255,.24); transition:.15s;}
.btn:hover::before{opacity:1;}
.btn:active{transform:translateY(1px); filter:brightness(.92);}
.btn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
  background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
.btn-blue{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
.btn-green{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
.btn-amber{background:linear-gradient(180deg,#FFE6A8 0%,#F0A93A 49%,#D5871B 51%,#F7B950 100%);}
.btn-red{background:linear-gradient(180deg,#FFB6A6 0%,#DD5C3E 49%,#B63B22 51%,#E0704F 100%);}

/* === BOTÓN GHOST === */
.btn-ghost{
  height:34px; padding:0 16px; border-radius:8px; border:1px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.4); color:var(--cDeep); font-family:inherit; font-size:13px; cursor:pointer; transition:.15s;
}
.btn-ghost:hover{background:rgba(255,255,255,.67);}

/* === TOGGLE MODO FOCUS === */
.toggle-container{
  display:flex; align-items:center; gap:10px; justify-content:center; margin-top:15px;
  font-size:13px; color:var(--Muted);
}
.toggle-switch{position:relative; width:52px; height:26px; flex-shrink:0;}
.toggle-switch input{opacity:0; width:0; height:0;}
.toggle-slider{
  position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0;
  background:rgba(89,255,255,255,.35); border-radius:26px; transition:.3s;
  border:1px solid rgba(255,255,255,.4);
}
.toggle-slider:before{
  position:absolute; content:""; height:20px; width:20px; left:3px; bottom:2px;
  background:linear-gradient(180deg, #fff 0%, #E2F1FC 100%);
  border-radius:50%; transition:.3s;
  box-shadow:0 1px 4px rgba(10,58,86,.25);
}
input:checked + .toggle-slider{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
input:checked + .toggle-slider:before{transform:translateX(24px);}

/* === ATAJOS HINT === */
.shortcuts-hint{
  text-align:center; font-size:11.5px; color:var(--Muted); margin-top:12px; opacity:.7;
}

/* === CONFIGURACIÓN === */
.config-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px;
}
.config-item{display:flex; flex-direction:column; gap:5px;}
.config-item label{font-size:12px; font-weight:600; color:var(--Muted);}

/* === INPUT NUMBER GLASS === */
input[type=number]{
  height:36px; padding:0 12px; border-radius:8px;
  border:1px solid rgba(44,95,126,.30); background:rgba(255,255,255,.70);
  color:var(--cDeep); font-family:inherit; font-size:13px; width:100%;
  box-sizing:border-box;
}
input[type=number]:focus{outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;}

/* === TILES DE ESTADÍSTICAS === */
.stats-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:12px;}
.tile{
  background:linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.55) 48%, rgba(235,248,255,.45) 52%, rgba(255,255,255,.65) 100%);
  border:1px solid rgba(255,255,255,.6);
  border-radius:12px; padding:14px 12px 12px; text-align:center;
  box-shadow:var(--shadow); backdrop-filter:blur(10px);
  position:relative; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  min-height:96px;
}
.tile::before{content:""; position:absolute; left:0; right:0; top:0; height:14px;
  background:linear-gradient(180deg, rgba(255,255,255,.7), transparent); pointer-events:none;}
.tile::after{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; pointer-events:none;
  background:linear-gradient(180deg, var(--accent,#1F86C8), rgba(255,255,255,.25)); opacity:.85;}
.tile .tile-value{font-size:24px; font-weight:600; color:var(--cInk); line-height:1.15; font-variant-numeric:tabular-nums;}
.tile .tile-label{font-size:11.5px; color:var(--Muted); text-transform:uppercase; letter-spacing:.4px; line-height:1.35;}
.tile.t-blue{--accent:var(--cBlue2);} .tile.t-blue .tile-value{color:var(--cBlue2);}
.tile.t-green{--accent:var(--cGreen2);} .tile.t-green .tile-value{color:var(--cGreen2);}
.tile.t-amber{--accent:var(--cAmber2);} .tile.t-amber .tile-value{color:var(--cAmber2);}
.tile.t-red{--accent:var(--cRed2);} .tile.t-red .tile-value{color:var(--cRed2);}

/* === GRÁFICO SEMANAL === */
.weekly-chart{
  display:flex; align-items:flex-end; justify-content:space-around;
  height:150px; gap:8px; margin-top:18px; padding:10px 0;
  background:rgba(255,255,255,.25); border-radius:10px;
  border:1px solid rgba(255,255,255,.35);
}
.chart-bar-container{
  display:flex; flex-direction:column; align-items:center; flex:1; height:100%;
}
.chart-bar{
  width:100%; max-width:40px;
  background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
  border-radius:4px 4px 0 0;
  transition:height 0.3s ease;
  margin-top:auto; min-height:2px;
  box-shadow:0 1px 4px rgba(10,58,86,.18);
}
.chart-label{font-size:11px; margin-top:8px; color:var(--Muted);}

/* === TOAST === */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:rgba(255,255,255,.9); backdrop-filter:blur(10px); color:var(--cDeep);
  border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 20px;
  box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:9;
  max-width:300px; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* Animación legacy para JS que usa slideIn */
@keyframes slideIn{
  from{transform:translateX(100%); opacity:0;}
  to{transform:translateX(0); opacity:1;}
}

/* === MODO FOCUS === */
.focus-mode .stats-section,
.focus-mode .config-section{
  display:none;
}

/* === RESPONSIVE MÓVIL === */
@media (max-width:640px){
  .window{margin:24px auto 40px; padding:0 12px 40px;}
  .titlebar h1{font-size:21px;}
  .titlebar .sub{display:none;}
  .timer-display{font-size:3.5rem;}
  .controls{flex-direction:column;}
  .btn{width:100%;}
  .stats-grid{grid-template-columns:repeat(2,1fr); gap:10px;}
  .tile{min-height:88px; padding:12px 10px 10px;}
  .tile .tile-value{font-size:20px;}
  .config-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<!-- Burbujas decorativas de fondo -->
<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>

<div class="window" id="mainWindow">
  <div class="titlebar">
    <div class="logo">🍅</div>
    <h1>Pomo<b>doro</b></h1>
    <span class="sub">Temporizador de foco · Aero Glass</span>
  </div>

  <!-- Tarjeta principal del temporizador -->
  <div class="card timer-section">
    <div class="phase-indicator-wrap">
      <div class="phase-indicator phase-focus" id="phaseIndicator">FOCO</div>
    </div>

    <!-- Anillo de progreso SVG -->
    <svg class="progress-ring" width="280" height="280">
      <circle class="progress-ring__bg" stroke="rgba(89,255,255,255,.35)" stroke-width="12" fill="transparent" r="120" cx="140" cy="140"/>
      <circle class="progress-ring__circle" stroke="var(--progress-color)" stroke-width="12" fill="transparent" r="120" cx="140" cy="140" stroke-linecap="round"/>
    </svg>

    <div class="timer-display" id="timerDisplay">25:00</div>

    <div class="pomodoro-counter">
      🍅 Pomodoros hoy: <strong id="todayCount">0</strong>
    </div>

    <!-- Controles principales -->
    <div class="controls">
      <button class="btn btn-green" id="startBtn"><span class="shine"></span>▶ Iniciar</button>
      <button class="btn btn-amber" id="pauseBtn" style="display:none;"><span class="shine"></span>⏸ Pausar</button>
      <button class="btn btn-blue" id="skipBtn"><span class="shine"></span>⏭ Saltar</button>
      <button class="btn btn-red" id="resetBtn"><span class="shine"></span>↺ Reiniciar</button>
    </div>

    <!-- Toggle modo foco -->
    <div class="toggle-container">
      <span>Modo Focus</span>
      <label class="toggle-switch">
        <input type="checkbox" id="focusModeToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="shortcuts-hint">
      Espacio: Play/Pausa | S: Saltar | R: Reiniciar
    </div>
  </div>

  <!-- Configuración rápida -->
  <div class="card config-section">
    <h3>⚙️ Configuración</h3>
    <div class="config-grid">
      <div class="config-item">
        <label for="focusTime">Foco (min)</label>
        <input type="number" id="focusTime" value="25" min="1" max="90">
      </div>
      <div class="config-item">
        <label for="shortBreakTime">Descanso Corto (min)</label>
        <input type="number" id="shortBreakTime" value="5" min="1" max="30">
      </div>
      <div class="config-item">
        <label for="longBreakTime">Descanso Largo (min)</label>
        <input type="number" id="longBreakTime" value="15" min="1" max="60">
      </div>
      <div class="config-item">
        <label for="cyclesBeforeLong">Ciclos para Descanso Largo</label>
        <input type="number" id="cyclesBeforeLong" value="4" min="2" max="8">
      </div>
    </div>
  </div>

  <!-- Estadísticas -->
  <div class="card stats-section">
    <h3>📊 Estadísticas</h3>
    <div class="stats-grid">
      <div class="tile t-blue">
        <div class="tile-value" id="statPomodoros">0</div>
        <div class="tile-label">Pomodoros Hoy</div>
      </div>
      <div class="tile t-green">
        <div class="tile-value" id="statFocusTime">0m</div>
        <div class="tile-label">Tiempo de Foco</div>
      </div>
      <div class="tile t-amber">
        <div class="tile-value" id="statStreak">0</div>
        <div class="tile-label">Racha (días)</div>
      </div>
    </div>

    <!-- Gráfico semanal -->
    <div class="weekly-chart" id="weeklyChart">
      <!-- Las barras se generan dinámicamente -->
    </div>
  </div>
</div>

<script>
// ============================================
// POMODORO TIMER - Lógica Principal
// ============================================

// Estado global del temporizador
const state = {
  phase: 'focus', // 'focus', 'shortBreak', 'longBreak'
  isRunning: false,
  timeRemaining: 25 * 60, // segundos
  totalTime: 25 * 60,
  completedPomodoros: 0,
  currentCycle: 0,
  lastTick: null,
  intervalId: null,
  focusMode: false
};

// Configuración por defecto
const config = {
  focusTime: 25,
  shortBreakTime: 5,
  longBreakTime: 15,
  cyclesBeforeLong: 4
};

// Elementos del DOM
const elements = {
  timerDisplay: document.getElementById('timerDisplay'),
  phaseIndicator: document.getElementById('phaseIndicator'),
  startBtn: document.getElementById('startBtn'),
  pauseBtn: document.getElementById('pauseBtn'),
  skipBtn: document.getElementById('skipBtn'),
  resetBtn: document.getElementById('resetBtn'),
  todayCount: document.getElementById('todayCount'),
  progressCircle: document.querySelector('.progress-ring__circle'),
  focusModeToggle: document.getElementById('focusModeToggle'),
  mainWindow: document.getElementById('mainWindow'),
  // Inputs de configuración
  focusTime: document.getElementById('focusTime'),
  shortBreakTime: document.getElementById('shortBreakTime'),
  longBreakTime: document.getElementById('longBreakTime'),
  cyclesBeforeLong: document.getElementById('cyclesBeforeLong'),
  // Estadísticas
  statPomodoros: document.getElementById('statPomodoros'),
  statFocusTime: document.getElementById('statFocusTime'),
  statStreak: document.getElementById('statStreak'),
  weeklyChart: document.getElementById('weeklyChart')
};

// Configurar círculo de progreso SVG
const circleRadius = 120;
const circleCircumference = 2 * Math.PI * circleRadius;
elements.progressCircle.style.strokeDasharray = `${circleCircumference} ${circleCircumference}`;
elements.progressCircle.style.strokeDashoffset = 0;

// ============================================
// SISTEMA DE AUDIO (Web Audio API)
// ============================================

let audioContext = null;

function initAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playNotificationSound(type = 'complete') {
  initAudio();

  const oscillator = audioContext.createOscillator();
  const gainNode = audioContext.createGain();

  oscillator.connect(gainNode);
  gainNode.connect(audioContext.destination);

  if (type === 'complete') {
    // Sonido agradable de completado (dos tonos ascendentes)
    oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
    oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.15); // E5
    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.5);
  } else if (type === 'tick') {
    // Tick sutil
    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
    gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 0.05);
  }
}

// ============================================
// SISTEMA DE NOTIFICACIONES
// ============================================

async function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    await Notification.requestPermission();
  }
}

function showNotification(title, body) {
  // Notificación del navegador
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, {
      body: body,
      icon: '🍅',
      badge: '🍅'
    });
  }

  // Toast en la UI
  showToast(body);

  // Sonido
  playNotificationSound('complete');
}

function showToast(message, duration = 3000) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;

  document.body.appendChild(toast);

  // Forzar reflow para activar transición
  requestAnimationFrame(() => {
    toast.classList.add('show');
  });

  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

// ============================================
// GESTIÓN DEL TEMPORIZADOR
// ============================================

function updateDisplay() {
  // Formatear tiempo MM:SS
  const minutes = Math.floor(state.timeRemaining / 60);
  const seconds = state.timeRemaining % 60;
  const timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

  elements.timerDisplay.textContent = timeString;

  // Actualizar título de la pestaña
  const phaseNames = {
    focus: '🎯 Foco',
    shortBreak: '☕ Descanso',
    longBreak: '🌴 Descanso Largo'
  };
  document.title = `${timeString} - ${phaseNames[state.phase]}`;

  // Actualizar indicador de fase con clases de color
  const indicator = elements.phaseIndicator;
  indicator.textContent = phaseNames[state.phase].toUpperCase();
  indicator.className = 'phase-indicator phase-' + state.phase;

  // Actualizar barra de progreso circular
  const progress = state.timeRemaining / state.totalTime;
  const offset = circleCircumference * progress;
  elements.progressCircle.style.strokeDashoffset = circleCircumference - offset;

  // Cambiar color según la fase usando variables del design spec
  const colors = {
    focus: '#1F86C8',      // cBlue2
    shortBreak: '#4CA22B', // cGreen2
    longBreak: '#E08C1E'   // cAmber2
  };
  document.documentElement.style.setProperty('--progress-color', colors[state.phase]);
}

function tick() {
  const now = Date.now();
  const delta = Math.floor((now - state.lastTick) / 1000);

  if (delta >= 1) {
    state.timeRemaining = Math.max(0, state.timeRemaining - delta);
    state.lastTick = now;

    updateDisplay();

    // Verificar si terminó la fase
    if (state.timeRemaining <= 0) {
      completePhase();
    }
  }
}

function startTimer() {
  if (state.isRunning) return;

  initAudio();
  requestNotificationPermission();

  state.isRunning = true;
  state.lastTick = Date.now();

  // Usar setInterval con verificación por delta de tiempo
  // Esto maneja correctamente tabs en segundo plano
  state.intervalId = setInterval(tick, 250); // Verificar cada 250ms para precisión

  // Actualizar botones
  elements.startBtn.style.display = 'none';
  elements.pauseBtn.style.display = 'inline-block';

  showToast('Temporizador iniciado');
}

function pauseTimer() {
  if (!state.isRunning) return;

  state.isRunning = false;
  clearInterval(state.intervalId);
  state.intervalId = null;

  // Actualizar botones
  elements.startBtn.style.display = 'inline-block';
  elements.startBtn.textContent = '▶ Reanudar';
  elements.pauseBtn.style.display = 'none';

  showToast('Temporizador pausado');
}

function resumeTimer() {
  startTimer();
}

function skipPhase() {
  // Detener temporizador si está corriendo
  if (state.isRunning) {
    pauseTimer();
  }

  // Completar la fase actual inmediatamente
  completePhase(true);

  showToast('Fase saltada');
}

function resetTimer() {
  // Detener temporizador
  if (state.isRunning) {
    pauseTimer();
  }

  // Reiniciar estado
  state.phase = 'focus';
  state.currentCycle = 0;
  state.completedPomodoros = 0;

  // Recargar configuración
  loadConfig();
  setTimeForPhase();

  // Resetear display
  updateDisplay();
  elements.startBtn.textContent = '▶ Iniciar';

  showToast('Temporizador reiniciado');
}

function completePhase(skipped = false) {
  // Detener intervalo
  if (state.intervalId) {
    clearInterval(state.intervalId);
    state.intervalId = null;
  }
  state.isRunning = false;

  // Actualizar botones
  elements.startBtn.style.display = 'inline-block';
  elements.startBtn.textContent = '▶ Iniciar';
  elements.pauseBtn.style.display = 'none';

  if (!skipped) {
    // Si es fase de foco completada
    if (state.phase === 'focus') {
      state.completedPomodoros++;
      state.currentCycle++;

      // Guardar estadísticas
      saveStats();
      updateStats();

      showNotification('¡Foco completado!', 'Tiempo de descansar.');
    } else if (state.phase === 'shortBreak') {
      showNotification('Descanso terminado', '¡Hora de enfocarse!');
    } else if (state.phase === 'longBreak') {
      showNotification('Descanso largo terminado', '¡Listo para una nueva sesión!');
    }
  }

  // Determinar siguiente fase
  if (state.phase === 'focus') {
    if (state.currentCycle >= config.cyclesBeforeLong) {
      state.phase = 'longBreak';
      state.currentCycle = 0;
    } else {
      state.phase = 'shortBreak';
    }
  } else {
    state.phase = 'focus';
  }

  // Establecer tiempo para la nueva fase
  setTimeForPhase();
  updateDisplay();
}

function setTimeForPhase() {
  switch (state.phase) {
    case 'focus':
      state.totalTime = config.focusTime * 60;
      break;
    case 'shortBreak':
      state.totalTime = config.shortBreakTime * 60;
      break;
    case 'longBreak':
      state.totalTime = config.longBreakTime * 60;
      break;
  }
  state.timeRemaining = state.totalTime;
}

// ============================================
// PERSISTENCIA CON LOCALSTORAGE
// ============================================

function getTodayKey() {
  return new Date().toISOString().split('T')[0];
}

function loadStats() {
  const today = getTodayKey();
  const stats = JSON.parse(localStorage.getItem('pomodoroStats') || '{}');

  // Obtener o inicializar datos de hoy
  const todayData = stats[today] || { pomodoros: 0, focusMinutes: 0 };

  // Calcular racha
  let streak = 0;
  const checkDate = new Date();

  // Verificar días consecutivos hacia atrás
  while (true) {
    const dateKey = checkDate.toISOString().split('T')[0];
    if (stats[dateKey] && stats[dateKey].pomodoros > 0) {
      streak++;
      checkDate.setDate(checkDate.getDate() - 1);
    } else if (dateKey === today) {
      // Hoy cuenta aunque no haya pomodoros aún
      checkDate.setDate(checkDate.getDate() - 1);
    } else {
      break;
    }
  }

  return { todayData, streak };
}

function saveStats() {
  const today = getTodayKey();
  const stats = JSON.parse(localStorage.getItem('pomodoroStats') || '{}');

  if (!stats[today]) {
    stats[today] = { pomodoros: 0, focusMinutes: 0 };
  }

  stats[today].pomodoros = state.completedPomodoros;
  stats[today].focusMinutes += config.focusTime;

  localStorage.setItem('pomodoroStats', JSON.stringify(stats));
}

function updateStats() {
  const { todayData, streak } = loadStats();

  elements.todayCount.textContent = todayData.pomodoros;
  elements.statPomodoros.textContent = todayData.pomodoros;
  elements.statFocusTime.textContent = formatMinutes(todayData.focusMinutes);
  elements.statStreak.textContent = streak;

  // Generar gráfico semanal
  generateWeeklyChart();
}

function formatMinutes(minutes) {
  if (minutes < 60) {
    return `${minutes}m`;
  }
  const hours = Math.floor(minutes / 60);
  const remainingMinutes = minutes % 60;
  return remainingMinutes > 0 ? `${hours}h ${remainingMinutes}m` : `${hours}h`;
}

function generateWeeklyChart() {
  const stats = JSON.parse(localStorage.getItem('pomodoroStats') || '{}');
  const chartContainer = elements.weeklyChart;
  chartContainer.innerHTML = '';

  // Generar últimos 7 días
  const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  const today = new Date();
  let maxPomodoros = 0;

  const weekData = [];

  for (let i = 6; i >= 0; i--) {
    const date = new Date(today);
    date.setDate(date.getDate() - i);
    const dateKey = date.toISOString().split('T')[0];
    const dayStats = stats[dateKey] || { pomodoros: 0 };
    weekData.push({
      day: days[date.getDay()],
      pomodoros: dayStats.pomodoros,
      isToday: i === 0
    });
    maxPomodoros = Math.max(maxPomodoros, dayStats.pomodoros);
  }

  // Crear barras
  weekData.forEach(data => {
    const container = document.createElement('div');
    container.className = 'chart-bar-container';

    const bar = document.createElement('div');
    bar.className = 'chart-bar';

    // Calcular altura proporcional
    const height = maxPomodoros > 0 ? (data.pomodoros / maxPomodoros) * 100 : 0;
    bar.style.height = `${Math.max(height, 2)}%`;

    // Resaltar día actual
    if (data.isToday) {
      bar.style.opacity = '1';
    } else {
      bar.style.opacity = '0.6';
    }

    const label = document.createElement('div');
    label.className = 'chart-label';
    label.textContent = data.day;

    container.appendChild(bar);
    container.appendChild(label);
    chartContainer.appendChild(container);
  });
}

// ============================================
// CONFIGURACIÓN
// ============================================

function loadConfig() {
  const saved = JSON.parse(localStorage.getItem('pomodoroConfig') || '{}');

  config.focusTime = saved.focusTime || 25;
  config.shortBreakTime = saved.shortBreakTime || 5;
  config.longBreakTime = saved.longBreakTime || 15;
  config.cyclesBeforeLong = saved.cyclesBeforeLong || 4;

  // Actualizar inputs
  elements.focusTime.value = config.focusTime;
  elements.shortBreakTime.value = config.shortBreakTime;
  elements.longBreakTime.value = config.longBreakTime;
  elements.cyclesBeforeLong.value = config.cyclesBeforeLong;
}

function saveConfig() {
  config.focusTime = parseInt(elements.focusTime.value) || 25;
  config.shortBreakTime = parseInt(elements.shortBreakTime.value) || 5;
  config.longBreakTime = parseInt(elements.longBreakTime.value) || 15;
  config.cyclesBeforeLong = parseInt(elements.cyclesBeforeLong.value) || 4;

  localStorage.setItem('pomodoroConfig', JSON.stringify(config));

  // Si el temporizador no está corriendo, actualizar tiempo actual
  if (!state.isRunning) {
    setTimeForPhase();
    updateDisplay();
  }

  showToast('Configuración guardada');
}

// ============================================
// MODO FOCUS
// ============================================

function toggleFocusMode() {
  state.focusMode = elements.focusModeToggle.checked;

  if (state.focusMode) {
    elements.mainWindow.classList.add('focus-mode');
    showToast('Modo Focus activado');
  } else {
    elements.mainWindow.classList.remove('focus-mode');
    showToast('Modo Focus desactivado');
  }
}

// ============================================
// ATAJOS DE TECLADO
// ============================================

function handleKeyboard(e) {
  // Ignorar si el foco está en un input
  if (e.target.tagName === 'INPUT') return;

  switch (e.code) {
    case 'Space':
      e.preventDefault();
      if (state.isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
      break;
    case 'KeyS':
      skipPhase();
      break;
    case 'KeyR':
      resetTimer();
      break;
  }
}

// ============================================
// EVENT LISTENERS
// ============================================

elements.startBtn.addEventListener('click', startTimer);
elements.pauseBtn.addEventListener('click', pauseTimer);
elements.skipBtn.addEventListener('click', skipPhase);
elements.resetBtn.addEventListener('click', resetTimer);

// Configuración
elements.focusTime.addEventListener('change', saveConfig);
elements.shortBreakTime.addEventListener('change', saveConfig);
elements.longBreakTime.addEventListener('change', saveConfig);
elements.cyclesBeforeLong.addEventListener('change', saveConfig);

// Modo Focus
elements.focusModeToggle.addEventListener('change', toggleFocusMode);

// Teclado
document.addEventListener('keydown', handleKeyboard);

// ============================================
// INICIALIZACIÓN
// ============================================

function init() {
  loadConfig();
  setTimeForPhase();
  updateDisplay();
  updateStats();
}

// Iniciar aplicación
init();
</script>
</body>
