<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PomoGlass — Temporizador Aero Glass</title>
<style>
  :root{
    --cDeep:#07405E; --cInk:#0B5C8A; --cBlue2:#1F86C8; --cGreen2:#4CA22B;
    --cAmber2:#E08C1E; --cRed2:#C63C22; --Muted:#2C5F7E;
    --shadow:0 2px 16px rgba(10,58,86,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    color:var(--cDeep);
    background:
      linear-gradient(0deg, rgba(151,220,95,.85) 0%, rgba(103,208,196,.82) 18%, rgba(77,187,236,.82) 40%, rgba(149,217,246,.85) 70%, rgba(227,244,253,.89) 100%),
      linear-gradient(105deg,#E3F4FD 0%, #95D9F6 30%, #4DBBEC 60%, #67D0C4 82%, #97DC5F 100%);
    background-blend-mode:normal;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* TopGloss overlay */
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; height:170px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, rgba(255,255,255,.63) 0%, rgba(255,255,255,.26) 55%, transparent 100%);
  }
  /* Bubbles */
  .bubble{position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle at 35% 30%, #fff 0%, var(--t) 58%, transparent 100%);}
  .b1{width:300px;height:300px; left:-70px; top:38%; opacity:.30; --t:rgba(111,199,240,.9);}
  .b2{width:380px;height:380px; right:-90px; top:-110px; opacity:.26; --t:rgba(182,231,122,.9);}
  .b3{width:180px;height:180px; left:52%; bottom:-60px; opacity:.22; --t:rgba(255,217,122,.9);}

  .window{
    position:relative; z-index:1; max-width:640px; margin:46px auto; padding:0 24px 60px;
  }
  .titlebar{display:flex; align-items:center; gap:12px; height:46px; padding:0 6px;}
  .titlebar .logo{width:26px;height:26px;border-radius:7px;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow);
    display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
  .titlebar h1{font-size:25px; font-weight:300; color:var(--cDeep);}
  .titlebar h1 b{font-weight:600;}
  .titlebar .sub{margin-left:auto; font-size:12.5px; color:var(--Muted);}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.77) 45%, rgba(235,248,255,.69) 100%);
    border:1px solid rgba(255,255,255,.5);
    border-radius:14px; padding:18px; box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
    margin-bottom:18px;
  }
  h2{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--cDeep);}

  /* Tabs as chips */
  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .tab{
    flex:1; min-width:110px; height:36px; border-radius:999px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.42); color:var(--cDeep); font-family:inherit; font-size:13px;
    cursor:pointer; transition:.15s; text-align:center; line-height:34px; padding:0 12px;
    overflow:hidden; position:relative;
  }
  .tab:hover{background:rgba(255,255,255,.67); border-color:rgba(255,255,255,.7);}
  .tab.active{
    color:#fff; border-color:rgba(255,255,255,.55);
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    font-weight:600;
  }
  .tab.active::after{content:""; position:absolute; left:1px; right:1px; top:1px; height:16px;
    border-radius:999px 999px 0 0; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%);}
  .tab.active[data-mode="foco"]{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
  .tab.active[data-mode="corto"]{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
  .tab.active[data-mode="largo"]{background:linear-gradient(180deg,#FFE6A8 0%,#F0A93A 49%,#D5871B 51%,#F7B950 100%);}
  /* Ring color follows active mode chip */
  .window:has(.tab[data-mode="corto"].active) .clock-fg{stroke:#4CA22B;}
  .window:has(.tab[data-mode="largo"].active) .clock-fg{stroke:var(--cAmber2);}

  /* Timer */
  .timer-wrap{display:flex; align-items:center; justify-content:center; gap:24px; flex-wrap:wrap;}
  .clock-svg{transform:rotate(-90deg); width:100%; height:100%; display:block;}
  .clock-bg{fill:none; stroke:rgba(255,255,255,.55); stroke-width:10;}
  .clock-fg{fill:none; stroke:url(#gradProgress); stroke-width:10; stroke-linecap:round;
    transition:stroke-dashoffset .3s linear, stroke .3s;
    filter:drop-shadow(0 1px 4px rgba(10,58,86,.35));}
  .timer-text{position:absolute; inset:0; display:grid; place-items:center;
    transform:rotate(0deg); text-align:center;}
  .timer-text .time{font-size:54px; font-weight:300; color:var(--cDeep); font-variant-numeric:tabular-nums; line-height:1;
    text-shadow:0 1px 0 rgba(255,255,255,.7);}
  .timer-text .label{font-size:13px; color:var(--Muted); margin-top:6px;}
  .timer-box{position:relative; width:min(240px, 70vw); aspect-ratio:1; height:auto;
    border-radius:50%; background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.5) 0%, rgba(255,255,255,.12) 78%);
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.6);}

  /* Inputs */
  .durations{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px;}
  .dur{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--Muted); flex:1; min-width:130px;}
  input[type=number]{
    height:34px; padding:0 10px; border-radius:8px;
    border:1px solid rgba(44,95,126,.30); background:rgba(255,255,255,.70); color:var(--cDeep);
    font-family:inherit; font-size:13px; width:100%;
  }
  input[type=number]:focus{outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;}

  label.check{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--cDeep);
    cursor:pointer; margin-top:12px; user-select:none;}
  label.check input{width:16px; height:16px; accent-color:var(--cBlue2); cursor:pointer;}

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px; justify-content:center;}

  /* Gloss buttons */
  .btn{
    position:relative; height:40px; padding:0 22px; border:none; border-radius:9px;
    font-family:inherit; font-size:13.5px; color:#fff; cursor:pointer; overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    transition:transform .05s, filter .15s;
  }
  .btn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
    background:rgba(255,255,255,.24); transition:.15s;}
  .btn:hover::before{opacity:1;}
  .btn:active{transform:translateY(1px); filter:brightness(.92);}
  .btn:disabled{opacity:.45; cursor:default; transform:none;}
  .btn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
  .btn-blue{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
  .btn-green{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
  .btn-amber{background:linear-gradient(180deg,#FFE6A8 0%,#F0A93A 49%,#D5871B 51%,#F7B950 100%);}
  .btn-red{background:linear-gradient(180deg,#FFB6A6 0%,#DD5C3E 49%,#B63B22 51%,#E0704F 100%);}

  .btn-ghost{
    height:34px; padding:0 16px; border-radius:8px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.4); color:var(--cDeep); font-family:inherit; font-size:13px; cursor:pointer; transition:.15s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.67);}

  /* Stats */
  .stats{display:flex; gap:14px; flex-wrap:wrap;}
  .stat{
    flex:1; min-width:140px; text-align:center; padding:16px 10px 14px; border-radius:12px;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.42) 100%);
    border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.6);
    display:flex; flex-direction:column; justify-content:center; align-items:center;
  }
  .stat .num{font-size:30px; font-weight:600; color:var(--cDeep); font-variant-numeric:tabular-nums; line-height:1.1;}
  .stat .lbl{font-size:12.5px; color:var(--Muted); margin-top:5px;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(255,255,255,.9); backdrop-filter:blur(10px); color:var(--cDeep);
    border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 20px;
    box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:9;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:520px){
    .timer-box{width:min(200px, 78vw);}
    .timer-text .time{font-size:42px;}
    .stat .num{font-size:24px;}
  }
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>

<div class="window">
  <div class="titlebar">
    <div class="logo">◕</div>
    <h1>Pomo<b>Glass</b></h1>
    <span class="sub">Temporizador Pomodoro · Aero Glass</span>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" data-mode="foco">Foco · 25 min</button>
      <button class="tab" data-mode="corto">Descanso corto · 5</button>
      <button class="tab" data-mode="largo">Descanso largo · 15</button>
    </div>

    <div class="timer-wrap">
      <div class="timer-box">
        <svg class="clock-svg" width="240" height="240" viewBox="0 0 240 240">
          <defs>
            <linearGradient id="gradProgress" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#39B0E4"/>
              <stop offset="100%" stop-color="#4CA22B"/>
            </linearGradient>
          </defs>
          <circle class="clock-bg" cx="120" cy="120" r="104"/>
          <circle class="clock-fg" id="clockFg" cx="120" cy="120" r="104"/>
        </svg>
        <div class="timer-text">
          <div>
            <div class="time" id="timeText">25:00</div>
            <div class="label" id="modeLabel">Foco</div>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <button id="btnStart" class="btn btn-green"><span class="shine"></span>Iniciar</button>
      <button id="btnPause" class="btn btn-blue" disabled><span class="shine"></span>Pausar</button>
      <button id="btnReset" class="btn btn-red"><span class="shine"></span>Reiniciar</button>
    </div>
  </div>

  <div class="card">
    <h2>Duraciones y secuencia</h2>
    <div class="durations">
      <div class="dur">Foco (min)<input type="number" id="durFoco" min="1" max="180" value="25"></div>
      <div class="dur">Descanso corto (min)<input type="number" id="durCorto" min="1" max="60" value="5"></div>
      <div class="dur">Descanso largo (min)<input type="number" id="durLargo" min="1" max="90" value="15"></div>
    </div>
    <label class="check"><input type="checkbox" id="autoSeq"> Secuencia automática: tras el foco → descanso corto; cada 4 focos → descanso largo</label>
    <div class="row" style="justify-content:flex-start">
      <button id="btnNotif" class="btn-ghost">🔔 Activar notificaciones</button>
    </div>
  </div>

  <div class="card">
    <h2>Estadísticas</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="statHoy">0</div><div class="lbl">Pomodoros hoy</div></div>
      <div class="stat"><div class="num" id="statRacha">0</div><div class="lbl">Racha (días)</div></div>
      <div class="stat"><div class="num" id="statCiclo">0/4</div><div class="lbl">Ciclo actual</div></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const MODES = {foco:{label:'Foco', input:'durFoco'}, corto:{label:'Descanso corto', input:'durCorto'}, largo:{label:'Descanso largo', input:'durLargo'}};
let mode = 'foco';
let running = false, paused = false;
let remaining = 25*60, totalSecs = 25*60;
let endAt = null, tick = null;
let focusCount = 0; // pomodoros dentro del ciclo (0-3)
const R = 104, CIRC = 2*Math.PI*R;

const BASE_TITLE = 'PomoGlass';
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---- Stats (localStorage) ---- */
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function loadStats(){
  try{ return JSON.parse(localStorage.getItem('pomoglass_stats')||'{}'); }catch(e){ return {}; }
}
function saveStats(s){ localStorage.setItem('pomoglass_stats', JSON.stringify(s)); }
function updateStatUI(){
  const s = loadStats();
  $('statHoy').textContent = s.today === todayKey() ? (s.count||0) : 0;
  $('statRacha').textContent = calcRacha(s);
  $('statCiclo').textContent = (s.today === todayKey() ? (s.cycle||0) : 0) + '/4';
}
function calcRacha(s){
  if(s.today !== todayKey() && (!s.lastDay || s.lastDay !== todayKey())){
    // si el último día con pomodoros no es hoy ni ayer, la racha está rota
    if(s.lastDay){
      const last = new Date(s.lastDay + 'T00:00:00');
      const now = new Date(todayKey() + 'T00:00:00');
      const diff = Math.round((now - last) / 86400000);
      if(diff > 1) return 0;
    }
  }
  return s.streak || 0;
}
function registerPomodoro(){
  const s = loadStats();
  const today = todayKey();
  if(s.today !== today){
    // día nuevo: ¿racha continua?
    if(s.lastDay){
      const last = new Date(s.lastDay + 'T00:00:00');
      const now = new Date(today + 'T00:00:00');
      const diff = Math.round((now - last) / 86400000);
      s.streak = diff === 1 ? (s.streak||0) + 1 : 1;
    } else {
      s.streak = 1;
    }
    s.today = today; s.count = 0; s.cycle = 0;
  }
  if(s.lastDay !== today) s.lastDay = today;
  s.count = (s.count||0) + 1;
  s.cycle = ((s.cycle||0) + 1) % 4;
  focusCount = s.cycle;
  saveStats(s); updateStatUI();
}

/* ---- Reloj ---- */
function durSecs(m){ return Math.max(1, Math.min(180, parseInt($(MODES[m].input).value||'25',10))) * 60; }
function setMode(m, keepStopped){
  mode = m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.mode===m));
  totalSecs = durSecs(m); remaining = totalSecs;
  stopTicking();
  render();
}
function render(){
  const mm = String(Math.floor(remaining/60)).padStart(2,'0');
  const ss = String(remaining%60).padStart(2,'0');
  $('timeText').textContent = mm + ':' + ss;
  $('modeLabel').textContent = MODES[mode].label + (running && !paused ? ' · en marcha' : (paused ? ' · en pausa' : ''));
  const frac = totalSecs ? remaining/totalSecs : 0;
  const fg = $('clockFg');
  fg.style.strokeDasharray = CIRC;
  fg.style.strokeDashoffset = CIRC * (1 - frac);
  document.title = running ? `${mm}:${ss} · ${MODES[mode].label}` : BASE_TITLE;
}
function stopTicking(){
  if(tick){ clearInterval(tick); tick = null; }
  running = false; paused = false; endAt = null;
  $('btnStart').disabled = false; $('btnPause').disabled = true;
}
function startTimer(){
  if(running && !paused) return;
  if(!running){ totalSecs = durSecs(mode); if(remaining > totalSecs) remaining = totalSecs; if(remaining<=0) remaining = totalSecs; }
  running = true; paused = false;
  endAt = Date.now() + remaining*1000;
  $('btnStart').disabled = true; $('btnPause').disabled = false;
  if(!tick) tick = setInterval(loop, 250);
  render();
}
function loop(){
  if(!running || paused) return;
  remaining = Math.max(0, Math.round((endAt - Date.now())/1000));
  render();
  if(remaining <= 0) finish();
}
function pauseTimer(){
  if(!running || paused) return;
  paused = true;
  remaining = Math.max(0, Math.round((endAt - Date.now())/1000));
  $('btnStart').disabled = false; $('btnPause').disabled = true;
  render();
}
function resetTimer(){
  totalSecs = durSecs(mode); remaining = totalSecs;
  stopTicking(); render();
}

/* ---- Fin de fase ---- */
function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .45, .9].forEach((delay,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = [880, 660, 880][i];
      g.gain.setValueAtTime(0.001, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + delay + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.35);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + 0.4);
    });
    setTimeout(()=>ctx.close(), 2000);
  }catch(e){}
}
function notify(title, body){
  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification(title, {body, icon:undefined}); }catch(e){}
  }
}
function finish(){
  const finishedMode = mode;
  beep();
  if(finishedMode === 'foco'){
    registerPomodoro();
    notify('PomoGlass', 'Pomodoro completado. ¡Buen trabajo!');
    toast('Pomodoro completado ✓');
    if($('autoSeq').checked){
      const next = focusCount === 0 ? 'largo' : 'corto'; // focusCount ya avanzó (0 => acaba de cerrar ciclo de 4)
      setMode(next); startTimer();
    } else { stopTicking(); remaining = durSecs(mode); render(); }
  } else {
    notify('PomoGlass', 'Descanso terminado. ¡A por otro pomodoro!');
    toast('Descanso terminado — vuelve al foco ✓');
    if($('autoSeq').checked){ setMode('foco'); startTimer(); }
    else { stopTicking(); remaining = durSecs(mode); render(); }
  }
}

/* ---- Eventos ---- */
$('btnStart').addEventListener('click', startTimer);
$('btnPause').addEventListener('click', pauseTimer);
$('btnReset').addEventListener('click', resetTimer);
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', ()=>setMode(t.dataset.mode)));
['durFoco','durCorto','durLargo'].forEach(id => $(id).addEventListener('change', ()=>{
  if(!running){ totalSecs = durSecs(mode); remaining = totalSecs; render(); }
}));
$('btnNotif').addEventListener('click', ()=>{
  if(!('Notification' in window)){ toast('Este navegador no soporta notificaciones'); return; }
  if(Notification.permission === 'granted'){ toast('Las notificaciones ya están activadas'); return; }
  Notification.requestPermission().then(p=>{
    toast(p === 'granted' ? 'Notificaciones activadas ✓' : 'Permiso de notificaciones denegado');
  });
});

/* Cambiar pestaña: pausa visual (el intervalo sigue, Date.now manda) */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && running && !paused) render();
});

setMode('foco');
updateStatUI();
</script>
</body>
</html>
