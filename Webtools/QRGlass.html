<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRGlass — Generador de códigos QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root{
    --cDeep:#07405E; --cInk:#0B5C8A; --cBlue2:#1F86C8; --cGreen2:#4CA22B;
    --cAmber2:#E08C1E; --cRed2:#C63C22; --Muted:#2C5F7E;
    --shadow:0 2px 16px rgba(10,58,86,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    color:var(--cDeep);
    background:
      linear-gradient(0deg, rgba(151,220,95,.85) 0%, rgba(103,208,196,.82) 18%, rgba(77,187,236,.82) 40%, rgba(149,217,246,.85) 70%, rgba(227,244,253,.89) 100%),
      linear-gradient(105deg,#E3F4FD 0%, #95D9F6 30%, #4DBBEC 60%, #67D0C4 82%, #97DC5F 100%);
    background-blend-mode:normal;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* TopGloss overlay */
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; height:170px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, rgba(255,255,255,.63) 0%, rgba(255,255,255,.26) 55%, transparent 100%);
  }
  /* Bubbles */
  .bubble{position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle at 35% 30%, #fff 0%, var(--t) 58%, transparent 100%);}
  .b1{width:300px;height:300px; left:-70px; top:38%; opacity:.30; --t:rgba(111,199,240,.9);}
  .b2{width:380px;height:380px; right:-90px; top:-110px; opacity:.26; --t:rgba(182,231,122,.9);}
  .b3{width:180px;height:180px; left:52%; bottom:-60px; opacity:.22; --t:rgba(255,217,122,.9);}

  .window{
    position:relative; z-index:1; max-width:980px; margin:46px auto; padding:0 24px 60px;
  }
  .titlebar{display:flex; align-items:center; gap:12px; height:46px; padding:0 6px;}
  .titlebar .logo{width:26px;height:26px;border-radius:7px;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow);
    display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
  .titlebar h1{font-size:25px; font-weight:300; color:var(--cDeep);}
  .titlebar h1 b{font-weight:600;}
  .titlebar .sub{margin-left:auto; font-size:12.5px; color:var(--Muted);}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.77) 45%, rgba(235,248,255,.69) 100%);
    border:1px solid rgba(255,255,255,.5);
    border-radius:14px; padding:18px; box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
    margin-bottom:18px;
  }
  h2{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--cDeep);}

  /* Tabs de tipo QR — opacidades del spec: inactive #3DFFFFFF, hover #6BFFFFFF, activo #B8FFFFFF */
  .tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .tab{
    position:relative; height:36px; padding:0 18px; border-radius:9px; overflow:hidden;
    border:1px solid rgba(255,255,255,.50); background:rgba(255,255,255,.24);
    color:var(--cDeep); font-family:inherit; font-size:13px; cursor:pointer;
    box-shadow:0 1px 6px rgba(10,58,86,.14); transition:background .15s, border-color .15s;
  }
  .tab:hover{background:rgba(255,255,255,.42);}
  .tab.active{
    background:rgba(255,255,255,.72); border-color:rgba(255,255,255,.55);
    font-weight:600;
  }
  .tab.active::before{content:""; position:absolute; left:1px; right:1px; top:1px; height:15px;
    border-radius:8px 8px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%);
    pointer-events:none;}

  label{font-size:13px; font-weight:600; color:var(--cDeep); display:block; margin:10px 0 4px;}
  input[type="text"], input[type="password"], textarea, select{
    width:100%; padding:10px 12px;
    border-radius:8px; border:1px solid rgba(44,95,126,.30);
    background:rgba(255,255,255,.70); color:var(--cDeep);
    font-family:Consolas,monospace; font-size:13px;
  }
  select{height:38px; padding:0 10px; font-family:inherit; font-size:13px; cursor:pointer;}
  textarea{min-height:140px; resize:vertical; line-height:1.5;}
  input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus{
    outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;
  }

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px;}
  .field{flex:1; min-width:160px;}

  input[type="range"]{width:100%; accent-color:var(--cBlue2);}
  input[type="color"]{
    width:46px; height:32px; padding:2px; border-radius:8px;
    border:1px solid rgba(44,95,126,.30); background:rgba(255,255,255,.70); cursor:pointer;
    box-shadow:inset 0 1px 3px rgba(10,58,86,.12);
  }
  input[type="color"]::-webkit-color-swatch-wrapper{padding:0;}
  input[type="color"]::-webkit-color-swatch{border:none; border-radius:5px;}
  input[type="color"]::-moz-color-swatch{border:none; border-radius:5px;}
  .colorrow{display:flex; align-items:center; gap:8px; font-size:13px;}
  .colorrow span{color:var(--Muted); font-weight:400;}

  /* Gloss buttons */
  .btn{
    position:relative; height:40px; padding:0 22px; border:none; border-radius:9px;
    font-family:inherit; font-size:13.5px; color:#fff; cursor:pointer; overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    transition:transform .05s, filter .15s;
  }
  .btn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
    background:rgba(255,255,255,.24); transition:.15s;}
  .btn:hover::before{opacity:1;}
  .btn:active{transform:translateY(1px); filter:brightness(.92);}
  .btn:disabled{opacity:.45; cursor:default; transform:none;}
  .btn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
  .btn-blue{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
  .btn-green{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
  .btn-amber{background:linear-gradient(180deg,#FFE6A8 0%,#F0A93A 49%,#D5871B 51%,#F7B950 100%);}
  .btn-red{background:linear-gradient(180deg,#FFB6A6 0%,#DD5C3E 49%,#B63B22 51%,#E0704F 100%);}

  .btn-ghost{
    height:34px; padding:0 16px; border-radius:8px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.4); color:var(--cDeep); font-family:inherit; font-size:13px; cursor:pointer; transition:.15s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.67);}

  .status{font-size:12.5px; color:var(--Muted); margin-top:8px; min-height:16px;}

  /* QR preview */
  #qrBox{
    display:flex; align-items:center; justify-content:center;
    min-height:300px; padding:22px; margin-top:14px;
    border-radius:12px; background:rgba(255,255,255,.45);
    border:1px solid rgba(255,255,255,.65);
    box-shadow:inset 0 1px 6px rgba(10,58,86,.10);
  }
  #qrBox svg{max-width:100%; height:auto; border-radius:10px; background:#fff; padding:10px;
    border:1px solid rgba(44,95,126,.18); box-shadow:0 2px 12px rgba(10,58,86,.18);}
  #qrPlaceholder{font-size:13.5px; color:var(--Muted); text-align:center;}

  @media (max-width:640px){
    .window{margin:20px auto; padding:0 12px 40px;}
    .titlebar{flex-wrap:wrap; height:auto;}
    .titlebar .sub{margin-left:0; width:100%;}
    .tab{flex:1; padding:0 10px;}
    .row .btn, .row .btn-ghost{flex:1; min-width:140px;}
  }

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(255,255,255,.9); backdrop-filter:blur(10px); color:var(--cDeep);
    border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 20px;
    box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:9;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* === ESTILOS ESPECÍFICOS QRGlass === */

  /* Historial de QRs — grid de thumbnails con borde glass y hover glow */
  .history-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(80px, 1fr));
    gap:12px; margin-top:12px;
  }
  .history-item{
    aspect-ratio:1; border-radius:10px; overflow:hidden; cursor:pointer;
    position:relative;
    border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.70);
    box-shadow:0 1px 6px rgba(10,58,86,.14);
    transition:border-color .2s, box-shadow .2s;
  }
  .history-item:hover{
    border-color:rgba(31,134,200,.5);
    box-shadow:0 2px 12px rgba(31,134,200,.30);
  }
  .history-item img{width:100%; height:100%; object-fit:contain; background:#fff;}
  .history-empty{text-align:center; color:var(--Muted); font-size:12.5px; padding:20px;}

  /* Responsive adicional para historial en móvil */
  @media (max-width:640px){
    .history-grid{grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)); gap:8px;}
  }
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>

<div class="window">
  <div class="titlebar">
    <div class="logo">▣</div>
    <h1>QR<b>Glass</b></h1>
    <span class="sub">Generador de códigos QR · Aero Glass</span>
  </div>

  <div class="card">
    <h2>1 · Contenido</h2>
    <div class="tabs">
      <button class="tab active" data-tab="text">Texto / URL</button>
      <button class="tab" data-tab="wifi">WiFi</button>
    </div>

    <div id="paneText">
      <label for="txtInput">Texto o URL</label>
      <textarea id="txtInput" placeholder="Escribe un texto o una URL, ej. https://ejemplo.com" spellcheck="false"></textarea>
    </div>

    <div id="paneWifi" style="display:none">
      <label for="wifiSsid">SSID (nombre de la red)</label>
      <input type="text" id="wifiSsid" placeholder="MiRed">
      <label for="wifiPass">Contraseña</label>
      <input type="text" id="wifiPass" placeholder="••••••••">
      <label for="wifiEnc">Cifrado</label>
      <select id="wifiEnc">
        <option value="WPA" selected>WPA / WPA2 / WPA3</option>
        <option value="WEP">WEP</option>
        <option value="nopass">Sin contraseña</option>
      </select>
    </div>
  </div>

  <div class="card">
    <h2>2 · Opciones</h2>
    <div class="row">
      <div class="field">
        <label for="ecl">Corrección de errores</label>
        <select id="ecl">
          <option value="L">L — Baja (7%)</option>
          <option value="M" selected>M — Media (15%)</option>
          <option value="Q">Q — Alta (25%)</option>
          <option value="H">H — Máxima (30%)</option>
        </select>
      </div>
      <div class="field">
        <label for="size">Tamaño: <span id="sizeVal">300</span> px</label>
        <input type="range" id="size" min="128" max="800" step="4" value="300">
      </div>
      <div class="field">
        <label>Colores</label>
        <div class="colorrow">
          <input type="color" id="colDark" value="#07405E" title="Color oscuro (módulos)">
          <span>oscuro</span>
          <input type="color" id="colLight" value="#FFFFFF" title="Color claro (fondo)">
          <span>claro</span>
        </div>
      </div>
    </div>
    <div class="row">
      <button id="btnGen" class="btn btn-blue"><span class="shine"></span>Generar QR</button>
      <button id="btnReset" class="btn-ghost">Restablecer opciones</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h2>3 · Vista previa y descarga</h2>
    <div id="qrBox"><div id="qrPlaceholder">El código QR aparecerá aquí…</div></div>
    <div class="row">
      <button id="btnPng" class="btn btn-green" disabled><span class="shine"></span>Descargar PNG</button>
      <button id="btnSvg" class="btn btn-blue" disabled><span class="shine"></span>Descargar SVG</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const status = $('status');
let lastQR = null; // instancia qrcode ya "make"

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

/* Tabs */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    $('paneText').style.display = tab.dataset.tab === 'text' ? '' : 'none';
    $('paneWifi').style.display = tab.dataset.tab === 'wifi' ? '' : 'none';
  });
});

/* Escapado para la cadena WiFi según la especificación */
function escWifi(s){
  return s.replace(/([\\;,:"])/g, '\\$1');
}

function currentContent(){
  const mode = document.querySelector('.tab.active').dataset.tab;
  if(mode === 'wifi'){
    const ssid = $('wifiSsid').value.trim();
    const pass = $('wifiPass').value;
    const enc  = $('wifiEnc').value;
    if(!ssid){ toast('Escribe el SSID de la red'); return null; }
    if(enc !== 'nopass' && !pass){ toast('Escribe la contraseña de la red'); return null; }
    return `WIFI:T:${enc};S:${escWifi(ssid)};P:${escWifi(pass)};;`;
  }
  const txt = $('txtInput').value.trim();
  if(!txt){ toast('Escribe un texto o una URL'); return null; }
  return txt;
}

function buildQR(data){
  const ecl = $('ecl').value;
  // typeNumber 0 = auto
  const qr = qrcode(0, ecl);
  qr.addData(data);
  qr.make();
  return qr;
}

function render(qr, size){
  const dark = $('colDark').value;
  const light = $('colLight').value;
  // createSvgTag con colores y margen
  const svg = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true, alt: 'Código QR' });
  const box = $('qrBox');
  box.innerHTML = svg;
  const el = box.querySelector('svg');
  el.removeAttribute('width');
  el.removeAttribute('height');
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  // Reemplazar colores (negro por oscuro, blanco por claro)
  let svgStr = el.outerHTML;
  svgStr = svgStr.replace(/fill="black"/g, `fill="${dark}"`)
                 .replace(/fill="white"/g, `fill="${light}"`);
  box.innerHTML = svgStr;
  return box.querySelector('svg');
}

function updateStatus(data, qr){
  const n = qr.getModuleCount();
  status.textContent = `${data.length} caracteres · ${n}×${n} módulos · corrección ${$('ecl').value} · todo se genera localmente`;
}

function generate(){
  const data = currentContent();
  if(data === null) return;
  try{
    lastQR = buildQR(data);
    render(lastQR, +$('size').value);
    updateStatus(data, lastQR);
    $('btnPng').disabled = $('btnSvg').disabled = false;
    toast('QR generado ✓');
  }catch(err){
    status.textContent = 'Error: ' + err.message;
    toast('No se pudo generar el QR (contenido demasiado largo)');
  }
}

$('btnGen').addEventListener('click', generate);
$('txtInput').addEventListener('keydown', e => { if(e.key === 'Enter' && e.ctrlKey) generate(); });
$('size').addEventListener('input', () => {
  $('sizeVal').textContent = $('size').value;
  if(lastQR) render(lastQR, +$('size').value);
});
['ecl','colDark','colLight'].forEach(id => $(id).addEventListener('input', () => {
  if(lastQR){ // cambiar ECL requiere regenerar
    const data = currentContent();
    if(data === null) return;
    try{
      lastQR = buildQR(data);
      render(lastQR, +$('size').value);
      updateStatus(data, lastQR);
    }catch(e){}
  }
}));

$('btnReset').addEventListener('click', () => {
  $('ecl').value = 'M'; $('size').value = 300; $('sizeVal').textContent = 300;
  $('colDark').value = '#07405E'; $('colLight').value = '#FFFFFF';
  if(lastQR) render(lastQR, 300);
  toast('Opciones restablecidas');
});

/* Descargas */
function download(href, name){
  const a = document.createElement('a');
  a.href = href; a.download = name; a.click();
}

$('btnSvg').addEventListener('click', () => {
  if(!lastQR) return;
  const svgEl = $('qrBox').querySelector('svg');
  const svgStr = '<?xml version="1.0" encoding="UTF-8"?>\n' + svgEl.outerHTML;
  download(URL.createObjectURL(new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'})), 'qrglass.svg');
  toast('SVG descargado ✓');
});

$('btnPng').addEventListener('click', () => {
  if(!lastQR) return;
  const size = +$('size').value;
  const n = lastQR.getModuleCount();
  const margin = Math.max(2, Math.round(n * 0.08));
  const dark = $('colDark').value, light = $('colLight').value;
  const total = n + margin * 2;
  const cell = Math.max(1, Math.floor(size / total));
  const px = cell * total;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = px;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = light; ctx.fillRect(0, 0, px, px);
  ctx.fillStyle = dark;
  for(let r = 0; r < n; r++){
    for(let c = 0; c < n; c++){
      if(lastQR.isDark(r, c)){
        ctx.fillRect((c + margin) * cell, (r + margin) * cell, cell, cell);
      }
    }
  }
  canvas.toBlob(blob => {
    download(URL.createObjectURL(blob), 'qrglass.png');
    toast('PNG descargado ✓');
  }, 'image/png');
});
</script>
</body>
</html>
