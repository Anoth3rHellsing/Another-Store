<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetroGlass — Metrónomo y Ruido · Aero Glass</title>
<style>
/* === VARIABLES CSS — Design Spec Tokens === */
:root{
 --cDeep:#07405E; --cInk:#0B5C8A; --cBlue2:#1F86C8; --cGreen2:#4CA22B;
 --cAmber2:#E08C1E; --cRed2:#C63C22; --Muted:#2C5F7E;
 --shadow:0 2px 16px rgba(10,58,86,.28);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}

/* === FONDO SKYBRUSH + OVERLAY === */
body{
 font-family:"Segoe UI",system-ui,sans-serif;
 color:var(--cDeep);
 background:
 linear-gradient(0deg, rgba(151,220,95,.85) 0%, rgba(103,208,196,.82) 18%, rgba(77,187,236,.82) 40%, rgba(149,217,246,.85) 70%, rgba(227,244,253,.89) 100%),
 linear-gradient(105deg,#E3F4FD 0%, #95D9F6 30%, #4DBBEC 60%, #67D0C4 82%, #97DC5F 100%);
 background-blend-mode:normal;
 min-height:100vh;
 overflow-x:hidden;
}

/* === TOPGLOSS OVERLAY (170px) === */
body::before{
 content:""; position:fixed; top:0; left:0; right:0; height:170px; pointer-events:none; z-index:0;
 background:linear-gradient(180deg, rgba(255,255,255,.63) 0%, rgba(255,255,255,.26) 55%, transparent 100%);
}

/* === BURBUJAS DECORATIVAS === */
.bubble{position:fixed; border-radius:50%; pointer-events:none; z-index:0;
 background:radial-gradient(circle at 35% 30%, #fff 0%, var(--t) 58%, transparent 100%);}
.b1{width:300px;height:300px; left:-70px; top:38%; opacity:.30; --t:rgba(111,199,240,.9);}
.b2{width:380px;height:380px; right:-90px; top:-110px; opacity:.26; --t:rgba(182,231,122,.9);}
.b3{width:180px;height:180px; left:52%; bottom:-60px; opacity:.22; --t:rgba(255,217,122,.9);}

/* === WINDOW CONTAINER === */
.window{
 position:relative; z-index:1; max-width:980px; margin:46px auto; padding:0 24px 60px;
}

/* === TITLEBAR === */
.titlebar{display:flex; align-items:center; gap:12px; height:46px; padding:0 6px;}
.titlebar .logo{width:26px;height:26px;border-radius:7px;
 background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
 border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow);
 display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
.titlebar h1{font-size:25px; font-weight:300; color:var(--cDeep);}
.titlebar h1 b{font-weight:600;}
.titlebar .sub{margin-left:auto; font-size:12.5px; color:var(--Muted);}

/* === CARD === */
.card{
 background:linear-gradient(180deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.77) 45%, rgba(235,248,255,.69) 100%);
 border:1px solid rgba(255,255,255,.5);
 border-radius:14px; padding:18px; box-shadow:var(--shadow);
 backdrop-filter:blur(12px);
 margin-bottom:18px;
}
h2{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--cDeep);}

/* === TABS — PILLS GLASS === */
.tabs{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
.tab{
 position:relative; overflow:hidden; flex:0 0 auto; height:42px; padding:0 26px;
 border:1px solid rgba(255,255,255,.55); border-radius:21px;
 font-family:inherit; font-size:13.5px; color:var(--cDeep); cursor:pointer;
 background:linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.38));
 box-shadow:0 1px 6px rgba(10,58,86,.14), inset 0 1px 0 rgba(255,255,255,.6);
 transition:.15s;
}
.tab::after{content:""; position:absolute; left:1px; right:1px; top:1px; height:17px;
 border-radius:20px 20px 0 0; pointer-events:none;
 background:linear-gradient(180deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.2) 48%, transparent 50%);}
.tab:hover{background:linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.5));}
.tab.active{
 background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
 color:#fff; box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
}
.tab.active::after{background:linear-gradient(180deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.28) 48%, transparent 50%);}
.panel{display:none;}
.panel.active{display:block;}

/* === TILES GRID === */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:14px;}
.tile{
 background:linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.55) 48%, rgba(235,248,255,.45) 52%, rgba(255,255,255,.65) 100%);
 border:1px solid rgba(255,255,255,.6);
 border-radius:12px; padding:14px 12px 12px; text-align:center;
 box-shadow:var(--shadow); backdrop-filter:blur(10px);
 position:relative; overflow:hidden;
 display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
 min-height:96px;
}
.tile::before{content:""; position:absolute; left:0; right:0; top:0; height:14px;
 background:linear-gradient(180deg, rgba(255,255,255,.7), transparent); pointer-events:none;}
.tile::after{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; pointer-events:none;
 background:linear-gradient(180deg, var(--accent,#1F86C8), rgba(255,255,255,.25)); opacity:.85;}
.tile .val{font-size:24px; font-weight:600; color:var(--cInk); line-height:1.15; font-variant-numeric:tabular-nums;}
.tile .lbl{font-size:11.5px; color:var(--Muted); text-transform:uppercase; letter-spacing:.4px; line-height:1.35;}
.tile.t-blue{--accent:var(--cBlue2);} .tile.t-blue .val{color:var(--cBlue2);}
.tile.t-green{--accent:var(--cGreen2);} .tile.t-green .val{color:var(--cGreen2);}
.tile.t-amber{--accent:var(--cAmber2);} .tile.t-amber .val{color:var(--cAmber2);}
.tile.t-red{--accent:var(--cRed2);} .tile.t-red .val{color:var(--cRed2);}
.tile .ico{
 width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
 font-size:14px; line-height:1;
 background:linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,.5) 49%, rgba(226,241,252,.45) 51%, rgba(255,255,255,.7) 100%);
 border:1px solid rgba(255,255,255,.65);
 box-shadow:0 1px 6px rgba(10,58,86,.18), inset 0 0 0 1px rgba(255,255,255,.35);
 position:relative; overflow:hidden;
}
.tile .ico::after{content:""; position:absolute; left:1px; right:1px; top:1px; height:9px; border-radius:7px 7px 0 0;
 background:linear-gradient(180deg, rgba(255,255,255,.75), transparent); pointer-events:none;}
.tile.t-blue .ico{color:var(--cBlue2);} .tile.t-green .ico{color:var(--cGreen2);}
.tile.t-amber .ico{color:var(--cAmber2);} .tile.t-red .ico{color:var(--cRed2);}

/* === BPM DISPLAY GRANDE === */
.beat-area{display:flex; flex-direction:column; align-items:center; gap:6px; padding:18px 0 8px;}
.bpm-big{
 font-size:72px; font-weight:600; line-height:1; color:var(--cDeep); letter-spacing:-1px;
 text-shadow:0 1px 0 rgba(255,255,255,.7), 0 4px 14px rgba(10,58,86,.18);
 font-variant-numeric:tabular-nums;
}
.bpm-big small{font-size:16px; font-weight:400; color:var(--Muted); margin-left:6px; letter-spacing:2px;}

/* === BEAT DOTS === */
.beat-dots{display:flex; gap:16px; justify-content:center; margin-top:18px; align-items:center;}
.beat-dot{
 width:28px; height:28px; border-radius:50%;
 background:linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.4));
 border:1px solid rgba(44,95,126,.35);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 1px 4px rgba(10,58,86,.14);
 transition:transform .08s, background .08s, box-shadow .08s;
}
.beat-dot.accent{
 width:34px; height:34px; border:1px solid rgba(31,134,200,.5);
}
.beat-dot.pulse{
 transform:scale(1.45);
 background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);
 box-shadow:0 0 18px rgba(116,194,60,.75), var(--shadow), inset 0 2px 2px rgba(255,255,255,.6);
}
.beat-dot.accent.pulse{
 background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
 box-shadow:0 0 22px rgba(57,165,220,.8), var(--shadow), inset 0 2px 2px rgba(255,255,255,.6);
}

/* === ROW LAYOUT === */
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px;}

/* === SELECT GLASS === */
select{
 height:34px; padding:0 10px; border-radius:8px;
 border:1px solid rgba(44,95,126,.30); background:rgba(255,255,255,.70); color:var(--cDeep);
 font-family:inherit; font-size:13px; cursor:pointer; transition:.15s;
}
select:hover{background:rgba(255,255,255,.85);}
select:focus-visible{outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;}

/* === INPUT NUMBER GLASS === */
input[type="number"]{
 height:34px; width:84px; padding:0 10px; border-radius:8px;
 border:1px solid rgba(44,95,126,.30); background:rgba(255,255,255,.70); color:var(--cDeep);
 font-family:inherit; font-size:14px;
}
input[type="number"]:focus-visible{outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;}

/* === RANGE SLIDER CUSTOM GLASS === */
.slider{
 -webkit-appearance:none; appearance:none; flex:1; min-width:200px; height:10px;
 border-radius:6px; border:1px solid rgba(255,255,255,.5); outline:none;
 background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.3));
 box-shadow:inset 0 1px 4px rgba(10,58,86,.18); cursor:pointer;
}
.slider:focus-visible{outline:2px solid rgba(31,134,200,.45); outline-offset:2px;}
.slider::-webkit-slider-thumb{
 -webkit-appearance:none; width:22px; height:22px; border-radius:50%;
 background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
 border:1px solid rgba(255,255,255,.65); box-shadow:var(--shadow), inset 0 2px 2px rgba(255,255,255,.55); cursor:pointer;
 transition:transform .1s;
}
.slider::-webkit-slider-thumb:hover{transform:scale(1.12);}
.slider::-moz-range-track{
 height:10px; border-radius:6px; border:1px solid rgba(255,255,255,.5);
 background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.3));
 box-shadow:inset 0 1px 4px rgba(10,58,86,.18);
}
.slider::-moz-range-thumb{
 width:22px; height:22px; border-radius:50%;
 background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
 border:1px solid rgba(255,255,255,.65); box-shadow:var(--shadow), inset 0 2px 2px rgba(255,255,255,.55); cursor:pointer;
}

/* === BOTONES GLOSSY === */
.btn{
 position:relative; height:40px; padding:0 22px; border:none; border-radius:9px;
 font-family:inherit; font-size:13.5px; color:#fff; cursor:pointer; overflow:hidden;
 box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
 transition:transform .05s, filter .15s;
}
.btn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
 background:rgba(255,255,255,.24); transition:.15s;}
.btn:hover::before{opacity:1;}
.btn:active{transform:translateY(1px); filter:brightness(.92);}
.btn:disabled{opacity:.45; cursor:default; transform:none;}
.btn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
 background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
.btn-blue{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
.btn-green{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
.btn-amber{background:linear-gradient(180deg,#FFE6A8 0%,#F0A93A 49%,#D5871B 51%,#F7B950 100%);}
.btn-red{background:linear-gradient(180deg,#FFB6A6 0%,#DD5C3E 49%,#B63B22 51%,#E0704F 100%);}

/* === STATUS TEXT === */
.status{font-size:12.5px; color:var(--Muted); margin-top:10px; min-height:16px;}

/* === TOAST === */
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
 background:rgba(255,255,255,.9); backdrop-filter:blur(10px); color:var(--cDeep);
 border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 20px;
 box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:9;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* === RESPONSIVE === */
@media (max-width:640px){
 .window{margin:24px auto; padding:0 12px 40px;}
 .titlebar h1{font-size:21px;}
 .titlebar .sub{display:none;}
 .tab{height:38px; padding:0 18px; font-size:12.5px;}
 .bpm-big{font-size:56px;}
 .beat-dot{width:22px; height:22px;} .beat-dot.accent{width:27px; height:27px;}
 .beat-dots{gap:10px;}
 .btn{height:38px; padding:0 16px;}
 .slider{min-width:140px;}
}

</style>
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>

<div class="window">
  <div class="titlebar">
    <div class="logo">â™ª</div>
    <h1>Metro<b>Glass</b></h1>
    <span class="sub">MetrÃ³nomo y ruido blanco Â· Web Audio Â· Aero Glass</span>
  </div>

  <div class="tabs">
    <button class="tab active" data-panel="p-metro">MetrÃ³nomo</button>
    <button class="tab" data-panel="p-noise">Ruido</button>
  </div>

  <!-- ============ PestaÃ±a MetrÃ³nomo ============ -->
  <div id="p-metro" class="panel active">
    <div class="card">
      <h2>Tempo</h2>
      <div class="beat-area">
        <div class="bpm-big"><span id="bpmValue">120</span> <small>BPM</small></div>
        <div class="beat-dots" id="beatDots"></div>
      </div>
      <div class="row">
        <input type="range" id="bpmSlider" class="slider" min="20" max="300" value="120" step="1">
        <input type="number" id="bpmInput" min="20" max="300" value="120">
      </div>
      <div class="row">
        <select id="compas" title="CompÃ¡s">
          <option value="2/4">2/4</option>
          <option value="3/4">3/4</option>
          <option value="4/4" selected>4/4</option>
          <option value="6/8">6/8</option>
        </select>
        <button id="btnMetro" class="btn btn-green"><span class="shine"></span>Iniciar</button>
        <button id="btnMetroStop" class="btn btn-red" disabled><span class="shine"></span>Detener</button>
      </div>
      <div class="status" id="metroStatus"></div>
    </div>
  </div>

  <!-- ============ PestaÃ±a Ruido ============ -->
  <div id="p-noise" class="panel">
    <div class="card">
      <h2>Generador de ruido</h2>
      <div class="row">
        <select id="noiseType" title="Tipo de ruido">
          <option value="white" selected>Blanco</option>
          <option value="pink">Rosa</option>
          <option value="brown">MarrÃ³n</option>
        </select>
        <button id="btnNoise" class="btn btn-blue"><span class="shine"></span>Iniciar</button>
        <button id="btnNoiseStop" class="btn btn-red" disabled><span class="shine"></span>Detener</button>
      </div>
      <div class="row" style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:13px; color:var(--Muted); white-space:nowrap;">Volumen</span>
        <input type="range" id="volSlider" class="slider" min="0" max="100" value="50">
        <span id="volValue" style="font-size:13px; width:44px; color:var(--cDeep);">50%</span>
      </div>
      <div class="status" id="noiseStatus">El ruido se genera localmente con Web Audio API.</div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
let audioCtx = null;

function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- PestaÃ±as ---------- */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    $(tab.dataset.panel).classList.add('active');
  });
});

/* ================= METRÃ“NOMO ================= */
let metroTimer = null;       // setTimeout handle
let nextBeatTime = 0;        // programaciÃ³n precisa
let beatIndex = 0;
let metroRunning = false;

const bpmSlider = $('bpmSlider'), bpmInput = $('bpmInput'), bpmValue = $('bpmValue');

function setBpm(v){
  v = Math.max(20, Math.min(300, Math.round(v) || 120));
  bpmSlider.value = v; bpmInput.value = v; bpmValue.textContent = v;
}
bpmSlider.addEventListener('input', () => setBpm(+bpmSlider.value));
bpmInput.addEventListener('change', () => setBpm(+bpmInput.value));

function buildDots(){
  const beats = parseInt($('compas').value, 10);
  const wrap = $('beatDots');
  wrap.innerHTML = '';
  for(let i=0; i<beats; i++){
    const d = document.createElement('div');
    d.className = 'beat-dot' + (i===0 ? ' accent' : '');
    wrap.appendChild(d);
  }
}
$('compas').addEventListener('change', () => {
  buildDots();
  beatIndex = 0;
  if(metroRunning){ stopMetro(); startMetro(); }
});

function clickAt(time, isAccent){
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.value = isAccent ? 1400 : 900;
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(isAccent ? 0.9 : 0.55, time + 0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.055);
  osc.connect(gain).connect(ctx.destination);
  osc.start(time); osc.stop(time + 0.08);
}

function flashDot(idx){
  const dots = $('beatDots').children;
  if(!dots.length) return;
  const dot = dots[idx];
  dot.classList.add('pulse');
  setTimeout(() => dot.classList.remove('pulse'), 110);
}

function scheduleBeats(){
  // Programa por bloques y actualiza el visual con setTimeout sincronizado
  if(!metroRunning) return;
  const ctx = getCtx();
  const beats = parseInt($('compas').value, 10);
  const interval = 60 / +bpmValue.textContent;

  while(nextBeatTime < ctx.currentTime + 0.12){
    const isAccent = (beatIndex % beats) === 0;
    const t = nextBeatTime;
    const dotIdx = beatIndex % beats;
    clickAt(t, isAccent);
    setTimeout(() => { if(metroRunning) flashDot(dotIdx); }, Math.max(0, (t - ctx.currentTime) * 1000));
    beatIndex++;
    nextBeatTime += interval;
  }
  metroTimer = setTimeout(scheduleBeats, 40);
}

function startMetro(){
  getCtx();
  metroRunning = true;
  beatIndex = 0;
  nextBeatTime = getCtx().currentTime + 0.1;
  scheduleBeats();
  $('btnMetro').disabled = true; $('btnMetroStop').disabled = false;
  $('metroStatus').textContent = `MetrÃ³nomo en marcha â€” ${bpmValue.textContent} BPM en ${$('compas').value}`;
  toast('MetrÃ³nomo iniciado âœ“');
}

function stopMetro(){
  metroRunning = false;
  clearTimeout(metroTimer); metroTimer = null;
  $('btnMetro').disabled = false; $('btnMetroStop').disabled = true;
  $('metroStatus').textContent = 'MetrÃ³nomo detenido.';
}
$('btnMetro').addEventListener('click', startMetro);
$('btnMetroStop').addEventListener('click', () => { stopMetro(); toast('MetrÃ³nomo detenido'); });

buildDots();

/* ================= RUIDO ================= */
let noiseSource = null;
let noiseGain = null;
let noiseFilter = null;
const volSlider = $('volSlider'), volValue = $('volValue');
volSlider.addEventListener('input', () => {
  volValue.textContent = volSlider.value + '%';
  if(noiseGain){
    // Curva: x^2 para mayor control en volÃºmenes bajos
    const v = Math.pow(volSlider.value / 100, 2);
    noiseGain.gain.setTargetAtTime(v, getCtx().currentTime, 0.02);
  }
});

function makeNoiseBuffer(ctx, type){
  const len = ctx.sampleRate * 2;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  if(type === 'white'){
    for(let i=0; i<len; i++) d[i] = Math.random() * 2 - 1;
  } else if(type === 'pink'){
    // AproximaciÃ³n Paul Kellet
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0; i<len; i++){
      const w = Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
    }
  } else { // brown
    let last = 0;
    for(let i=0; i<len; i++){
      const w = Math.random()*2-1;
      last = (last + 0.02*w) / 1.02;
      d[i] = last * 3.5;
    }
  }
  return buf;
}

function startNoise(){
  const ctx = getCtx();
  stopNoiseNodes();
  const type = $('noiseType').value;
  noiseSource = ctx.createBufferSource();
  noiseSource.buffer = makeNoiseBuffer(ctx, type);
  noiseSource.loop = true;
  noiseFilter = ctx.createBiquadFilter();
  if(type === 'pink'){
    noiseFilter.type = 'lowshelf'; noiseFilter.frequency.value = 1000; noiseFilter.gain.value = -3;
  } else if(type === 'brown'){
    noiseFilter.type = 'lowpass'; noiseFilter.frequency.value = 500;
  } else {
    noiseFilter.type = 'allpass'; noiseFilter.frequency.value = 1000;
  }
  noiseGain = ctx.createGain();
  noiseGain.gain.value = Math.pow(volSlider.value / 100, 2);
  noiseSource.connect(noiseFilter).connect(noiseGain).connect(ctx.destination);
  noiseSource.start();
  $('btnNoise').disabled = true; $('btnNoiseStop').disabled = false;
  $('noiseStatus').textContent = `Ruido ${ {white:'blanco',pink:'rosa',brown:'marrÃ³n'}[type] } en reproducciÃ³n (loop).`;
  toast('Ruido iniciado âœ“');
}

function stopNoiseNodes(){
  if(noiseSource){ try{ noiseSource.stop(); }catch(e){} noiseSource.disconnect(); noiseSource = null; }
  if(noiseFilter){ noiseFilter.disconnect(); noiseFilter = null; }
  if(noiseGain){ noiseGain.disconnect(); noiseGain = null; }
}

function stopNoise(){
  stopNoiseNodes();
  $('btnNoise').disabled = false; $('btnNoiseStop').disabled = true;
  $('noiseStatus').textContent = 'El ruido se genera localmente con Web Audio API.';
}
$('btnNoise').addEventListener('click', startNoise);
$('btnNoiseStop').addEventListener('click', () => { stopNoise(); toast('Ruido detenido'); });
$('noiseType').addEventListener('change', () => {
  // Reinicia con el nuevo tipo si estaba sonando
  if(!$('btnNoise').disabled) startNoise();
});
</script>
