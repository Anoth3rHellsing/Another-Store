<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Textify — OCR Aero Glass</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --cDeep:#07405E; --cInk:#0B5C8A; --cBlue2:#1F86C8; --cGreen2:#4CA22B;
    --cAmber2:#E08C1E; --cRed2:#C63C22; --Muted:#2C5F7E;
    --shadow:0 2px 16px rgba(10,58,86,.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    color:var(--cDeep);
    background:
      linear-gradient(0deg, rgba(151,220,95,.85) 0%, rgba(103,208,196,.82) 18%, rgba(77,187,236,.82) 40%, rgba(149,217,246,.85) 70%, rgba(227,244,253,.89) 100%),
      linear-gradient(105deg,#E3F4FD 0%, #95D9F6 30%, #4DBBEC 60%, #67D0C4 82%, #97DC5F 100%);
    background-blend-mode:normal;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* TopGloss overlay */
  body::before{
    content:""; position:fixed; top:0; left:0; right:0; height:170px; pointer-events:none; z-index:0;
    background:linear-gradient(180deg, rgba(255,255,255,.63) 0%, rgba(255,255,255,.26) 55%, transparent 100%);
  }
  /* Bubbles */
  .bubble{position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle at 35% 30%, #fff 0%, var(--t) 58%, transparent 100%);}
  .b1{width:300px;height:300px; left:-70px; top:38%; opacity:.30; --t:rgba(111,199,240,.9);}
  .b2{width:380px;height:380px; right:-90px; top:-110px; opacity:.26; --t:rgba(182,231,122,.9);}
  .b3{width:180px;height:180px; left:52%; bottom:-60px; opacity:.22; --t:rgba(255,217,122,.9);}

  .window{
    position:relative; z-index:1; max-width:980px; margin:46px auto; padding:0 24px 60px;
  }
  .titlebar{display:flex; align-items:center; gap:12px; height:46px; padding:0 6px;}
  .titlebar .logo{width:26px;height:26px;border-radius:7px;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);
    border:1px solid rgba(255,255,255,.55); box-shadow:var(--shadow);
    display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;}
  .titlebar h1{font-size:25px; font-weight:300; color:var(--cDeep);}
  .titlebar h1 b{font-weight:600;}
  .titlebar .sub{margin-left:auto; font-size:12.5px; color:var(--Muted);}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.93) 0%, rgba(255,255,255,.77) 45%, rgba(235,248,255,.69) 100%);
    border:1px solid rgba(255,255,255,.5);
    border-radius:14px; padding:18px; box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
    margin-bottom:18px;
  }
  h2{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--cDeep);}

  .dropzone{
    border:2px dashed rgba(140,255,255,255,.0); border-color:rgba(44,95,126,.35);
    border-radius:12px; min-height:150px; padding:26px; text-align:center;
    background:rgba(255,255,255,.35); cursor:pointer; transition:.2s;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  }
  .dropzone:hover,.dropzone.over{background:rgba(255,255,255,.55); border-color:var(--cBlue2);}
  .dropzone .icon{font-size:34px;}
  .dropzone p{font-size:13.5px;} .dropzone small{font-size:12.5px; color:var(--Muted);}
  .preview{max-width:100%; max-height:260px; border-radius:8px; box-shadow:var(--shadow); margin-top:10px;}

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px;}
  select{
    height:34px; padding:0 10px; border-radius:8px; border:1px solid rgba(140,255,255,255,.5);
    border-color:rgba(44,95,126,.30); background:rgba(255,255,255,.70); color:var(--cDeep);
    font-family:inherit; font-size:13px;
  }

  /* Gloss buttons */
  .btn{
    position:relative; height:40px; padding:0 22px; border:none; border-radius:9px;
    font-family:inherit; font-size:13.5px; color:#fff; cursor:pointer; overflow:hidden;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    transition:transform .05s, filter .15s;
  }
  .btn::before{content:""; position:absolute; inset:0; border-radius:8px; opacity:0;
    background:rgba(255,255,255,.24); transition:.15s;}
  .btn:hover::before{opacity:1;}
  .btn:active{transform:translateY(1px); filter:brightness(.92);}
  .btn:disabled{opacity:.45; cursor:default; transform:none;}
  .btn .shine{position:absolute; left:1px; right:1px; top:1px; height:17px; border-radius:8px 8px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.22) 48%, transparent 50%); pointer-events:none;}
  .btn-blue{background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%);}
  .btn-green{background:linear-gradient(180deg,#CBF08F 0%,#74C23C 49%,#4E9C22 51%,#7FCF43 100%);}
  .btn-amber{background:linear-gradient(180deg,#FFE6A8 0%,#F0A93A 49%,#D5871B 51%,#F7B950 100%);}
  .btn-red{background:linear-gradient(180deg,#FFB6A6 0%,#DD5C3E 49%,#B63B22 51%,#E0704F 100%);}

  .btn-ghost{
    height:34px; padding:0 16px; border-radius:8px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.4); color:var(--cDeep); font-family:inherit; font-size:13px; cursor:pointer; transition:.15s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.67);}

  textarea{
    width:100%; min-height:220px; resize:vertical; padding:12px;
    border-radius:8px; border:1px solid rgba(140,255,255,255,.5); border-color:rgba(44,95,126,.25);
    background:rgba(255,255,255,.70); color:var(--cDeep);
    font-family:Consolas,monospace; font-size:13px; line-height:1.5;
  }
  textarea:focus{outline:2px solid rgba(31,134,200,.45); outline-offset:-1px;}

  /* Progress bar */
  .bar{height:10px; border-radius:6px; background:rgba(255,255,255,.35);
    border:1px solid rgba(255,255,255,.45); overflow:hidden; margin-top:14px; display:none;}
  .bar .fill{height:100%; width:0%; border-radius:5px; position:relative;
    background:linear-gradient(180deg,#8FD9F7 0%,#39A5DC 49%,#1B7FC0 51%,#39B0E4 100%); transition:width .2s;}
  .bar .fill::after{content:""; position:absolute; top:0; left:0; right:0; height:4px;
    background:rgba(255,255,255,.55); border-radius:5px 5px 0 0;}
  .status{font-size:12.5px; color:var(--Muted); margin-top:8px; min-height:16px;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(255,255,255,.9); backdrop-filter:blur(10px); color:var(--cDeep);
    border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:10px 20px;
    box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:9;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>

<div class="window">
  <div class="titlebar">
    <div class="logo">T</div>
    <h1>Text<b>ify</b></h1>
    <span class="sub">Imagen → texto plano · Aero Glass</span>
  </div>

  <div class="card">
    <h2>1 · Carga una imagen</h2>
    <div id="dropzone" class="dropzone">
      <div class="icon">🖼️</div>
      <p>Arrastra una imagen aquí, pégala con <b>Ctrl+V</b> o haz clic para elegir un archivo</p>
      <small>PNG · JPG · BMP · WebP — todo se procesa localmente en tu navegador</small>
      <img id="preview" class="preview" style="display:none" alt="Vista previa">
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="row">
      <select id="lang" title="Idioma del texto">
        <option value="spa">Español</option>
        <option value="eng" selected>Inglés</option>
        <option value="spa+eng">Español + Inglés</option>
        <option value="fra">Francés</option>
        <option value="deu">Alemán</option>
        <option value="por">Portugués</option>
        <option value="ita">Italiano</option>
      </select>
      <button id="btnRun" class="btn btn-blue" disabled><span class="shine"></span>Extraer texto</button>
      <button id="btnClear" class="btn-ghost">Limpiar</button>
    </div>
    <div id="bar" class="bar"><div id="fill" class="fill"></div></div>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h2>2 · Texto extraído</h2>
    <textarea id="output" placeholder="El texto reconocido aparecerá aquí…" spellcheck="false"></textarea>
    <div class="row">
      <button id="btnCopy" class="btn btn-green" disabled><span class="shine"></span>Copiar</button>
      <button id="btnDownload" class="btn btn-amber" disabled><span class="shine"></span>Descargar .txt</button>
      <button id="btnClearOut" class="btn-ghost">Vaciar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const dz = $('dropzone'), fileInput = $('file'), preview = $('preview');
const btnRun = $('btnRun'), output = $('output'), status = $('status');
const bar = $('bar'), fill = $('fill');
let imageFile = null;

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

function setImage(file){
  if(!file || !file.type.startsWith('image/')) return;
  imageFile = file;
  const url = URL.createObjectURL(file);
  preview.src = url; preview.style.display = 'block';
  btnRun.disabled = false;
  status.textContent = `Imagen cargada: ${file.name || 'portapapeles'} (${(file.size/1024).toFixed(0)} KB)`;
}

dz.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => setImage(e.target.files[0]));
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('over');
  setImage(e.dataTransfer.files[0]);
});
window.addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if(item) setImage(item.getAsFile());
});

$('btnClear').addEventListener('click', () => {
  imageFile = null; preview.style.display='none'; preview.src='';
  fileInput.value=''; btnRun.disabled=true; status.textContent=''; bar.style.display='none';
});

btnRun.addEventListener('click', async () => {
  if(!imageFile) return;
  btnRun.disabled = true; output.value = ''; bar.style.display = 'block'; fill.style.width = '0%';
  status.textContent = 'Cargando motor OCR (solo la primera vez)…';
  try{
    const res = await Tesseract.recognize(imageFile, $('lang').value, {
      logger: m => {
        if(m.status === 'recognizing text'){
          fill.style.width = (m.progress*100).toFixed(1) + '%';
          status.textContent = `Reconociendo texto… ${(m.progress*100).toFixed(0)}%`;
        } else {
          status.textContent = m.status.replace(/\b\w/g,c=>c.toUpperCase()) + '…';
        }
      }
    });
    output.value = res.data.text.trim();
    fill.style.width = '100%';
    status.textContent = `Listo — ${res.data.text.trim().split(/\s+/).filter(Boolean).length} palabras · ${res.data.confidence.toFixed(0)}% de confianza`;
    $('btnCopy').disabled = $('btnDownload').disabled = !output.value;
    toast('Texto extraído ✓');
  }catch(err){
    status.textContent = 'Error: ' + err.message;
    toast('Ocurrió un error durante el OCR');
  }finally{
    btnRun.disabled = false;
  }
});

$('btnCopy').addEventListener('click', async () => {
  await navigator.clipboard.writeText(output.value);
  toast('Copiado al portapapeles ✓');
});
$('btnDownload').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([output.value], {type:'text/plain;charset=utf-8'}));
  a.download = 'textify.txt'; a.click();
});
$('btnClearOut').addEventListener('click', () => {
  output.value = ''; $('btnCopy').disabled = $('btnDownload').disabled = true;
});
</script>
</body>
</html>
